name: Publish

# Publishes @arjanj/loupe to npm via trusted publishing (OIDC).
# No npm token is stored or used: npm exchanges the GitHub OIDC token for a
# short-lived publish credential. The workflow filename (publish.yml) must match
# the Trusted Publisher config on npmjs.com.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (default on): install, test and pack/validate with npm publish --dry-run, without publishing. Uncheck only on main to publish for real.'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 24 ships npm >= 11.5.1, which trusted publishing requires.
      # No package-manager cache in release builds.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

      # Only releases have a tag; workflow_dispatch runs skip this check.
      - name: Check release tag matches package.json version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag_version="${RELEASE_TAG#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Release tag '$RELEASE_TAG' (version $tag_version) does not match package.json version $pkg_version."
            exit 1
          fi
          echo "Release tag $RELEASE_TAG matches package.json version $pkg_version."

      # A manual run with dry_run unchecked is only allowed from main, so a
      # feature-branch dispatch cannot publish. Releases already publish the
      # tagged commit after the version guard above.
      - name: Refuse a real publish from a non-main ref
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && github.ref != 'refs/heads/main'
        run: |
          echo "::error::A real publish from workflow_dispatch is only allowed from main (got ${GITHUB_REF}). Keep dry_run checked, or run the workflow from main."
          exit 1

      # Dry run lets a maintainer validate the package contents and publish
      # path from workflow_dispatch without uploading anything. dry_run
      # defaults to true so an accidental Actions-UI run cannot publish.
      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run --access public

      # Provenance is generated automatically with trusted publishing, so no
      # --provenance flag. No NODE_AUTH_TOKEN: a token would override OIDC.
      # Real publishes: GitHub Releases, or a manual run from main with
      # dry_run unchecked.
      - name: Publish
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run && github.ref == 'refs/heads/main')
        run: npm publish --access public
