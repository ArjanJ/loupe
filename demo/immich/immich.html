d with progress callbacks and abortable requests. Holds the current shared link and builds asset thumbnail, original, playback and HLS URLs via @immich/sdk path helpers, respecting the alwaysLoadOriginalFile preference.","functions":["initLanguage()","uploadRequest()","downloadRequest()","cancelUploadRequests()","getAssetUrl()","getAssetMediaUrl()"],"children":[],"edges":[]},{"id":"file:web/src/lib/constants.ts","label":"constants","kind":"file","path":"web/src/lib/constants.ts","weight":297,"shortDescription":"Shared enums, regexes, date formats and timing constants for the web app.","longDescription":"Central definitions for UUID validation, asset actions, panorama projection types, URL query parameter names, session storage keys and settings deep-link params. Provides Intl date format presets for albums and settings, plus tuning values such as debounce, spinner delay, batch delay and page sizes used across components.","functions":["UUID_REGEX","AssetAction","ProjectionType","QueryParameter","dateFormats","OpenQueryParam"],"children":[],"edges":[]},{"id":"file:web/src/lib/utils/asset-utils.ts","label":"asset utils","kind":"file","path":"web/src/lib/utils/asset-utils.ts","weight":309,"shortDescription":"Asset helpers for downloads, metadata formatting, archiving and selection.","longDescription":"Requests download info and streams archives through downloadManager, computes filenames, dimensions, file sizes and aspect ratios from asset DTOs, and detects browser-compatible image formats. Also performs bulk actions like archive toggling and select-all on the timeline, using TimelineManager, eventManager, executeMutation and toast notifications for feedback.","functions":["downloadArchive()","getAssetFilename()","getAssetRatio()","isWebCompatibleImage()","toggleArchive()","selectAllAssets()"],"children":[],"edges":[]},{"id":"file:web/src/lib/utils/timeline-util.ts","label":"timeline utils","kind":"file","path":"web/src/lib/utils/timeline-util.ts","weight":190,"shortDescription":"Date parsing and formatting helpers for the timeline and its scrubber.","longDescription":"Defines plain year/month/date-time types used by the timeline and converts ISO strings to Luxon DateTimes in UTC or a given zone using the preferred locale. Computes local times from UTC offsets, formats month and day group titles, and converts AssetResponseDto into TimelineAsset objects for TimelineManager.","functions":["fromISODateTime()","fromISODateTimeUTC()","getTimes()","formatTimelineMonthTitle()","formatGroupTitle()","toTimelineAsset()"],"children":[],"edges":[]},{"id":"file:web/src/lib/utils/album-utils.ts","label":"album utils","kind":"file","path":"web/src/lib/utils/album-utils.ts","weight":218,"shortDescription":"Album creation, sorting, grouping and group collapse state helpers.","longDescription":"Creates albums via executeMutation and redirects to the new album route. Defines metadata for sort options (default order, column styles) and group-by options, and reads or updates albumViewSettings in the preferences store to track collapsed album groups. Uses lodash orderBy for sorting album lists.","functions":["createAlbumAndRedirect()","sortOptionsMetadata","groupOptionsMetadata","getSelectedAlbumGroupOption()","toggleAlbumGroupCollapsing()","stringToSortOrder()"],"children":[],"edges":[]},{"id":"file:web/src/lib/utils/duplicate-utils.ts","label":"duplicate utils","kind":"file","path":"web/src/lib/utils/duplicate-utils.ts","weight":269,"shortDescription":"Compares metadata across duplicate assets to highlight differing fields.","longDescription":"Declares a table of metadata fields (filename, path, dates, camera, lens, GPS, size, resolution and more), each with an MDI icon, i18n title key and render function. Computes which fields differ between duplicate assets so the duplicates UI can show only meaningful differences, using timeline-util date parsing and asset-utils size and resolution helpers.","functions":["computeDifferingMetadataFields()","countDifferingMetadataItems()","getAllMetadataItems()","metadataKeys"],"children":[],"edges":[]},{"id":"file:web/src/lib/utils/handle-error.ts","label":"handle error","kind":"file","path":"web/src/lib/utils/handle-error.ts","weight":61,"shortDescription":"Normalizes errors, extracts server messages and shows error toasts.","longDescription":"Parses Immich HTTP errors, including stringified JSON bodies and per-field validation errors, into readable messages. handleError logs the error, ignores AbortError, truncates server messages, and shows a danger toast via @immich/ui unless notification is disabled. An async variant wraps promises with the same behavior.","functions":["getServerErrorMessage()","standardizeError()","handleError()","handleErrorAsync()"],"children":[],"edges":[]},{"id":"file:web/src/lib/utils/navigation.ts","label":"navigation","kind":"file","path":"web/src/lib/utils/navigation.ts","weight":127,"shortDescription":"Route detection and asset-aware navigation helpers for SvelteKit.","longDescription":"Provides predicates identifying photos, shared link, album, people, locked folder and asset viewer routes from SvelteKit route ids. Builds URLs with or without an asset id, with special handling for the /photos route and shared link slugs, and updates query parameters through goto. Resolves assets from route params via assetCacheManager.","functions":["isAssetViewerRoute()","getAssetInfoFromParam()","currentUrlReplaceAssetId()","navigate()","setQueryValue()","clearQueryParam()"],"children":[],"edges":[]},{"id":"file:web/src/lib/types.ts","label":"types","kind":"file","path":"web/src/lib/types.ts","weight":94,"shortDescription":"Shared TypeScript types for uploads, search filters, queues and schemas.","longDescription":"Declares cross-cutting web types: the UploadState enum and UploadAsset record tracking progress, speed and errors; search filter shapes for camera, date, location and display options; people filters; queue snapshots; onboarding roles; and JSON schema types used for dynamic configuration forms.","functions":["UploadState","UploadAsset","SearchFilter","PeopleFilter","QueueSnapshot","JSONSchemaType"],"children":[],"edges":[]},{"id":"file:web/src/lib/utils/file-uploader.ts","label":"file uploader","kind":"file","path":"web/src/lib/utils/file-uploader.ts","weight":217,"shortDescription":"Client-side file picking and queued asset uploads to the server.","longDescription":"Opens a hidden file input to pick files, then uploads them through an ExecutorQueue with concurrency 2. Checks duplicates via checkBulkUpload using file checksums, sends files with uploadRequest, updates uploadAssetsStore states and uploadManager, and optionally adds uploaded assets to an album. Errors are reported through handleError and toasts.","functions":["uploadExecutionQueue","openFilePicker()","openFileUploadDialog()","fileUploadHandler()"],"children":[],"edges":[]},{"id":"file:web/src/lib/utils/container-utils.ts","label":"container utils","kind":"file","path":"web/src/lib/utils/container-utils.ts","weight":107,"shortDescription":"Geometry helpers mapping normalized coordinates onto scaled image content.","longDescription":"Documents and converts between normalized, content, natural and metadata pixel coordinate spaces used by the asset viewer. Implements fit and cover scaling, reads natural image or video size, computes centered content offsets, and maps normalized points and rects to container pixels for face and OCR overlays.","functions":["scaleToFit()","scaleToCover()","getNaturalSize()","getContentMetrics()","mapNormalizedToContent()","mapNormalizedRectToContent()"],"children":[],"edges":[]},{"id":"file:web/src/lib/utils/ocr-utils.ts","label":"ocr utils","kind":"file","path":"web/src/lib/utils/ocr-utils.ts","weight":155,"shortDescription":"Positions and sizes OCR text overlays over images using perspective transforms.","longDescription":"Converts OCR bounding boxes into content-space polygons via container-utils, detects vertical text with CJK versus rotated handling based on aspect ratio, and computes a CSS matrix3d perspective transform mapping a text div onto the four-point polygon. Also fits font size to box dimensions so selectable text aligns with the image.","functions":["getOcrBoundingBoxes()","calculateBoundingBoxMatrix()","calculateFittedFontSize()","OcrBox","VerticalMode"],"children":[],"edges":[]},{"id":"more:web:utilities","label":"+40 more files","kind":"file","path":"web/src/lib/utils/cast","weight":429,"shortDescription":"40 smaller files in this module.","longDescription":"gcast-destination.svelte.ts, adaptive-image-loader.svelte.ts, i18n.ts, tree-utils.ts, actions.ts, layout-utils.ts, cancellable-task.ts, workflow.ts, places-utils.ts, byte-units.ts, base-event-manager.svelte.ts, people-utils.ts, persisted.ts, shared-links.ts, executor-queue.ts, focus-util.ts, date-time.ts, invocationTracker.ts, thumbnail-util.ts, person.ts, license-utils.ts, wakelock.svelte.ts, hash-file.ts, context-menu.ts, editor.ts, sw-messenger.ts, auth.ts, tunables.ts, string-utils.ts, index.ts, slideshow-history.ts, ui-translations.ts, camera-utils.ts, client.ts, eventemitter.ts, purchase-utils.ts, maintenance.ts, draft.svelte.ts, sw-messaging.ts, timesince.ts","functions":[],"children":[],"edges":[]}],"edges":[{"from":"more:web:utilities","to":"file:web/src/lib/utils/handle-error.ts","weight":1},{"from":"file:web/src/lib/utils/asset-utils.ts","to":"file:web/src/lib/utils/handle-error.ts","weight":1},{"from":"file:web/src/lib/utils/file-uploader.ts","to":"file:web/src/lib/utils/handle-error.ts","weight":1}]}],"edges":[{"from":"mod:web:media-viewer","to":"mod:web:ui-components","weight":4},{"from":"mod:web:ui-components","to":"mod:web:media-viewer","weight":3},{"from":"mod:web:modals","to":"mod:web:media-viewer","weight":3},{"from":"mod:web:modals","to":"mod:web:ui-components","weight":3},{"from":"mod:web:modals","to":"mod:web:state-managers","weight":1}]},{"id":"pkg:packages/cli","label":"Immich CLI","kind":"package","path":"packages/cli","packageName":"@immich/cli","weight":1100,"shortDescription":"Command-line tool for uploading media and managing auth against an Immich server.","longDescription":"Node CLI built on the generated Immich open-api client. Provides login/logout, server info, and bulk asset upload with watch mode, duplicate checking, sidecar detection, and album assignment. Uploads run through a concurrency-limited task queue, and credentials persist in a local auth file.","children":[{"id":"mod:packages/cli:cli-entry","label":"CLI Entry","kind":"module","path":"packages/cli/src","weight":92,"shortDescription":"Defines the command-line program and wires subcommands to handlers.","longDescription":"Parses arguments and options for login, logout, server-info and upload, then dispatches to command handlers. Applies shared base options such as the config directory, server URL and API key, which are passed to the auth utilities.","children":[{"id":"file:packages/cli/src/index.ts","label":"CLI Entry","kind":"file","path":"packages/cli/src/index.ts","weight":92,"shortDescription":"Defines the immich commander program and routes subcommands to their command handlers.","longDescription":"Builds a commander Command with global options for config directory, server URL and API key, each overridable via IMMICH_* environment variables. Registers login, logout, server-info and upload subcommands, passing parsed arguments plus program.opts() to handlers in src/commands. Defaults concurrency to CPU count minus one and reads the version from package.json.","functions":["program","login()","logout()","serverInfo()","upload()"],"children":[],"edges":[]}],"edges":[]},{"id":"mod:packages/cli:commands","label":"Commands","kind":"module","path":"packages/cli/src/commands","weight":578,"shortDescription":"Implements upload, authentication and server-info subcommands.","longDescription":"asset.ts crawls paths and checks hashes against the server to find duplicates. It uploads files with sidecars, optionally deletes originals, assigns albums from folder names, and supports a filesystem watch mode. auth.ts stores or removes credentials. server-info.ts reports server version and statistics. All commands use utils for connection and the queue for concurrency.","children":[{"id":"file:packages/cli/src/commands/asset.ts","label":"asset","kind":"file","path":"packages/cli/src/commands/asset.ts","weight":512,"shortDescription":"Uploads local media files to an Immich server, with optional watch mode.","longDescription":"Crawls directories for supported media types, hashes files with SHA-1, and calls checkBulkUpload to skip duplicates before uploading in concurrent batches through a Queue. Handles sidecar detection, album creation from folder names, deletion of uploaded or duplicate files, and cli-progress bars. Watch mode uses chokidar with a debounced Batcher to upload new files in groups of 100.","functions":["upload()","startWatch()","checkForDuplicates()","uploadFiles()","findSidecar()","getAlbumName()"],"children":[],"edges":[]},{"id":"file:packages/cli/src/commands/auth.ts","label":"auth","kind":"file","path":"packages/cli/src/commands/auth.ts","weight":44,"shortDescription":"Logs in with a server URL and API key, or logs out.","longDescription":"login connects to the server, verifies the key has UserRead permission, fetches the current user via getMyUser, creates the config directory if needed, and writes the URL and key to the auth file. logout deletes the auth file from the configured directory if it exists. Exits the process on failure to load user info.","functions":["login()","logout()"],"children":[],"edges":[]},{"id":"file:packages/cli/src/commands/server-info.ts","label":"server-info","kind":"file","path":"packages/cli/src/commands/server-info.ts","weight":22,"shortDescription":"Prints server version, supported formats, and asset statistics for the user.","longDescription":"Authenticates from stored credentials, checks ServerAbout, AssetStatistics and UserRead permissions, then fetches server version, supported media types, asset statistics and current user in parallel via the @immich/sdk. Writes a formatted summary to the console.","functions":["serverInfo()"],"children":[],"edges":[]}],"edges":[]},{"id":"mod:packages/cli:core","label":"Core Utilities","kind":"module","path":"packages/cli/src","weight":355,"shortDescription":"Shared auth, server connection, error logging and task queue helpers.","longDescription":"utils.ts handles login session files, authenticates with an API key, checks permissions, configures the open-api SDK connection, and formats errors. queue.ts provides a generic concurrency-limited Queue with retries that is used for batched hashing and uploads.","children":[{"id":"file:packages/cli/src/utils.ts","label":"utils","kind":"file","path":"packages/cli/src/utils.ts","weight":240,"shortDescription":"Shared CLI helpers for authentication, server connection, auth files, file crawling and hashing.","longDescription":"Resolves credentials from command options or a YAML auth file in the config directory, connects via @immich/sdk init and verifies the API key. Checks API key permissions with a cached getMyApiKey result, logs SDK HTTP and malformed-response errors, crawls paths with fast-glob, computes SHA-1 checksums from file streams, and provides a Batcher for grouping items.","functions":["authenticate()","connect()","requirePermissions()","crawl()","sha1()","Batcher"],"children":[],"edges":[]},{"id":"file:packages/cli/src/queue.ts","label":"queue","kind":"file","path":"packages/cli/src/queue.ts","weight":115,"shortDescription":"In-memory concurrent task queue with retries, built on fastq.","longDescription":"Generic Queue\u003cT, R> class that wraps a fastq promise queue and runs a worker function with configurable concurrency, retry count and verbosity. Each task is tracked in a Map with id, status, data, result, error and attempt count, so callers can inspect progress through tasks and getTask. Defaults are concurrency 1 with no retries.","functions":["Queue","Task","QueueOptions","defaultQueueOptions"],"children":[],"edges":[]}],"edges":[]},{"id":"mod:packages/cli:tooling","label":"Build Tooling","kind":"module","path":"packages/cli","weight":75,"shortDescription":"Build, test and lint configuration for the CLI package.","longDescription":"vite.config.ts bundles the CLI into dist and configures vitest. eslint.config.mjs sets the TypeScript lint rules. Neither file ships as runtime code.","children":[{"id":"file:packages/cli/eslint.config.mjs","label":"ESLint Config","kind":"file","path":"packages/cli/eslint.config.mjs","weight":51,"shortDescription":"Flat ESLint config combining TypeScript, Unicorn, and Prettier rules for the CLI.","longDescription":"Builds the lint setup with typescriptEslint.config(), layering unicorn, prettier, core JS and typescript-eslint recommended presets. Enables type-aware linting via parserOptions.project pointing at tsconfig.json, with Node globals. Disables several opinionated unicorn rules, enforces no-floating-promises, curly braces, and the type-aware require-array-sort-compare instead of unicorn's version. Ignores dist and itself.","functions":["default","typescriptEslint.config()"],"children":[],"edges":[]},{"id":"file:packages/cli/vite.config.ts","label":"Vite Config","kind":"file","path":"packages/cli/vite.config.ts","weight":24,"shortDescription":"Vite build and Vitest config bundling the CLI into a single SSR Node output.","longDescription":"Uses defineConfig() to build src/index.ts in SSR mode via rolldownOptions, writing to dist. ssr.noExternal bundles every dependency except node: built-ins, producing a self-contained CLI artifact. Resolves the src alias and tsconfig paths, and configures Vitest with the 'cli:unit' project name and global test APIs.","functions":["default","defineConfig()"],"children":[],"edges":[]}],"edges":[]}],"edges":[]},{"id":"pkg:packages/plugin-core","label":"Immich Core Plugin","kind":"package","path":"packages/plugin-core","packageName":"@immich/plugin-core","weight":259,"shortDescription":"Built-in Immich plugin providing core workflow filters and actions, compiled for the plugin runtime.","longDescription":"Bundles Immich's default plugin functionality as a single TypeScript entry point that the server's plugin host loads. Exposes core functions used by automation workflows, such as filtering and acting on assets. An esbuild script compiles the source into a self-contained bundle for the plugin runtime.","children":[{"id":"mod:packages/plugin-core:plugin-functions","label":"Plugin Functions","kind":"module","path":"packages/plugin-core/src","weight":249,"shortDescription":"Core plugin entry point exporting workflow filter and action functions.","longDescription":"Implements the plugin's exported functions in one file, which the Immich plugin host invokes during workflow execution. Reads input passed from the host, evaluates asset conditions or performs actions, and returns results to the host. Keeping all functions in a single entry file allows them to be bundled as one plugin artifact.","children":[{"id":"file:packages/plugin-core/src/index.ts","label":"Core Plugin Entry","kind":"file","path":"packages/plugin-core/src/index.ts","weight":249,"shortDescription":"Defines built-in workflow filter and action functions for the Immich core plugin.","longDescription":"Implements the core plugin's workflow steps using the wrapper from @immich/plugin-sdk, typed against the generated Manifest. Shared helpers listMatching() (all/any/none semantics) and matchValueResult() (contains, exact, startsWith, regex, present, missing, optional case sensitivity) return workflow continue decisions. Actions use @immich/sdk types such as AssetVisibility to modify assets.","functions":["listMatching()","matchValueResult()","wrapper()"],"children":[],"edges":[]}],"edges":[]},{"id":"mod:packages/plugin-core:build","label":"Build Config","kind":"module","path":"packages/plugin-core","weight":10,"shortDescription":"esbuild script bundling the plugin source into a deployable artifact.","longDescription":"Small esbuild configuration that takes src/index.ts and emits a single bundled output for the plugin runtime. Inlines dependencies so the server can load the plugin without resolving node modules at runtime.","children":[{"id":"file:packages/plugin-core/esbuild.js","label":"esbuild","kind":"file","path":"packages/plugin-core/esbuild.js","weight":10,"shortDescription":"Bundles the plugin's TypeScript source into a single CommonJS file in dist.","longDescription":"Calls esbuild.build() with src/index.ts as the entry point and writes the bundled output to dist. The output is CommonJS and targets ES2020, because the QuickJS runtime that executes plugins supports neither ESM output nor newer syntax. Sourcemaps and minification are disabled, and a comment notes that minify could be turned on for production builds.","functions":["esbuild.build()"],"children":[],"edges":[]}],"edges":[]}],"edges":[]},{"id":"pkg:packages/plugin-sdk","label":"Immich Plugin SDK","kind":"package","path":"packages/plugin-sdk","packageName":"@immich/plugin-sdk","weight":378,"shortDescription":"TypeScript SDK and build tooling for writing Immich workflow plugins compiled to WebAssembly.","longDescription":"Provides typed workflow event definitions, wrappers for plugin entry points, and bindings to host functions exposed by the Immich server. Includes a CLI and esbuild-based bundling so plugin authors can build manifests and packages. Plugins run in a sandboxed runtime and call back into the host through declared functions.","children":[{"id":"mod:packages/plugin-sdk:workflow-types","label":"Workflow Types","kind":"module","path":"packages/plugin-sdk/src","weight":133,"shortDescription":"Type definitions for workflow events, triggers, payloads, changes, and step configuration.","longDescription":"Declares the event map linking triggers to their data payloads, plus response and change shapes that plugin steps return. Also defines step config and config value types. Shared by the SDK wrapper and host function bindings so plugin code and server agree on a typed contract.","children":[{"id":"file:packages/plugin-sdk/src/types.ts","label":"types","kind":"file","path":"packages/plugin-sdk/src/types.ts","weight":133,"shortDescription":"Type definitions for workflow triggers, event payloads, step responses, and configuration values.","longDescription":"Defines the contract between the Immich server and plugin workflow steps: the WorkflowTrigger enum, the payload a step receives (trigger, typed data, config, workflow id/auth token), and the WorkflowResponse a step returns (continue flag, changes, data, config). Maps WorkflowType from @immich/sdk to event data shapes such as AssetV1, and uses a recursive DeepPartial so changes can be partial asset updates.","functions":["WorkflowTrigger","WorkflowEventPayload","WorkflowResponse","WorkflowChanges","WorkflowStepConfig","AssetV1"],"children":[],"edges":[]}],"edges":[]},{"id":"mod:packages/plugin-sdk:plugin-runtime","label":"Plugin Runtime","kind":"module","path":"packages/plugin-sdk/src","weight":196,"shortDescription":"Wraps plugin step functions and exposes host function bindings to plugin code.","longDescription":"The wrapper in sdk.ts adapts author-written handlers to the runtime calling convention, decoding input events and encoding workflow responses. host-functions.ts declares the functions the Immich host provides and lists them in availableFunctions. index.ts re-exports the public API for plugin authors.","children":[{"id":"file:packages/plugin-sdk/src/index.ts","label":"index","kind":"file","path":"packages/plugin-sdk/src/index.ts","weight":3,"shortDescription":"Barrel entry point re-exporting the plugin SDK's host functions, wrapper, and types.","longDescription":"Public entry for @immich/plugin-sdk. Re-exports everything from host-functions, sdk, and types so plugin authors import a single module. Contains no logic of its own.","functions":[],"children":[],"edges":[]},{"id":"file:packages/plugin-sdk/src/host-functions.ts","label":"host-functions","kind":"file","path":"packages/plugin-sdk/src/host-functions.ts","weight":98,"shortDescription":"Typed bindings that let plugin code call Immich host functions via Extism.","longDescription":"Declares the allowed host function names (album search/creation, adding assets to albums, bulk tagging, HTTP requests) and augments the extism:host module typing. hostFunctions() builds a client bound to an auth token that serializes {authToken, args} into Extism Memory, invokes the host, and parses a success/error result envelope, throwing on failure. Reuses DTO types from @immich/sdk.","functions":["hostFunctions()","availableFunctions"],"children":[],"edges":[]},{"id":"file:packages/plugin-sdk/src/sdk.ts","label":"sdk","kind":"file","path":"packages/plugin-sdk/src/sdk.ts","weight":95,"shortDescription":"Wraps plugin workflow step methods with typed config and host function access.","longDescription":"Exports wrapper(), which takes a map of named step methods and adapts them into plugin exports that receive a WorkflowEventPayload plus bound host functions. Heavy type-level machinery (Property, GetConfigType, ConfigValue, RequiredProperties) derives each step's config type from its JSON-schema-like definition, enforcing required versus optional fields at compile time.","functions":["wrapper()"],"children":[],"edges":[]}],"edges":[]},{"id":"mod:packages/plugin-sdk:build-tooling","label":"Build Tooling","kind":"module","path":"packages/plugin-sdk","weight":49,"shortDescription":"CLI, manifest schema, and esbuild bundling used to package plugins.","longDescription":"cli.ts defines the Manifest type and command-line entry for building plugins. plugin-sdk.mjs is the executable launcher for that CLI. esbuild.js bundles the SDK sources into distributable output. Together they turn plugin source into an artifact the Immich server can load.","children":[{"id":"file:packages/plugin-sdk/src/cli.ts","label":"cli","kind":"file","path":"packages/plugin-sdk/src/cli.ts","weight":36,"shortDescription":"Commander CLI that generates Extism type declarations from a plugin manifest.","longDescription":"Defines the plugin-sdk command with a prepareBuild subcommand that reads manifest.json, extracts method names, and writes a .d.ts file (default dist/index.d.ts). The output declares 'extism:host' user functions from availableFunctions in host-functions.js, 'main' module exports returning I32, and a Manifest type inlined from the raw manifest JSON.","functions":["program","prepareBuild","Manifest","availableFunctions"],"children":[],"edges":[]},{"id":"file:packages/plugin-sdk/esbuild.js","label":"esbuild config","kind":"file","path":"packages/plugin-sdk/esbuild.js","weight":11,"shortDescription":"Bundles the SDK library and CLI entry points into ESM output in dist.","longDescription":"Invokes esbuild.build on src/index.ts and src/cli.ts, producing bundled, unminified ES2020 ESM modules targeting Node in the dist directory. Sourcemaps are disabled. Its dist/cli.js output is what the plugin-sdk.mjs bin shim loads.","functions":["esbuild.build()"],"children":[],"edges":[]},{"id":"file:packages/plugin-sdk/plugin-sdk.mjs","label":"bin shim","kind":"file","path":"packages/plugin-sdk/plugin-sdk.mjs","weight":2,"shortDescription":"Node executable entry point that loads the bundled CLI.","longDescription":"Two-line shebang script exposed as the package binary. It imports ./dist/cli.js, so the CLI runs from the esbuild output and not from TypeScript sources, which means a build must run before the command works.","functions":[],"children":[],"edges":[]}],"edges":[]}],"edges":[]},{"id":"pkg:packages/sdk","label":"Immich TypeScript SDK","kind":"package","path":"packages/sdk","packageName":"@immich/sdk","weight":9042,"shortDescription":"Typed TypeScript client for calling the Immich server REST API.","longDescription":"Wraps a generated fetch-based client covering every Immich API endpoint and DTO. A small hand-written entry point configures base URL, API key and headers globally and re-exports the generated functions. Error helpers classify HTTP and malformed responses. Consumed by the Immich CLI and web app.","children":[{"id":"mod:packages/sdk:generated-client","label":"Generated API Client","kind":"module","path":"packages/sdk/src","weight":8932,"shortDescription":"OpenAPI-generated endpoint functions and DTO types for the Immich API.","longDescription":"Machine-generated from the server's OpenAPI spec with oazapfts, exposing one async function per endpoint plus request/response DTO types and enums. Holds shared mutable `defaults` (baseUrl, headers, fetch) and `servers` that the entry module mutates. Not edited by hand; regenerated when the server API changes.","children":[{"id":"file:packages/sdk/src/fetch-client.ts","label":"fetch-client","kind":"file","path":"packages/sdk/src/fetch-client.ts","weight":8932,"shortDescription":"Generated typed fetch client exposing every Immich API endpoint and DTO type.","longDescription":"Generated by oazapfts from the Immich OpenAPI spec and marked do-not-modify. It declares TypeScript DTO types such as UserResponseDto, ActivityResponseDto and the AdminConfig* family. It also exports one async function per endpoint, built on the @oazapfts/runtime fetch wrapper and its query-string helpers. A shared mutable defaults object sets baseUrl ('/api') and headers, letting consumers configure auth and server location globally.","functions":["defaults","servers","UserResponseDto","ActivityResponseDto","ActivityCreateDto","AdminConfigFFmpegDto"],"children":[],"edges":[]}],"edges":[]},{"id":"mod:packages/sdk:sdk-entry","label":"SDK Entry Point","kind":"module","path":"packages/sdk/src","weight":74,"shortDescription":"Public entry that configures base URL, API key and headers for requests.","longDescription":"Re-exports the generated client and error helpers, and provides `init`, `setBaseUrl`, `setApiKey`, `setHeader(s)` and `getBaseUrl` that mutate the generated client's `defaults`. Also exposes `jsonOnly` for unwrapping responses. Gives consumers a single import surface with simple global configuration.","children":[{"id":"file:packages/sdk/src/index.ts","label":"SDK index","kind":"file","path":"packages/sdk/src/index.ts","weight":74,"shortDescription":"Configures base URL, API key and headers, and re-exports the generated fetch client.","longDescription":"Public entry point that re-exports the generated fetch-client and fetch-errors modules and mutates their shared defaults for base URL and headers. setApiKey() is the only way to set x-api-key; setHeader()/setHeaders() reject it. jsonOnly() wraps fetch to throw MalformedResponseError when a JSON response is expected but not returned. Also provides path helpers for asset originals, thumbnails, playback and profile images.","functions":["init()","setApiKey()","setHeaders()","setBaseUrl()","jsonOnly()","getAssetThumbnailPath()"],"children":[],"edges":[]}],"edges":[]},{"id":"mod:packages/sdk:fetch-errors","label":"Error Types","kind":"module","path":"packages/sdk/src","weight":36,"shortDescription":"Typed API error shapes and guards for HTTP and malformed responses.","longDescription":"Defines interfaces for validation and exception payloads returned by the server, an `ApiHttpError` shape, and a `MalformedResponseError` class. Type guards `isHttpError` and `isMalformedResponseError` let callers narrow caught errors from generated client calls without inspecting raw responses.","children":[{"id":"file:packages/sdk/src/fetch-errors.ts","label":"fetch-errors","kind":"file","path":"packages/sdk/src/fetch-errors.ts","weight":36,"shortDescription":"Defines typed API error shapes and type guards for HTTP and malformed responses.","longDescription":"Declares the server's exception payload (ApiExceptionResponse with optional ApiValidationError list) and ApiHttpError, which narrows oazapfts' HttpError to carry that payload. isHttpError() checks instanceof HttpError from @oazapfts/runtime. MalformedResponseError records url, status and content-type for responses that cannot be parsed, with a formatted message and its own isMalformedResponseError() guard.","functions":["isHttpError()","MalformedResponseError","isMalformedResponseError()","ApiHttpError","ApiExceptionResponse","ApiValidationError"],"children":[],"edges":[]}],"edges":[]}],"edges":[{"from":"mod:packages/sdk:sdk-entry","to":"mod:packages/sdk:generated-client","weight":1},{"from":"mod:packages/sdk:sdk-entry","to":"mod:packages/sdk:fetch-errors","weight":1}]},{"id":"pkg:external","label":"External services","kind":"package","external":true,"path":"outside the repo","weight":8833,"shortDescription":"Third-party services and backends Immich talks to.","longDescription":"Detected from SDK imports, API hosts, *_URL settings and webhook routes: Redis, Email provider, Realtime server.","children":[{"id":"ext:redis","label":"Redis","kind":"external","path":"external service","weight":69,"shortDescription":"Cache, queues and pub/sub.","longDescription":"","functions":[],"children":[],"edges":[]},{"id":"ext:email","label":"Email provider","kind":"external","path":"external service","weight":40,"shortDescription":"Transactional email (Resend, SendGrid, Postmark, Mailgun, SES).","longDescription":"","functions":[],"children":[],"edges":[]},{"id":"ext:realtime","label":"Realtime server","kind":"external","path":"external service","weight":40,"shortDescription":"WebSocket / Socket.IO connections.","longDescription":"","functions":[],"children":[],"edges":[]}],"edges":[]}],"edges":[{"from":"pkg:web","to":"pkg:packages/sdk","weight":283},{"from":"pkg:server","to":"pkg:packages/plugin-sdk","weight":10},{"from":"pkg:packages/cli","to":"pkg:packages/sdk","weight":5},{"from":"pkg:packages/plugin-sdk","to":"pkg:packages/sdk","weight":2},{"from":"pkg:packages/pl   window.__sz = {
    setCamera(x, y, scale) { fly = null; wheelAnim = null; setCam(+x, +y, +scale); render(); },
    fitNode(id, animate = true) {
      const n = byId.get(id);
      if (!n) return false;
      const t = fitFocus(n);
      if (animate) flyTo(t); else this.setCamera(t.x, t.y, t.scale);
      return true;
    },
    home(animate = false) { const h = homeView(); if (animate) flyTo(h); else this.setCamera(h.x, h.y, h.scale); },
    get camera() { return { x: cam.x, y: cam.y, scale: cam.scale, fitScale, maxScale }; },
    nodes,
    rect(id) { const n = byId.get(id); if (!n) return null; rectCache = new Map(); return srect(n); },
    visible() { return visible.map((v) => ({ id: v.n.id, depth: v.n.depth, alpha: v.alpha, openness: v.t, sx: v.sx, sy: v.sy, sw: v.sw, sh: v.sh })); },
    focused() { return focused ? focused.id : null; },
    hud() { return { crumbs: [...crumbsEl.querySelectorAll('button')].map((b) => b.textContent).join(' › '), level: LEVEL_NAMES[levelKey - 1] || String(levelKey) }; },
    select(id) { selected = byId.get(id) || null; inspKey = '\u0001'; render(); return !!selected; },
    hover(id) { const n = byId.get(id) || null; setHover(n); hoverK = n ? 1 : 0; hoverDir = 0; if (!n) hoverNode = null; render(); },
    edges() { return drawnEdges.map((e) => ({ from: e.g.A.id, to: e.g.B.id, kind: e.g.primary, label: groupLabel(e.g), count: e.g.count, alpha: +e.a.toFixed(3), points: e.pts.length })); },
    inspector() { return { open: insp.classList.contains('on'), text: insp.textContent, rows: insp.querySelectorAll('.irow').length }; },
    popover(kind) { if (kind !== undefined) openPop(kind || null); return { kind: popKind, text: pop.textContent }; },
    flows() { return FLOWS.map((f) => ({ id: f.id, title: f.title, steps: f.steps.length })); },
    playFlow(id, step, u) { const f = FLOWS.find((x) => x.id === id); if (!f) { stopFlow(); return false; } if (activeFlow !== f) startFlow(f); flowFreeze = step == null ? null : { i: +step, u: +u || 0 }; requestRender(); return true; },
    stopFlow() { stopFlow(); openPop(null); },
    relations: RELS.length,
    degree(id) { const n = byId.get(id); return n ? RELS.filter((r) => within(n, r.a) !== within(n, r.b)).length : 0; },
    theme() { return { pref: themePref, resolved: T === THEMES.dark ? 'dark' : 'light', attr: document.documentElement.getAttribute('data-theme') }; },
    setTheme(p) { themePref = p === 'light' || p === 'dark' ? p : 'system'; applyTheme(); },
    checkText() { textCheck.on = true; textCheck.violations = []; textCheck.drawn = 0; render(); textCheck.on = false; return { drawn: textCheck.drawn, violations: textCheck.violations.slice() }; },
    get animating() { return !!(fly || wheelAnim || fading); },
    get edgeAnimating() { return relAnimating; },
  };
})();
