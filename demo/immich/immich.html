  :root {
    --bg: #f5f5f7;
    /* label-3 is 4.5:1 on the page, cards, inspector, open groups and quiet wells; same ink as label-2, the lightest AA color on those surfaces */
    --label: #1d1d1f; --label-2: rgba(60,60,67,.76); --label-3: rgba(60,60,67,.76);
    --glass: rgba(255,255,255,.72); --glass-solid: rgba(250,250,252,.96); --glass-edge: rgba(0,0,0,.08); --glass-hi: rgba(255,255,255,.9);
    --glass-shadow: 0 0 0 .5px rgba(0,0,0,.06), 0 2px 6px rgba(0,0,0,.05), 0 12px 32px rgba(0,0,0,.10);
    --seg-bg: rgba(118,118,128,.12); --seg-on: #fff; --seg-on-shadow: 0 1px 2px rgba(0,0,0,.10), 0 0 0 .5px rgba(0,0,0,.04);
    --press: rgba(118,118,128,.14); --focus: #007aff; --flow: #007aff; --link: #0066cc;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", system-ui, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, "JetBrains Mono", Consolas, monospace;
  }
  /* macOS-style dark: elevated greys, never pure black; label alphas raised so every text style clears WCAG AA (4.5:1) */
  :root[data-theme="dark"] {
    --bg: #161618;
    --label: #f5f5f7; --label-2: rgba(235,235,245,.72); --label-3: rgba(235,235,245,.56);
    --glass: rgba(40,40,42,.76); --glass-solid: rgba(38,38,40,.97); --glass-edge: rgba(255,255,255,.10); --glass-hi: rgba(255,255,255,.06);
    --glass-shadow: 0 0 0 .5px rgba(255,255,255,.10), inset 0 .5px 0 rgba(255,255,255,.06), 0 2px 6px rgba(0,0,0,.32), 0 12px 32px rgba(0,0,0,.5);
    --seg-bg: rgba(118,118,128,.24); --seg-on: #636366; --seg-on-shadow: 0 1px 2px rgba(0,0,0,.35), inset 0 .5px 0 rgba(255,255,255,.08);
    --press: rgba(118,118,128,.28); --focus: #0a84ff; --flow: #0a84ff; --link: #409cff;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--label);
    font: 13px/1.38 var(--sans); letter-spacing: -0.006em; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  .grid { position: fixed; inset: 0; pointer-events: none; background-repeat: repeat; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; cursor: default; outline: none; }
  canvas.dragging { cursor: grabbing; }
  canvas:focus-visible { box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--focus) 55%, transparent); }
  button { -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 3px solid color-mix(in srgb, var(--focus) 55%, transparent); outline-offset: 1px; }

  /* floating glass capsule */
  #hud { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); height: 48px; box-sizing: border-box;
    max-width: calc(100vw - 48px); display: flex; align-items: center; gap: 8px; padding: 0 6px 0 16px;
    background: var(--glass); border-radius: 24px; box-shadow: var(--glass-shadow);
    -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); user-select: none; }
  #crumbs { display: flex; align-items: center; min-width: 0; overflow: hidden; white-space: nowrap; font-size: 13px; }
  #crumbs button { font: inherit; letter-spacing: inherit; color: var(--label-2); background: none; border: 0; padding: 4px 6px; border-radius: 8px;
    cursor: pointer; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: background-color .15s, color .15s; }
  #crumbs button:hover { color: var(--label); background: var(--press); }
  #crumbs button[aria-current="location"] { color: var(--label); font-weight: 600; }
  #crumbs .sep { width: 12px; height: 12px; flex: none; color: var(--label-3); }
  .divider { width: 1px; height: 20px; background: var(--glass-edge); margin: 0 4px; flex: none; }

const DATA = {"meta":{"source":"github.com/immich-app/immich","commit":"08fe047","generatedAt":"2026-11-22T18:39:52.058Z","backend":"claude","model":"","levels":4,"levelNames":["system","packages","modules","files"],"nodesPerLevel":[1,7,32,237],"nodeCount":277,"edgeCount":102,"sourceFiles":1118,"relationCount":876,"relationKinds":{"queue":3,"db":2,"external":2,"import":869},"relationSites":{"queue":3,"db":3,"external":2,"import":2130},"routeCount":0,"flowCount":4},"root":{"id":"system","label":"Immich","kind":"system","path":".","weight":126184,"shortDescription":"Self-hosted photo and video management with server, web app, CLI, SDKs and plugins.","longDescription":"Monorepo for a self-hosted photo and video library. A NestJS server exposes the REST API, runs background jobs and provides an admin CLI; a SvelteKit web app handles browsing and administration. A typed TypeScript SDK wraps the API for the web app and the upload CLI. Workflow plugins are written with a plugin SDK and compiled to WebAssembly, with core filters and actions shipped as a built-in plugin.","children":[{"id":"pkg:server","label":"Immich Server","kind":"package","path":"server","packageName":"immich","weight":61298,"shortDescription":"NestJS backend serving the Immich photo/video API, background jobs, and admin CLI.","longDescription":"TypeScript NestJS server that exposes the REST and websocket API, runs microservice workers for media processing, ML, and sync jobs, and provides an admin CLI. A controller → service → repository stack is built on Kysely over PostgreSQL with vector extensions. It also includes a separate maintenance-mode worker, email templates, and generated SQL query snapshots.","children":[{"id":"mod:server:bootstrap","label":"App Bootstrap","kind":"module","path":"server","weight":1934,"shortDescription":"Process entrypoints, Nest module wiring, CLI commands, maintenance worker, and build scripts.","longDescription":"main.ts forks the api, microservices, and maintenance workers. app.module.ts assembles the controllers, services, and repositories into Nest modules for each worker type. nest-commander commands handle admin tasks such as password resets and toggling login methods. The maintenance folder holds a standalone guarded controller, service, and websocket for maintenance mode. The bin scripts regenerate the OpenAPI spec and SQL snapshots.","children":[{"id":"file:server/src/app.module.ts","label":"app.module","kind":"file","path":"server/src/app.module.ts","weight":207,"shortDescription":"Defines Nest root modules for each process type: API, microservices, maintenance, admin CLI.","longDescription":"BaseModule shares config, Kysely database, CLS, OpenTelemetry and repository/service providers. ApiModule adds controllers, global guards, pipes, interceptors, exception filter and scheduling. MicroservicesModule wires BullMQ job workers, MaintenanceModule hosts the standalone maintenance worker, and ImmichAdminModule registers nest-commander commands. Lifecycle hooks emit app bootstrap and shutdown events.","functions":["BaseModule","ApiModule","MicroservicesModule","MaintenanceModule","ImmichAdminModule"],"children":[],"edges":[]},{"id":"file:server/src/maintenance/maintenance-worker.service.ts","label":"MaintenanceWorkerService","kind":"file","path":"server/src/maintenance/maintenance-worker.service.ts","weight":353,"shortDescription":"Runs maintenance-mode logic: auth, status, restore actions, and exiting back to normal.","longDescription":"Verifies maintenance JWTs from cookies or headers and serves server config, version and ping replies while the API is down. Runs maintenance actions such as database restore under a database lock and broadcasts status over MaintenanceWebsocketRepository. Health-checks the API through MaintenanceHealthRepository before clearing maintenance mode in system metadata and restarting the app. Also handles SSR for the web UI.","functions":["MaintenanceWorkerService","getSystemConfig()","setAction()","endMaintenance()","authenticate()","ssr()"],"children":[],"edges":[]},{"id":"file:server/src/bin/sync-sql.ts","label":"sync-sql","kind":"file","path":"server/src/bin/sync-sql.ts","weight":187,"shortDescription":"Script that generates SQL query snapshots from repository methods marked with @GenerateSql.","longDescription":"Boots a Nest testing module with real Kysely, config and repositories. Reflects over repository methods tagged with GENERATE_SQL_KEY and calls them with DummyValue parameters. SqlLogger captures the emitted SQL, formats it with sql-formatter, and writes one .sql file per repository so query changes appear in diffs.","functions":["SqlLogger","logQuery()","logQueryError()","clear()"],"children":[],"edges":[]},{"id":"file:server/src/main.ts","label":"main","kind":"file","path":"server/src/main.ts","weight":150,"shortDescription":"Process entrypoint that forks API and microservices workers or runs admin CLI commands.","longDescription":"The Workers class reads maintenance mode from system metadata through a short-lived Kysely connection. In maintenance mode it starts only the maintenance worker. Otherwise it waits for a free database lock and starts the enabled workers as child processes or worker threads. It handles restart and shutdown signals with a restart fail-safe, and hands off to CommandFactory for the immich-admin CLI.","functions":["Workers","bootstrap()","isMaintenanceMode()","waitForFreeLock()","startWorker()"],"children":[],"edges":[]},{"id":"file:server/src/maintenance/maintenance-worker.controller.ts","label":"MaintenanceWorkerController","kind":"file","path":"server/src/maintenance/maintenance-worker.controller.ts","weight":116,"shortDescription":"HTTP endpoints exposed while the server runs in maintenance mode.","longDescription":"Copies a subset of ServerController routes (ping, version, config) so clients keep working during maintenance. Adds maintenance login, status, detect-install and set-mode endpoints. Exposes database backup list, upload, download and delete through DatabaseBackupService. Routes carry MaintenanceRoute guards and delegate to MaintenanceWorkerService, setting cookies with respondWithCookie.","functions":["MaintenanceWorkerController","maintenanceLogin()","setMaintenanceMode()","maintenanceStatus()","uploadDatabaseBackup()","downloadDatabaseBackup()"],"children":[],"edges":[]},{"id":"file:server/src/commands/media-location.command.ts","label":"media-location command","kind":"file","path":"server/src/commands/media-location.command.ts","weight":88,"shortDescription":"CLI command that rewrites stored file paths for a new media location.","longDescription":"Shows sample paths from the database, then prompts for the old and new media location values. Asks for confirmation before calling CliService.migrateFilePaths. On success it reminds the user to update IMMICH_MEDIA_LOCATION and the docker volume mounts. Prompts are defined as nest-commander QuestionSets.","functions":["ChangeMediaLocationCommand","PromptMediaLocationQuestions","PromptConfirmMoveQuestions","run()","showSamplePaths()"],"children":[],"edges":[]},{"id":"file:server/eslint.config.mjs","label":"eslint config","kind":"file","path":"server/eslint.config.mjs","weight":114,"shortDescription":"ESLint flat config for the server TypeScript code.","longDescription":"Combines the recommended rule sets from unicorn, typescript-eslint and import-x, plus prettier compatibility, using type-aware parsing against tsconfig.json. Turns off many stylistic unicorn rules, enforces no-floating-promises, and applies project-specific import and naming rules.","functions":["defineConfig()"],"children":[],"edges":[]},{"id":"file:server/src/app.common.ts","label":"app.common","kind":"file","path":"server/src/app.common.ts","weight":86,"shortDescription":"Shared Express and telemetry setup used by API and maintenance workers.","longDescription":"configureExpress sets the logger, trust proxy, CORS, helmet, cookie parsing, body limits and compression on the Nest Express app. It also installs the websocket adapter, Swagger docs, static web assets via sirv, and SSR middleware from either ApiService or MaintenanceWorkerService. configureTelemetry starts the metrics exporter when metrics are enabled.","functions":["configureExpress()","configureTelemetry()"],"children":[],"edges":[]},{"id":"file:server/src/maintenance/maintenance-websocket.repository.ts","label":"MaintenanceWebsocketRepository","kind":"file","path":"server/src/maintenance/maintenance-websocket.repository.ts","weight":81,"shortDescription":"Socket.io gateway that pushes maintenance status and restart events to clients.","longDescription":"Runs on /api/socket.io, the same path as the main API socket. It checks connecting clients with a pluggable auth function. Server-side MaintenanceStatus and AppRestart messages are forwarded to EventRepository, and versioned client events (MaintenanceStatusV1, AppRestartV1) are emitted to connected sockets.","functions":["MaintenanceWebsocketRepository","afterInit()","handleConnection()","clientBroadcast()","serverSend()","setAuthFn()"],"children":[],"edges":[]},{"id":"file:server/src/commands/grant-admin.ts","label":"grant-admin","kind":"file","path":"server/src/commands/grant-admin.ts","weight":61,"shortDescription":"CLI commands to grant or revoke admin rights by user email.","longDescription":"GrantAdminCommand and RevokeAdminCommand ask for an email through a shared nest-commander question and call CliService.grantAdminAccess or revokeAdminAccess. Errors are logged to the console instead of thrown.","functions":["GrantAdminCommand","RevokeAdminCommand","PromptEmailQuestion","run()"],"children":[],"edges":[]},{"id":"file:server/src/commands/reset-admin-password.command.ts","label":"reset-admin-password","kind":"file","path":"server/src/commands/reset-admin-password.command.ts","weight":58,"shortDescription":"CLI command that resets the admin password, optionally invalidating sessions.","longDescription":"Prints the details of the found admin, then prompts for an optional new password and whether to invalidate sessions. Calls CliService.resetAdminPassword and prints the generated password when none was provided.","functions":["ResetAdminPasswordCommand","PromptPasswordResetQuestions","run()"],"children":[],"edges":[]},{"id":"file:server/src/maintenance/maintenance-health.repository.ts","label":"MaintenanceHealthRepository","kind":"file","path":"server/src/maintenance/maintenance-health.repository.ts","weight":60,"shortDescription":"Verifies the API can start by forking a temporary API worker and pinging it.","longDescription":"Forks workers/api.js on 127.0.0.1:33001 with inspector flags removed and output silenced. Polls /api/server/ping every second until a response or a 180s deadline. Rejects if the child exits early, and always kills the child once the check settles. Used before leaving maintenance mode.","functions":["MaintenanceHealthRepository","checkApiHealth()"],"children":[],"edges":[]},{"id":"more:server:bootstrap","label":"+12 more files","kind":"file","path":"server/src/commands","weight":75,"shortDescription":"12 smaller files in this module.","longDescription":"schema-check.ts, maintenance-auth.guard.ts, maintenance-mode.ts, microservices.ts, oauth-login.ts, password-login.ts, index.ts, api.ts, maintenance.ts, version.command.ts, list-users.command.ts, sync-open-api.ts","functions":[],"children":[],"edges":[]}],"edges":[{"from":"file:server/src/main.ts","to":"file:server/src/app.module.ts","weight":1}]},{"id":"mod:server:http-api","label":"HTTP API","kind":"module","path":"server/src","weight":5228,"shortDescription":"REST controllers plus guards, interceptors, and filters for the HTTP pipeline.","longDescription":"Each controller maps routes for one domain, such as assets, albums, people, sync, or admin, onto a matching service. The Authenticated decorator and auth guard handle permissions. Middleware provides the auth guard, file-upload and asset-upload interceptors, logging, error mapping, global validation, and the socket.io adapter. controllers/index.ts collects every controller for module registration.","children":[{"id":"file:server/src/controllers/asset.controller.ts","label":"asset.controller","kind":"file","path":"server/src/controllers/asset.controller.ts","weight":243,"shortDescription":"REST endpoints for asset metadata, statistics, bulk updates, jobs, edits, and OCR.","longDescription":"Exposes the /assets routes for reading and mutating asset records. It covers statistics, bulk update and delete, copy, job triggering, key-value metadata upserts, edit history, and OCR results. Each handler is guarded by @Authenticated with a specific Permission, documented through @Endpoint with a HistoryBuilder version timeline, and delegates to AssetService.","functions":["AssetController","getAssetStatistics()","runAssetJobs()","updateAssets()","deleteAssets()","getAssetInfo()"],"children":[],"edges":[]},{"id":"file:server/src/controllers/person.controller.ts","label":"person.controller","kind":"file","path":"server/src/controllers/person.controller.ts","weight":240,"shortDescription":"REST endpoints for managing recognized people, faces, merges, and thumbnails.","longDescription":"Handles /people routes: listing and searching people, creating, updating, and deleting them, merging, reassigning faces, sharing people across users, and reporting statistics. Person thumbnails are streamed through sendFile together with the Express Response and NextFunction. Calls delegate to PersonService, and LoggingRepository provides error context for file responses.","functions":["PersonController","getAllPeople()","createPerson()","mergePerson()","reassignFaces()","getPersonThumbnail()"],"children":[],"edges":[]},{"id":"file:server/src/controllers/user.controller.ts","label":"user.controller","kind":"file","path":"server/src/controllers/user.controller.ts","weight":230,"shortDescription":"REST endpoints for user listing, self-profile, preferences, license, onboarding, and avatars.","longDescription":"Serves /users routes for the authenticated user. Covers getting and updating the current user, preferences, license keys, onboarding state, calendar heatmap data, and profile images. Profile image uploads go through FileUploadInterceptor as multipart data, and downloads are streamed with sendFile. Business logic lives in UserService.","functions":["UserController","searchUsers()","getMyUser()","updateMyUser()","createProfileImage()","getProfileImage()"],"children":[],"edges":[]},{"id":"file:server/src/middleware/auth.guard.ts","label":"auth.guard","kind":"file","path":"server/src/middleware/auth.guard.ts","weight":102,"shortDescription":"Authentication decorators and global guard that enforce route auth options and permissions.","longDescription":"Defines the @Authenticated decorator, which stores route options (permission, admin, sharedLink, public, setup) as metadata and adds the matching Swagger security annotations. getAuthenticatedOptions merges these options with defaults. AuthGuard reads the metadata through Reflector and calls AuthService to authenticate requests, then attaches the user to the request. @Auth and @GetLoginDetails are parameter decorators that expose the AuthDto and the client and user-agent details.","functions":["AuthGuard","Authenticated()","Auth()","getAuthenticatedOptions()","GetLoginDetails()","FileResponse()"],"children":[],"edges":[]},{"id":"file:server/src/controllers/asset-media.controller.ts","label":"asset-media.controller","kind":"file","path":"server/src/controllers/asset-media.controller.ts","weight":184,"shortDescription":"Endpoints for uploading assets, downloading originals, serving thumbnails, and bulk upload checks.","longDescription":"Handles binary asset traffic on /assets. Multipart uploads go through AssetUploadInterceptor and FileUploadInterceptor, which also accept shared-link uploads. Originals and thumbnails or video playback are streamed with sendFile. The controller also handles the bulk-upload duplicate check. Upload status, such as a duplicate, determines the HTTP status code. Work is delegated to AssetMediaService.","functions":["AssetMediaController","uploadAsset()","downloadAsset()","viewAsset()","playAssetVideo()","checkBulkUpload()"],"children":[],"edges":[]},{"id":"file:server/src/controllers/album.controller.ts","label":"album.controller","kind":"file","path":"server/src/controllers/album.controller.ts","weight":182,"shortDescription":"REST endpoints for album CRUD, sharing with users, and asset membership.","longDescription":"Exposes /albums routes to list, create, read, update, and delete albums, report album statistics, and fetch map markers. It also adds and removes assets, including bulk adds across albums, and manages shared album users and their roles. Every route is permission-gated through @Authenticated and delegates to AlbumService.","functions":["AlbumController","getAllAlbums()","createAlbum()","addAssetsToAlbum()","addUsersToAlbum()","deleteAlbum()"],"children":[],"edges":[]},{"id":"file:server/src/controllers/server.controller.ts","label":"server.controller","kind":"file","path":"server/src/controllers/server.controller.ts","weight":181,"shortDescription":"Endpoints exposing server info, features, config, version, storage, stats, and license.","longDescription":"Serves /server routes: about info, APK links, ping, version and version history, supported media types, features, config, storage usage, and admin statistics. It also manages the server license and the version-check state. The controller combines ServerService, SystemMetadataService, and VersionService.","functions":["ServerController","getAboutInfo()","getServerFeatures()","getServerConfig()","getServerVersion()","setServerLicense()"],"children":[],"edges":[]},{"id":"file:server/src/controllers/user-admin.controller.ts","label":"user-admin.controller","kind":"file","path":"server/src/controllers/user-admin.controller.ts","weight":175,"shortDescription":"Admin-only endpoints for searching, creating, updating, deleting, and restoring users.","longDescription":"Serves /admin/users routes, each marked admin: true in @Authenticated. Admins can search, create, update, soft-delete, and restore users, inspect a user's sessions, statistics, and calendar heatmap, and edit a user's preferences. All operations delegate to UserAdminService.","functions":["UserAdminController","searchUsersAdmin()","createUserAdmin()","updateUserAdmin()","deleteUserAdmin()","restoreUserAdmin()"],"children":[],"edges":[]},{"id":"file:server/src/controllers/auth.controller.ts","label":"auth.controller","kind":"file","path":"server/src/controllers/auth.controller.ts","weight":169,"shortDescription":"Endpoints for login, logout, signup, password change, PIN codes, and session locking.","longDescription":"Handles /auth routes for password login, admin sign-up, logout, token validation, password change, and auth status. It also manages PIN code setup, change, and reset, and session lock and unlock. Login and logout set or clear access-token cookies through respondWithCookie and respondWithoutCookie. Logic is delegated to AuthService.","functions":["AuthController","login()","signUpAdmin()","logout()","changePassword()","unlockAuthSession()"],"children":[],"edges":[]},{"id":"file:server/src/middleware/file-upload.interceptor.ts","label":"file-upload.interceptor","kind":"file","path":"server/src/middleware/file-upload.interceptor.ts","weight":144,"shortDescription":"Multer-based interceptor that streams uploads to disk while hashing them.","longDescription":"FileUploadInterceptor picks a multer handler for asset or profile uploads based on the route path. It streams each file to a destination chosen by AssetMediaService and computes a SHA-1 checksum during the pipe. On failure it removes partial files through StorageRepository. getFile and getFiles map multer output to UploadFile objects for controllers.","functions":["FileUploadInterceptor","getFile()","getFiles()","intercept()"],"children":[],"edges":[]},{"id":"file:server/src/controllers/shared-link.controller.ts","label":"shared-link.controller","kind":"file","path":"server/src/controllers/shared-link.controller.ts","weight":168,"shortDescription":"Endpoints to create, manage, and access shared links and their assets.","longDescription":"Serves /shared-links routes for listing, creating, editing, and removing shared links and their assets. It also handles retrieving the current link, which can require a password. Shared-link tokens are kept in a comma-joined cookie: helper functions merge new tokens and set the cookie with respondWithCookie. Logic is delegated to SharedLinkService.","functions":["SharedLinkController","getMySharedLink()","createSharedLink()","updateSharedLink()","addSharedLinkAssets()","removeSharedLink()"],"children":[],"edges":[]},{"id":"file:server/src/controllers/passkey.controller.ts","label":"passkey.controller","kind":"file","path":"server/src/controllers/passkey.controller.ts","weight":143,"shortDescription":"WebAuthn passkey registration, authentication, and management endpoints.","longDescription":"Handles /passkeys routes for the start and finish steps of both registration and authentication, plus listing, renaming, and deleting a user's passkeys. Passing request headers to the service lets it resolve the origin and relying party. A successful passkey login sets the access-token and auth-type cookies with respondWithCookie. Logic is delegated to PasskeyService.","functions":["PasskeyController","startRegistration()","finishRegistration()","startAuthentication()","finishAuthentication()","deletePasskey()"],"children":[],"edges":[]},{"id":"more:server:http-api","label":"+44 more files","kind":"file","path":"server/src/controllers","weight":613,"shortDescription":"44 smaller files in this module.","longDescription":"search.controller.ts, tag.controller.ts, memory.controller.ts, oauth.controller.ts, workflow.controller.ts, library.controller.ts, cluster-group.controller.ts, stack.controller.ts, api-key.controller.ts, database-backup.controller.ts, index.ts, session.controller.ts, video-stream.controller.ts, integrity-admin.controller.ts, notification.controller.ts, notification-admin.controller.ts, queue.controller.ts, maintenance.controller.ts, config-admin.controller.ts, system-config.controller.ts, activity.controller.ts, partner.controller.ts, sync.controller.ts, asset-file.controller.ts, face.controller.ts, plugin.controller.ts, duplicate.controller.ts, system-metadata.controller.ts, job.controller.ts, global-exception.filter.ts, trash.controller.ts, map.controller.ts, download.controller.ts, logging.interceptor.ts, app.controller.ts, timeline.controller.ts, error.interceptor.ts, view.controller.ts, config-public.controller.ts, config-user.controller.ts, auth-admin.controller.ts, asset-upload.interceptor.ts, websocket.adapter.ts, global-validation.pipe.ts","functions":[],"children":[],"edges":[]}],"edges":[]},{"id":"mod:server:dtos","label":"API DTOs","kind":"module","path":"server/src","weight":5411,"shortDescription":"Request and response DTOs, validation schemas, and entity-to-response mappers.","longDescription":"These classes and schemas define the public API contract that feeds OpenAPI generation. They cover assets, albums, search filters, sync stream items, system config, and environment variables. Mapper functions such as mapAsset, mapUser, and mapSharedLink turn database rows into response shapes. validation.ts supplies custom validators and shared param DTOs.","children":[{"id":"file:server/src/dtos/search.dto.ts","label":"search.dto","kind":"file","path":"server/src/dtos/search.dto.ts","weight":407,"shortDescription":"Zod schemas and DTOs for asset search requests, filters, ordering, and suggestions.","longDescription":"Defines search request schemas, including a structured filter tree of typed filters (ID, string, pattern, number, date, with nullable variants). Older flat filter fields remain but are marked deprecated via HistoryBuilder metadata. Reuses AlbumResponseSchema and AssetResponseSchema for search results and enum schemas from src/enum.js. Relies on validation helpers like isoDatetimeToDate and nonEmptyPartial.","functions":["SearchFilterSchema","SearchOrderSchema","SearchSuggestionType","DEFAULT_SEARCH_ORDER","StringPatternFilter","DateFilter"],"children":[],"edges":[]},{"id":"file:server/src/dtos/config.dto.ts","label":"config.dto","kind":"file","path":"server/src/dtos/config.dto.ts","weight":799,"shortDescription":"System configuration schema, defaults, and admin/user/public config mappers.","longDescription":"Declares the full SystemConfig Zod schema covering FFmpeg, machine learning, OAuth, SMTP, storage templates, and more, along with default values. Custom validators handle string booleans, cron expressions, and HTTPS-only domains. ConfigVisibility tags each field so mapAdminConfig, mapUserConfig, and mapPublicConfig can return only the fields each audience is allowed to see.","functions":["SystemConfig","defaults","mapAdminConfig()","mapUserConfig()","mapPublicConfig()","AdminConfigDto"],"children":[],"edges":[]},{"id":"file:server/src/dtos/person.dto.ts","label":"person.dto","kind":"file","path":"server/src/dtos/person.dto.ts","weight":307,"shortDescription":"Person and face DTOs covering create, update, merge, search, and response mapping.","longDescription":"Holds Zod schemas for creating, updating, deleting, merging, and searching people, with birth-date and hex-color validation. Also defines asset face response and update DTOs. Mappers transform database Person and AssetFace rows into responses and apply transformFaceBoundingBox to account for asset edits. Depends on user.dto for the embedded user responses.","functions":["PersonResponseSchema","PersonCreateDto","PersonUpdateDto","MergePersonDto","AssetFaceResponseDto","PersonSearchDto"],"children":[],"edges":[]},{"id":"file:server/src/dtos/sync.dto.ts","label":"sync.dto","kind":"file","path":"server/src/dtos/sync.dto.ts","weight":401,"shortDescription":"Versioned sync stream entity schemas and sync request/ack DTOs for clients.","longDescription":"Defines versioned payload schemas such as SyncUserV1, SyncAuthUserV2, SyncAssetV2, and SyncAssetExifV1 that the incremental sync stream sends to mobile clients. The @ExtraModel decorator registers each one with OpenAPI. Also defines request DTOs for opening a stream and for setting or deleting acknowledgement checkpoints. SyncItem maps each entity type to its payload.","functions":["SyncStreamDto","SyncAckSetDto","SyncAckDeleteDto","SyncItem","SyncAssetV2","SyncAssetExifV1"],"children":[],"edges":[]},{"id":"file:server/src/validation.ts","label":"validation","kind":"file","path":"server/src/validation.ts","weight":210,"shortDescription":"Shared Zod validators, param DTOs, and file validators used across DTOs.","longDescription":"Provides reusable schema building blocks: IP/CIDR range checks, a nonEmptyPartial for patch DTOs, a sibling-exclusion refinement, and email, ISO date, coordinate, and string-to-boolean coercions. Also exports common route-parameter DTOs for UUIDs and filenames, plus a NestJS FileNotEmptyValidator for uploads. Uses the validator, luxon, and sanitize-filename libraries.","functions":["nonEmptyPartial()","IsIPRange()","IsNotSiblingOf()","isoDatetimeToDate","stringToBool","UUIDParamDto"],"children":[],"edges":[]},{"id":"file:server/src/dtos/auth.dto.ts","label":"auth.dto","kind":"file","path":"server/src/dtos/auth.dto.ts","weight":163,"shortDescription":"Authentication context type, login/signup/PIN DTOs, and OAuth profile parsing.","longDescription":"Defines the AuthDto type, which carries the user, API key, shared link, and session through the request lifecycle. Helpers such as isMetadataHidden check shared-link restrictions. Includes schemas for login, sign-up, password change, and PIN codes. OAuthProfileSchema leniently parses identity provider claims, sanitizing storage labels and converting quota claims from GiB to bytes.","functions":["AuthDto","OAuthProfileSchema","mapLoginResponse()","LoginCredentialDto","isMetadataHidden","SignUpDto"],"children":[],"edges":[]},{"id":"file:server/src/dtos/album.dto.ts","label":"album.dto","kind":"file","path":"server/src/dtos/album.dto.ts","weight":228,"shortDescription":"Album request/response schemas, album user roles, and album-to-response mapper.","longDescription":"Defines schemas for creating and updating albums, adding assets and users, querying albums, and album statistics. AlbumResponseSchema embeds user responses, contributor counts, and assets. mapAlbum turns database album rows into responses using mapUser and asset mapping, taking AuthDto into account for shared-link contexts.","functions":["AlbumResponseSchema","mapAlbum","CreateAlbumDto","UpdateAlbumDto","AlbumsAddAssetsDto","AddUsersDto"],"children":[],"edges":[]},{"id":"file:server/src/dtos/asset.dto.ts","label":"asset.dto","kind":"file","path":"server/src/dtos/asset.dto.ts","weight":146,"shortDescription":"Asset update, bulk operation, job, stats, and metadata DTOs.","longDescription":"Contains schemas for single and bulk asset updates. These enforce that latitude and longitude are provided together and restrict ratings to -1 or 1–5, with that change tracked through HistoryBuilder. Also covers bulk delete, asset jobs, statistics, and metadata upsert/delete. mapStats turns repository AssetStats into the response shape.","functions":["UpdateAssetDto","AssetBulkUpdateDto","AssetBulkDeleteDto","AssetJobsDto","AssetMetadataUpsertDto","mapStats"],"children":[],"edges":[]},{"id":"file:server/src/dtos/server.dto.ts","label":"server.dto","kind":"file","path":"server/src/dtos/server.dto.ts","weight":162,"shortDescription":"Server info DTOs: version, features, storage, stats, media types, releases.","longDescription":"Defines responses for the server information endpoints, including ping, about, w.dto","kind":"file","path":"server/src/dtos/workflow.dto.ts","weight":129,"shortDescription":"Workflow automation DTOs for triggers, steps, CRUD, sharing, and logs.","longDescription":"Defines schemas for workflow triggers, step configurations made of a plugin method, free-form config, and an enabled flag, and for workflow search, create, and update. Also includes response, shareable export, and execution log DTOs. Types come from @immich/plugin-sdk. mapWorkflow and mapWorkflowShare convert stored workflows into API and share formats.","functions":["WorkflowCreateDto","WorkflowUpdateDto","WorkflowResponseDto","mapWorkflow","mapWorkflowShare","WorkflowLogEntryDto"],"children":[],"edges":[]},{"id":"more:server:dtos","label":"+42 more files","kind":"file","path":"server/src/dtos","weight":421,"shortDescription":"42 smaller files in this module.","longDescription":"plugin.dto.ts, user-preferences.dto.ts, editing.dto.ts, notification.dto.ts, library.dto.ts, shared-link.dto.ts, time-bucket.dto.ts, memory.dto.ts, activity.dto.ts, queue.dto.ts, tag.dto.ts, passkey.dto.ts, asset-media.dto.ts, asset-ids.response.dto.ts, env.dto.ts, queue-legacy.dto.ts, plugin-manifest.dto.ts, maintenance.dto.ts, session.dto.ts, exif.dto.ts, download.dto.ts, asset-media-response.dto.ts, stack.dto.ts, streaming.dto.ts, integrity.dto.ts, json-schema.dto.ts, asset-file.dto.ts, api-key.dto.ts, map.dto.ts, partner.dto.ts, calendar-heatmap.dto.ts, cluster-group.dto.ts, system-metadata.dto.ts, duplicate.dto.ts, database-backup.dto.ts, user-profile.dto.ts, ocr.dto.ts, bbox.dto.ts, license.dto.ts, onboarding.dto.ts, job.dto.ts, trash.dto.ts","functions":[],"children":[],"edges":[]}],"edges":[]},{"id":"mod:server:services","label":"Domain Services","kind":"module","path":"server/src","weight":14937,"shortDescription":"Business logic and background job handlers for every Immich feature.","longDescription":"Every service extends BaseService, which injects the full set of repositories. Services handle API requests and job events such as metadata extraction, thumbnail and transcode generation, face recognition, smart search, sync streaming, backups, workflows, and plugins. StorageCore centralizes file path computation and file moves. services/index.ts lists every service for registration.","children":[{"id":"file:server/src/services/metadata.service.ts","label":"metadata.service","kind":"file","path":"server/src/services/metadata.service.ts","weight":1021,"shortDescription":"Extracts EXIF and sidecar metadata from assets and persists it to the database.","longDescription":"Handles metadata extraction jobs using exiftool tags, resolving capture dates from an ordered EXIF tag list and merging time zones via luxon. Writes asset_exif rows, imports faces and tags, reverse-geocodes locations, and links motion-photo/live-photo pairs. Clamps numeric values to Postgres int range and uses database locks for safe concurrent processing.","functions":["MetadataService","firstDateTime()","handleMetadataExtraction()","handleQueueMetadataExtraction()","handleSidecarCheck()","handleSidecarWrite()"],"children":[],"edges":[]},{"id":"file:server/src/services/sync.service.ts","label":"sync.service","kind":"file","path":"server/src/services/sync.service.ts","weight":903,"shortDescription":"Streams incremental entity changes to mobile clients using checkpointed sync acknowledgements.","longDescription":"Implements the sync stream protocol: writes ordered SyncItems for assets, albums, people, memories and more to a Writable response, honouring backpressure via waitForDrain. Clients ack updateIds stored as session checkpoints; backfill completion is tracked with a 'complete' marker. SYNC_TYPES_ORDER fixes entity emission order, and a job prunes stale audit data older than 30 days.","functions":["SyncService","SYNC_TYPES_ORDER","send()","stream()","setAcks()","deleteAcks()"],"children":[],"edges":[]},{"id":"file:server/src/services/person.service.ts","label":"person.service","kind":"file","path":"server/src/services/person.service.ts","weight":901,"shortDescription":"Manages people, faces, face detection and facial recognition clustering jobs.","longDescription":"Provides CRUD, merge and sharing operations for people and asset faces, with access checks via Permission. Runs background jobs for face detection through the machine-learning repository, storing embeddings in face_search, and clusters faces into people using vector search. Also generates person thumbnails and maintains the vector index under database locks.","functions":["PersonService","handleDetectFaces()","handleRecognizeFaces()","handleQueueRecognizeFaces()","mergePerson()","getAll()"],"children":[],"edges":[]},{"id":"file:server/src/services/media.service.ts","label":"media.service","kind":"file","path":"server/src/services/media.service.ts","weight":772,"shortDescription":"Generates thumbnails, previews, and transcoded videos for assets via image and FFmpeg pipelines.","longDescription":"Processes thumbnail generation jobs producing preview, thumbnail and thumbhash files, including RAW embedded-image extraction and edited-asset variants. Transcodes videos according to FFmpeg config (codecs, hardware acceleration, transcode policy) and generates person face thumbnails. Records outputs as asset_file rows through StorageCore path helpers and applies crop transforms and face/OCR visibility checks.","functions":["MediaService","handleGenerateThumbnails()","handleVideoConversion()","handleQueueGenerateThumbnails()","handleGeneratePersonThumbnail()","handleQueueVideoConversion()"],"children":[],"edges":[]},{"id":"file:server/src/services/library.service.ts","label":"library.service","kind":"file","path":"server/src/services/library.service.ts","weight":639,"shortDescription":"Manages external libraries, scanning import paths and watching folders for file changes.","longDescription":"Provides CRUD and path validation for external libraries, then queues scan jobs that discover files with picomatch-based import/exclusion matching. Syncs discovered files into assets, marks missing files offline, and removes deleted libraries in batches. Filesystem watching runs only in one microservices worker, coordinated by a database lock acquired on ConfigInit.","functions":["LibraryService","onConfigInit()","handleQueueScanLibrary()","handleSyncFiles()","handleSyncAssets()","validate()"],"children":[],"edges":[]},{"id":"file:server/src/services/auth.service.ts","label":"auth.service","kind":"file","path":"server/src/services/auth.service.ts","weight":571,"shortDescription":"Authenticates users via password, API keys, sessions, shared links and OAuth.","longDescription":"Handles login, logout, sign-up of the initial admin, password and PIN code changes, and session unlock. Validates incoming requests from cookies, headers or query params, resolving AuthDto for users, API keys or shared links and checking permissions. Implements OAuth authorization, callback, account linking and backchannel logout, mapping claims to storage quota, label and role.","functions":["AuthService","login()","validate()","callback()","authorize()","changePassword()"],"children":[],"edges":[]},{"id":"file:server/src/services/integrity.service.ts","label":"integrity.service","kind":"file","path":"server/src/services/integrity.service.ts","weight":614,"shortDescription":"Detects untracked files, missing files and checksum mismatches between storage and database.","longDescription":"Runs integrity jobs that scan upload, library, encoded-video and thumbs folders for files absent from asset or asset_file tables, and checks database paths for missing files on disk. Verifies checksums by streaming files through a hash. Produces paginated reports that support downloading, deleting or trashing flagged items.","functions":["IntegrityService","handleUntrackedFilesQueueAll()","handleMissingFilesQueueAll()","handleChecksumFiles()","getIntegrityReport()","deleteIntegrityReport()"],"children":[],"edges":[]},{"id":"file:server/src/services/database-backup.service.ts","label":"database-backup.service","kind":"file","path":"server/src/services/database-backup.service.ts","weight":563,"shortDescription":"Creates, lists, restores and prunes scheduled PostgreSQL database backups.","longDescription":"Schedules backups via cron and runs pg_dump through the process repository, piping compressed output into the backups folder. Validates Postgres version compatibility with semver and supports restoring backups, which interacts with maintenance health checks. Constructed with explicit repositories rather than BaseService so it can run in maintenance mode.","functions":["DatabaseBackupService","handleBackupDatabase()","listBackups()","deleteBackup()","restoreDatabaseBackup()","onConfigInit()"],"children":[],"edges":[]},{"id":"file:server/src/services/asset.service.ts","label":"asset.service","kind":"file","path":"server/src/services/asset.service.ts","weight":561,"shortDescription":"Handles asset retrieval, updates, deletion, copying, edits, metadata and asset-level jobs.","longDescription":"Provides user-facing asset operations: get, update, bulk update/delete, statistics, copy between assets, and key-value metadata management. Manages non-destructive edits (crop etc.) and OCR results, and links live-photo pairs with before/after link hooks. Background jobs purge trashed assets and run per-asset job requests, updating locked columns to protect user edits.","functions":["AssetService","get()","update()","deleteAll()","handleAssetDeletion()","editAsset()"],"children":[],"edges":[]},{"id":"file:server/src/services/workflow-execution.service.ts","label":"workflow-execution.service","kind":"file","path":"server/src/services/workflow-execution.service.ts","weight":455,"shortDescription":"Executes plugin-based workflows on asset triggers using Extism WebAssembly plugins.","longDescription":"Loads plugin manifests and runs workflow steps inside Extism plugins, exposing host functions only when itory query.","longDescription":"Generated by the sql-generator from @GenerateSql-decorated methods in SearchRepository, using dummy parameters. Documents metadata, statistics, random, smart (vector) and other search queries over asset and asset_exif joins. Used for review and diffing of query changes rather than executed at runtime.","functions":["SearchRepository.searchMetadata","SearchRepository.searchStatistics","SearchRepository.searchRandom"],"children":[],"edges":[]},{"id":"file:server/src/repositories/search.repository.ts","label":"search.repository","kind":"file","path":"server/src/repositories/search.repository.ts","weight":545,"shortDescription":"Kysely-based asset search: metadata filters, random picks, CLIP embeddings, and statistics.","longDescription":"Defines composable search option interfaces (ID, status, date, path, EXIF, embedding, OCR, people, tags, albums, ordering) and builds queries through searchAssetBuilder helpers in utils/database. Supports smart search over vector indexes, using database probes for tuning. Results are paginated via paginationHelper, and methods carry @GenerateSql examples for SQL snapshots.","functions":["SearchRepository","SearchOptions","SearchEmbeddingOptions","SearchExifOptions","SearchStatusOptions","SearchOrderOptions"],"children":[],"edges":[]},{"id":"file:server/src/repositories/person.repository.ts","label":"person.repository","kind":"file","path":"server/src/repositories/person.repository.ts","weight":916,"shortDescription":"Data access for people, person groups, faces, and face-embedding clustering.","longDescription":"Manages person, person_group, asset_face, face_search and cluster_group tables via Kysely. Handles face assignment and reassignment across groups, cleanup of empty or orphaned groups, people listing with sharing and partner filters, and face similarity ordering. Uses @Chunked decorators for large ID batches and JSON aggregation helpers for nested results.","functions":["PersonRepository","Person
