597,"shortDescription":"Shared row types for domain entities and a Kysely transaction handle wrapper.","longDescription":"Defines plain TypeScript row shapes (User, Asset, Album users, Library, ApiKey, Memory, Tag, etc.) consumed by repositories and DTO mappers. TransactionHandle wraps a Kysely ControlledTransaction with commit, rollback, unwrap, and async-dispose that auto-rolls back uncommitted work. Types reference schema tables and enums from src/enum.js to keep query results typed.","functions":["TransactionHandle","AuthUser","Asset","User","UserAdmin","Library"],"children":[],"edges":[]},{"id":"file:server/src/schema/functions.ts","label":"SQL functions","kind":"file","path":"server/src/schema/functions.ts","weight":364,"shortDescription":"Registers PostgreSQL functions and trigger bodies used by the declarative schema.","longDescription":"Uses registerFunction from @immich/sql-tools to declare SQL and PL/pgSQL functions: a timestamp-ordered UUIDv7 generator, updated_at trigger setting updatedAt/updateId, immutable helpers for indexing (f_unaccent, f_concat_ws, ll_to_earth_public), and many *_delete_audit triggers that write deletions into audit tables for client sync. Referenced by table decorators and schema index.","functions":["immich_uuid_v7","updated_at","album_user_after_insert","f_unaccent","asset_delete_audit","ll_to_earth_public"],"children":[],"edges":[]},{"id":"file:server/src/decorators.ts","label":"decorators","kind":"file","path":"server/src/decorators.ts","weight":265,"shortDescription":"Shared column, trigger, chunking, SQL-generation, telemetry, and event decorators.","longDescription":"Provides schema helpers like UpdateIdColumn and UpdatedAtTrigger built on immich_uuid_v7 and updated_at. Chunked decorators split large parameter lists under PostgreSQL's 65535 bind limit. Also hosts NestJS-level decorators for SQL query generation metadata, telemetry, event handler registration, and OpenAPI annotations, making it a cross-cutting utility file.","functions":["UpdatedAtTrigger()","UpdateIdColumn()","PrimaryGeneratedUuidV7Column()","Chunked()","GenerateSql()","OnEvent()"],"children":[],"edges":[]},{"id":"file:server/src/schema/index.ts","label":"schema index","kind":"file","path":"server/src/schema/index.ts","weight":283,"shortDescription":"Assembles all tables, enums, functions, and extensions into the ImmichDatabase definition.","longDescription":"ImmichDatabase is the @Database-decorated root listing every table class, registered enum, SQL function, and required extension, which sql-tools diffs to produce migrations. The exported DB interface maps table names to row types for Kysely, giving repositories typed query builders. Migrations describes the migration bookkeeping table.","functions":["ImmichDatabase","DB","Migrations"],"children":[],"edges":[]},{"id":"file:server/src/schema/tables/asset.table.ts","label":"asset table","kind":"file","path":"server/src/schema/tables/asset.table.ts","weight":127,"shortDescription":"Declares the central asset table with indexes, triggers, and foreign keys.","longDescription":"Defines AssetTable columns for owner, library, stack, checksum, visibility, status, and timestamps. Partial unique indexes enforce checksum uniqueness per user or per library; expression indexes on localDateTime support timeline day and month bucketing. Triggers maintain updatedAt, write delete audits, and propagate owner/visibility/deletion changes to asset_face rows.","functions":["AssetTable"],"children":[],"edges":[]},{"id":"file:server/src/schema/tables/asset-face.table.ts","label":"asset face table","kind":"file","path":"server/src/schema/tables/asset-face.table.ts","weight":96,"shortDescription":"Declares detected face rows linking assets to person groups.","longDescription":"AssetFaceTable stores bounding boxes, source type, and person group per asset, plus denormalized ownerId, assetVisibility, and assetDeletedAt copied from the asset by an insert trigger. The updatedAt trigger skips changes to those denormalized fields so they don't sync to clients. Partial composite indexes serve people timelines and visible-face queries; deletes are audited.","functions":["AssetFaceTable"],"children":[],"edges":[]},{"id":"file:server/src/schema/tables/asset-av.table.ts","label":"asset AV tables","kind":"file","path":"server/src/schema/tables/asset-av.table.ts","weight":71,"shortDescription":"Declares per-asset audio, video stream, and keyframe metadata tables.","longDescription":"Three one-to-one tables keyed by assetId with cascade delete on AssetTable. AssetVideoTable records codec, bitrate, frame count, color metadata, Dolby Vision fields, and fragmentation; AssetAudioTable records codec and bitrate; AssetKeyframeTable stores keyframe data. Used by video transcoding and playback logic.","functions":["AssetVideoTable","AssetAudioTable","AssetKeyframeTable"],"children":[],"edges":[]},{"id":"file:server/src/schema/tables/asset-exif.table.ts","label":"asset exif table","kind":"file","path":"server/src/schema/tables/asset-exif.table.ts","weight":88,"shortDescription":"Declares EXIF metadata storage per asset, including geolocation and camera details.","longDescription":"AssetExifTable is keyed by assetId and holds camera make/model, dimensions, file size, capture dates, lens and exposure data, and latitude/longitude. A GiST index on ll_to_earth_public enables radius geo searches. Imports LockableProperty from database.ts for user-locked fields and uses UpdatedAtTrigger for sync tracking.","functions":["AssetExifTable"],"children":[],"edges":[]},{"id":"file:server/src/schema/enums.ts","label":"enums","kind":"file","path":"server/src/schema/enums.ts","weight":31,"shortDescription":"Registers PostgreSQL enum types mirrored from application enums.","longDescription":"Calls registerEnum to create database enums for album roles, asset status, face source type, visibility, checksum algorithm, video codec variants, and person user roles. Values derive from TypeScript enums in src/enum.js and person DTOs so database and application stay aligned. Consumed by table column definitions and the schema index.","functions":["album_user_role_enum","asset_visibility_enum","assets_status_enum","asset_face_source_type","asset_checksum_algorithm_enum","person_user_role_enum"],"children":[],"edges":[]},{"id":"file:server/src/schema/tables/person.table.ts","label":"person table","kind":"file","path":"server/src/schema/tables/person.table.ts","weight":73,"shortDescription":"Declares per-user person records referencing shared person groups.","longDescription":"PersonTable uses a composite primary key of ownerId and personGroupId, storing name, thumbnail, hidden flag, and birth date with a check constraint against future dates. A trigram GIN index on f_unaccent(name) supports accent-insensitive search. Delete triggers write audit rows and clean up associated shares.","functions":["PersonTable"],"children":[],"edges":[]},{"id":"file:server/src/schema/tables/user.table.ts","label":"user table","kind":"file","path":"server/src/schema/tables/user.table.ts","weight":70,"shortDescription":"Declares user accounts with credentials, quotas, profile, and soft deletion.","longDescription":"UserTable holds email, password and PIN hashes, admin flag, OAuth id, storage label, avatar color, quota fields, and status. Soft deletion uses deletedAt; an index on (updatedAt, id) supports sync paging. Triggers maintain updatedAt/updateId and record deletions in the user audit table.","functions":["UserTable"],"children":[],"edges":[]},{"id":"file:server/src/schema/tables/album-user.table.ts","label":"album user table","kind":"file","path":"server/src/schema/tables/album-user.table.ts","weight":66,"shortDescription":"Declares album membership with roles, enforcing a single owner per album.","longDescription":"AlbumUserTable joins albums and users with a composite primary key and role enum defaulting to editor. A partial unique index guarantees one owner per album. Statement triggers bump the parent album's updatedAt on non-owner inserts, audit deletions, and run album_user_delete row cleanup; createId/updateId columns support client sync.","functions":["AlbumUserTable"],"children":[],"edges":[]},{"id":"more:server:database-schema","label":"+60 more files","kind":"file","path":"server/src/schema/tables","weight":327,"shortDescription":"60 smaller files in this module.","longDescription":"video-stream.table.ts, activity.table.ts, asset-ocr.table.ts, memory.table.ts, person-user.table.ts, geodata-places.table.ts, asset-edit.table.ts, session.table.ts, album.table.ts, passkey.table.ts, notification.table.ts, partner.table.ts, shared-link.table.ts, user-metadata.table.ts, asset-metadata.table.ts, asset-file.table.ts, plugin.table.ts, tag.table.ts, library.table.ts, stack.table.ts, workflow.table.ts, person-group.table.ts, album-asset.table.ts, api-key.table.ts, memory-asset.table.ts, integrity-report.table.ts, sync-checkpoint.table.ts, workflow-log.table.ts, plugin-method.table.ts, auth-challenge.table.ts, cluster-group.table.ts, cluster-group-request.table.ts, move.table.ts, workflow-step.table.ts, ocr-search.table.ts, album-asset-audit.table.ts, smart-search.table.ts, asset-job-status.table.ts, face-search.table.ts, memory-asset-audit.table.ts, natural-earth-countries.table.ts, user-metadata-audit.table.ts, album-audit.table.ts, album-user-audit.table.ts, asset-audit.table.ts, asset-edit-audit.table.ts, asset-face-audit.table.ts, asset-metadata-audit.table.ts, memory-audit.table.ts, partner-audit.table.ts, person-audit.table.ts, person-group-audit.table.ts, stack-audit.table.ts, asset-ocr-audit.table.ts, tag-asset.table.ts, user-audit.table.ts, shared-link-asset.table.ts, system-metadata.table.ts, version-history.table.ts, tag-closure.table.ts","functions":[],"children":[],"edges":[]}],"edges":[]},{"id":"mod:server:shared-utils","label":"Shared Utilities","kind":"module","path":"server/src","weight":6469,"shortDescription":"Enums, constants, shared types, and helper utilities used across all layers.","longDescription":"enum.ts holds the domain enums, including job names, permissions, and asset types. constants.ts holds version ranges and error messages, and types.ts defines job and media option types. The utils folder contains access-control checks, Kysely query helpers, ffmpeg codec config builders, config caching, file and response helpers, image transform math, sync serialization, and workflow helpers.","children":[{"id":"file:server/src/enum.ts","label":"enum","kind":"file","path":"server/src/enum.ts","weight":1132,"shortDescription":"Central TypeScript enums and matching zod schemas shared across the server.","longDescription":"Defines string and integer enums for auth types, cookies, headers, query params, asset types, file types, album roles, ordering, jobs, queues, permissions, codecs and more. Many enums have companion zod schemas with OpenAPI metadata ids for DTO validation and spec generation. Imports WorkflowTrigger from the plugin SDK and uses asIntegerEnum helper.","functions":["AuthType","ImmichHeader","ImmichCookie","AssetType","AssetTypeSchema","AssetFileType"],"children":[],"edges":[]},{"id":"file:server/src/types.ts","label":"types","kind":"file","path":"server/src/types.ts","weight":550,"shortDescription":"Shared TypeScript types for media processing, repositories, jobs and uploads.","longDescription":"Declares cross-layer type aliases and interfaces: image/thumbnail options, raw bitmaps, video and audio stream info, transcode commands, job payloads and upload file shapes. Includes generic helpers like DeepPartial and RepositoryInterface. Pulls enums from enum.ts and DTO types so services, repositories and utils share one vocabulary.","functions":["DeepPartial","RepositoryInterface","ImageOptions","VideoStreamInfo","AudioStreamInfo","ImageDimensions"],"children":[],"edges":[]},{"id":"file:server/src/utils/database.ts","label":"database utils","kind":"file","path":"server/src/utils/database.ts","weight":1079,"shortDescription":"Kysely configuration and reusable query-builder fragments for Postgres.","longDescription":"Builds the Kysely config with the postgres.js dialect and plugins, plus UUID helpers, unnest, and constraint-name checks. Provides composable select helpers such as withExif, withDefaultVisibility and stream joins used by repositories, and search query builders driven by search DTO filters. Uses jsonArrayFrom/jsonObjectFrom for nested JSON results.","functions":["getKyselyConfig()","asUuid()","anyUuid()","unnest()","withExif()","withDefaultVisibility()"],"children":[],"edges":[]},{"id":"file:server/src/utils/media.ts","label":"media utils","kind":"file","path":"server/src/utils/media.ts","weight":1018,"shortDescription":"FFmpeg transcode configuration classes per codec and hardware accelerator.","longDescription":"Computes output sizes, rotation and codec strings using level tables from constants. Implements a class hierarchy (BaseConfig, BaseHWConfig) with subclasses for H264, HEVC, VP9, AV1 and hardware backends like NVENC and QSV that assemble ffmpeg input/output options, filters and tone mapping. Driven by ConfigFFmpegDto and stream info types.","functions":["getOutputSize()","getCodecString()","BaseConfig","BaseHWConfig","H264Config","NvencHwDecodeConfig"],"children":[],"edges":[]},{"id":"file:server/src/constants.ts","label":"constants","kind":"file","path":"server/src/constants.ts","weight":293,"shortDescription":"Server-wide constants: version ranges, pagination sizes, extensions and error messages.","longDescription":"Holds startup messages, documented error strings, Postgres and vector extension version ranges, job pagination and batch sizes, extension name maps and vector index tables. Also defines codec levels, salt rounds, CLIP model info and endpoint tags consumed by media, misc and database utilities. Reads package metadata from disk for the server version.","functions":["ErrorMessages","POSTGRES_VERSION_RANGE","VECTOR_EXTENSIONS","VECTOR_INDEX_TABLES","JOBS_ASSET_PAGINATION_SIZE","ASSET_VISIBILITY_DEPENDENT_PATHS"],"children":[],"edges":[]},{"id":"file:server/src/utils/misc.ts","label":"misc utils","kind":"file","path":"server/src/utils/misc.ts","weight":318,"shortDescription":"Grab-bag helpers for startup errors, config feature checks and OpenAPI generation.","longDescription":"Provides ImmichStartupError, object key utilities, deep key traversal and unset, and feature toggles like isSmartSearchEnabled derived from SystemConfig. Also configures Swagger/OpenAPI documents, patches standard-schema parameters and writes the spec file. Includes promise error handling and findOrFail lookups.","functions":["ImmichStartupError","getKeysDeep()","unsetDeep()","isSmartSearchEnabled()","handlePromiseError()","findOrFail()"],"children":[],"edges":[]},{"id":"file:server/src/utils/access.ts","label":"access utils","kind":"file","path":"server/src/utils/access.ts","weight":364,"shortDescription":"Permission and ownership checks for users, shared links and API keys.","longDescription":"Evaluates permission grants, then resolves which requested ids the caller may touch via AccessRepository, branching on shared link versus authenticated user. requireAccess throws BadRequest when any id is denied; person access uses role sets. Also guards upload access and elevated-permission sessions.","functions":["isGranted()","checkAccess()","requireAccess()","requirePersonAccess()","requireUploadAccess()","requireElevatedPermission()"],"children":[],"edges":[]},{"id":"file:server/src/utils/asset.util.ts","label":"asset utils","kind":"file","path":"server/src/utils/asset.util.ts","weight":198,"shortDescription":"Asset file lookup, bulk album membership and live-photo link hooks.","longDescription":"Selects asset files by type and edited state, and adds or removes assets in bulk with access checks and per-id error results. Resolves partner ids, runs link/unlink hooks across asset, event and partner repositories, and maps multer uploads into UploadFile requests. Includes dimension and panorama helpers.","functions":["getAssetFiles()","addAssets()","removeAssets()","getMyPartnerIds()","onBeforeLink()","mapToUploadFile()"],"children":[],"edges":[]},{"id":"file:server/src/utils/transform.ts","label":"transform utils","kind":"file","path":"server/src/utils/transform.ts","weight":215,"shortDescription":"Geometry helpers applying crop, rotate and mirror edits to coordinates.","longDescription":"Computes output dimensions after edits and composes affine matrices with transformation-matrix for rotation, mirroring and scaling. Transforms points, face bounding boxes and OCR boxes so detections stay aligned with edited images. Consumes AssetEditActionItem from the editing DTOs.","functions":["getOutputDimensions()","createAffineMatrix()","transformPoints()","transformFaceBoundingBox()","transformOcrBoundingBox()"],"children":[],"edges":[]},{"id":"file:server/src/utils/mime-types.ts","label":"mime types","kind":"file","path":"server/src/utils/mime-types.ts","weight":175,"shortDescription":"Extension-to-MIME mappings and asset type classification for supported files.","longDescription":"Maintains tables of RAW, web-supported image, video, audio and sidecar extensions with their MIME types. Exposes a mimeTypes object to look up MIME type, check supported formats and derive AssetType from a filename via getFilenameExtension. Notes intent to share the list with the web client.","functions":["mimeTypes"],"children":[],"edges":[]},{"id":"file:server/src/utils/file.ts","label":"file utils","kind":"file","path":"server/src/utils/file.ts","weight":82,"shortDescription":"Filename helpers and HTTP file-sending utilities for Express responses.","longDescription":"Extracts extensions and base names, builds sanitized download names respecting storage templates, and names live-photo motion files. ImmichFileResponse carries path, content type and cache control; sendFile streams it via Express with access checks and route error logging. asStreamableFile wraps read streams for Nest.","functions":["getFilenameExtension()","getDownloadFile()","getLivePhotoMotionFilename()","ImmichFileResponse","sendFile()","asStreamableFile()"],"children":[],"edges":[]},{"id":"file:server/src/utils/config.ts","label":"config utils","kind":"file","path":"server/src/utils/config.ts","weight":112,"shortDescription":"Loads, caches and persists system configuration from database and file.","longDescription":"getConfig builds SystemConfig by merging defaults with an optional YAML/JSON config file or stored overrides, cached in-module and guarded by AsyncLock. updateConfig stores only the diff from defaults via SystemMetadataRepository. Uses getKeysDeep and unsetDeep from misc and validates against AdminConfigDto.","functions":["getConfig()","updateConfig()","clearConfigCache()"],"children":[],"edges":[]},{"id":"more:server:shared-utils","label":"+26 more files","kind":"file","path":"server/src/utils","weight":187,"shortDescription":"26 smaller files in this module.","longDescription":"workflow.ts, editor.ts, preferences.ts, response.ts, maintenance.ts, search-filter.ts, duplicate.ts, resource-paths.ts, date.ts, sync.ts, storage.ts, event.ts, database-backups.ts, profile-image.ts, bytes.ts, request.ts, logger.ts, helmet.ts, replace-template-tags.ts, search-cursor.ts, pagination.ts, tag.ts, tasks.ts, object.ts, fetch.ts, helpers.ts","functions":[],"children":[],"edges":[]}],"edges":[]},{"id":"mod:server:emails","label":"Email Templates","kind":"module","path":"server/src/emails","weight":463,"shortDescription":"React Email templates for welcome, album, license, and test notification emails.","longDescription":"JSX templates are rendered to HTML by EmailRepository and sent through SMTP when NotificationService triggers them. Shared layouts for Immich and FUTO, a footer, and a button component give the templates a consistent look. The templates cover welcome emails, album invites and updates, license delivery, and SMTP test messages.","children":[{"id":"file:server/src/emails/album-update.email.tsx","label":"album-update.email","kind":"file","path":"server/src/emails/album-update.email.tsx","weight":78,"shortDescription":"Renders the email notifying a user that new media was added to a shared album.","longDescription":"React Email component that takes album and recipient props from email.repository and renders either a default greeting or an admin-supplied custom template with tags substituted via replaceTemplateTags. Custom HTML is injected with dangerouslySetInnerHTML. Optionally embeds an inline album thumbnail by CID and links to the album through ImmichButton inside ImmichLayout.","functions":["AlbumUpdateEmail()"],"children":[],"edges":[]},{"id":"file:server/src/emails/album-invite.email.tsx","label":"album-invite.email","kind":"file","path":"server/src/emails/album-invite.email.tsx","weight":74,"shortDescription":"Renders the email telling a user they were added to a shared album.","longDescription":"React Email component that builds a variables map (albumName, recipientName, senderName, albumId, baseUrl) used for custom-template substitution and preview text via templatePreview. Falls back to a built-in message when no custom template is set. Shows an optional CID-embedded album thumbnail and a button linking to the album, wrapped in ImmichLayout.","functions":["AlbumInviteEmail()"],"children":[],"edges":[]},{"id":"file:server/src/emails/components/futo.layout.tsx","label":"futo.layout","kind":"file","path":"server/src/emails/components/futo.layout.tsx","weight":74,"shortDescription":"FUTO-branded email layout shell with Tailwind theme, font, logo, and footer.","longDescription":"Wraps email content in Html, Tailwind, Head, and Body from react-email, using tailwindcss-preset-email plus FUTO colors (futo-primary, futo-bg, futo-footer). Loads the Overpass web font, sets the preview text, shows the Immich logo, and appends ImmichFooter. LicenseEmail uses it for purchase-related mail.","functions":["FutoLayout()"],"children":[],"edges":[]},{"id":"file:server/src/emails/components/immich.layout.tsx","label":"immich.layout","kind":"file","path":"server/src/emails/components/immich.layout.tsx","weight":69,"shortDescription":"Standard Immich email layout shell with Tailwind theme, font, logo, and footer.","longDescription":"Shared wrapper for the notification emails. It configures Tailwind with tailwindcss-preset-email and Immich colors (immich-primary, immich-gray, immich-footer), loads the Overpass font, and renders the preview text, Immich logo, a rounded content card, and ImmichFooter. The welcome, album, and test emails use it.","functions":["ImmichLayout()"],"children":[],"edges":[]},{"id":"file:server/src/emails/welcome.email.tsx","label":"welcome.email","kind":"file","path":"server/src/emails/welcome.email.tsx","weight":64,"shortDescription":"Renders the welcome email for a new account with credentials and login link.","longDescription":"React Email component that shows the display name, username, and an optional password, or an admin custom template with those values substituted via replaceTemplateTags. Generates preview text with templatePreview. Includes an ImmichButton and a plain-text fallback link to /auth/login, wrapped in ImmichLayout.","functions":["WelcomeEmail()"],"children":[],"edges":[]},{"id":"file:server/src/emails/license.email.tsx","label":"license.email","kind":"file","path":"server/src/emails/license.email.tsx","weight":41,"shortDescription":"Static license-key email template for the FUTOPay purchase flow.","longDescription":"Takes no props and outputs literal {{LICENSEKEY}} and {{ACTIVATIONKEY}} placeholders, which the external FUTOPay system fills in later. Shows the key in a highlighted block and gives a button and fallback link to the my.immich.app activation URL. Built on FutoLayout rather than ImmichLayout.","functions":["LicenseEmail()"],"children":[],"edges":[]},{"id":"file:server/src/emails/components/footer.template.tsx","label":"footer.template","kind":"file","path":"server/src/emails/components/footer.template.tsx","weight":33,"shortDescription":"Shared email footer with app store badges and the AGPL license notice.","longDescription":"Renders a two-column Row with Google Play and Apple App Store badge images that link to the Immich mobile apps, followed by a centered AGPL v3 license line linking to immich.app. Both ImmichLayout and FutoLayout include it.","functions":["ImmichFooter()"],"children":[],"edges":[]},{"id":"file:server/src/emails/test.email.tsx","label":"test.email","kind":"file","path":"server/src/emails/test.email.tsx","weight":20,"shortDescription":"Renders a simple test email to verify SMTP configuration.","longDescription":"Small ImmichLayout-based component that greets the recipient by display name and links to the instance baseUrl. Defines PreviewProps with sample data so the react-email dev preview can render it. It has no custom-template support.","functions":["TestEmail()"],"children":[],"edges":[]},{"id":"file:server/src/emails/components/button.component.tsx","label":"button.component","kind":"file","path":"server/src/emails/components/button.component.tsx","weight":10,"shortDescription":"Branded pill-shaped call-to-action button for emails.","longDescription":"Thin wrapper around the react-email Button that forwards all ButtonProps and applies fixed Tailwind classes: immich-primary background, rounded-full shape, white bold uppercase text. Children are wrapped in a padded Text element. The album, welcome, and license emails use it.","functions":["ImmichButton()"],"children":[],"edges":[]}],"edges":[]}],"edges":[]},{"id":"pkg:web","label":"Immich Web Client","kind":"package","path":"web","packageName":"immich-web","weight":54107,"shortDescription":"SvelteKit single-page app for browsing, managing and administering an Immich photo library.","longDescription":"SvelteKit app built as a static SPA and served by the Immich server. File-based routes cover user, admin, auth and maintenance pages. Pages are composed from Svelte 5 components and rune-based managers, and talk to the server through TanStack-style query and mutation wrappers around the generated SDK. A service worker handles image fetch cancellation.","children":[{"id":"mod:web:app-shell","label":"App Shell","kind":"module","path":"web","weight":2740,"shortDescription":"Build config, hooks, root layout, service worker, and auth, onboarding and maintenance pages.","longDescription":"Holds Vite, ESLint and Playwright config, SvelteKit client and server hooks, and route param matchers. The root layout mounts upload and download panels, the navigation loading bar and version announcements. Also contains login, registration, PIN prompt, onboarding and maintenance restore flows, plus a service worker that intercepts and cancels image requests.","children":[{"id":"file:web/src/routes/UploadPanel.svelte","label":"UploadPanel","kind":"file","path":"web/src/routes/UploadPanel.svelte","weight":166,"shortDescription":"Floating panel showing upload progress, per-asset status, and upload concurrency options.","longDescription":"Subscribes to uploadAssetsStore stats and flags to show a collapsible upload panel while uploads run. Acquires a screen wake lock while uploads remain and releases it afterwards. On fade-out it shows summary toasts for errors, successes and skipped duplicates, then resets the store. Users can adjust uploadExecutionQueue concurrency, and each item is rendered with UploadAssetPreview.","functions":["acquireWakeLock()","releaseWakeLock()","uploadAssetsStore.reset()"],"children":[],"edges":[]},{"id":"file:web/src/routes/ErrorLayout.svelte","label":"ErrorLayout","kind":"file","path":"web/src/routes/ErrorLayout.svelte","weight":83,"shortDescription":"Full-screen error card showing message, HTTP code, stack trace and support links.","longDescription":"The root layout renders this fallback when a page fails. It shows the error message, HTTP code and an optional stack trace inside an @immich/ui Card, with a logo header that links back to /photos. A copy button calls copyToClipboard to copy the message, code and stack for bug reports.","functions":["handleCopy()","copyToClipboard()"],"children":[],"edges":[]},{"id":"file:web/eslint.config.js","label":"ESLint Config","kind":"file","path":"web/eslint.config.js","weight":228,"shortDescription":"Flat ESLint config for Svelte, TypeScript, Tailwind and browser compatibility.","longDescription":"Combines the svelte, unicorn, typescript-eslint, prettier and better-tailwindcss rule sets. Browser API compatibility is enforced with eslint-plugin-compat and tscompat, using the targets read from .browserslistrc. It also defines AST selectors (ROUTE_CONTINUE, NAVIGATION_PARAM_READ) that restrict direct reads of navigation query parameters such as 'continue' and 'previousRoute'.","functions":["defineConfig()","ROUTE_CONTINUE","NAVIGATION_PARAM_READ"],"children":[],"edges":[]},{"id":"file:web/src/routes/+layout.svelte","label":"Root Layout","kind":"file","path":"web/src/routes/+layout.svelte","weight":219,"shortDescription":"Root SvelteKit layout that wires providers, websocket, i18n, navigation hooks and global panels.","longDescription":"Wraps the app in QueryClientProvider, TooltipProvider and CommandPaletteProvider, registering page, settings and site commands. Opens and closes the websocket connection, pushes locale and translations to @immich/ui and media-chrome, and redirects to maintenance through maintenanceShouldRedirect. Uses beforeNavigate/afterNavigate for the loading bar and sidebar state. Mounts UploadPanel, DownloadPanel, ServerRestartingModal and ErrorLayout.","functions":["openWebsocketConnection()","closeWebsocketConnection()","maintenanceShouldRedirect()","getUiTranslations()","beforeNavigate()","afterNavigate()"],"children":[],"edges":[]},{"id":"file:web/src/service-worker/request.ts","label":"SW Request Dedup","kind":"file","path":"web/src/service-worker/request.ts","weight":54,"shortDescription":"Service worker fetch handler that deduplicates in-flight requests and supports cancellation.","longDescription":"Keys pending requests by URL in a Map, and concurrent callers share one fetch, each receiving a cloned Response. Every request has an AbortController so the app can cancel it. Aborted requests resolve to a dummy 204 response to keep network errors out of the console. Map entries are removed after a five-minute timeout so response bodies can finish streaming.","functions":["handleFetch()","handleCancel()","getRequestKey()"],"children":[],"edges":[]},{"id":"file:web/src/routes/auth/login/+page.svelte","label":"Login Page","kind":"file","path":"web/src/routes/auth/login/+page.svelte","weight":194,"shortDescription":"Login page supporting password, OAuth callback completion and passkey (WebAuthn) sign-in.","longDescription":"Preloads the public and server config queries to decide which login methods to offer. Password login runs through loginMutation, and OAuth callbacks are finished with finishOAuthMutation on mount. Passkey login uses loginWithPasskeyMutation when browserSupportsWebAuthn() is true. On success it emits an auth event through eventManager and navigates with goto to onboarding, password change, or the continue route.","functions":["loginMutation","finishOAuthMutation","loginWithPasskeyMutation","createPreloadedQuery()","browserSupportsWebAuthn()"],"children":[],"edges":[]},{"id":"file:web/vite.config.ts","label":"Vite Config","kind":"file","path":"web/vite.config.ts","weight":185,"shortDescription":"Vite/SvelteKit build config with static adapter, CSP manifest plugin, dev proxy and Vitest.","longDescription":"Configures SvelteKit with adapter-static, enhanced images, Tailwind and an optional bundle visualizer. A custom cspManifest plugin collects media-chrome shadow templates and inline script and style tags, parses them with parse5, and hashes them to build Content-Security-Policy entries. It also sets up the dev server proxy to the Immich API from dotenv settings and Vitest browser testing through Playwright.","functions":["cspManifest()","isShadowTemplateElement()","defineConfig()"],"children":[],"edges":[]},{"id":"file:web/src/routes/UploadAssetPreview.svelte","label":"UploadAssetPreview","kind":"file","path":"web/src/routes/UploadAssetPreview.svelte","weight":107,"shortDescription":"Row showing a single upload's state, size, and dismiss or retry actions.","longDescription":"Displays an UploadAsset's state (pending, started, error, duplicate or done) as an icon, together with the file name, byte size and progress. Duplicates link to the existing asset via Route. Retry removes the item from uploadAssetsStore and re-queues the file through fileUploadHandler with the same albumId. Dismiss removes the item only.","functions":["handleDismiss()","handleRetry()","fileUploadHandler()","getByteUnitString()"],"children":[],"edges":[]},{"id":"file:web/src/routes/auth/onboarding/+page.svelte","label":"Onboarding Page","kind":"file","path":"web/src/routes/auth/onboarding/+page.svelte","weight":163,"shortDescription":"Multi-step onboarding wizard for admin and user setup preferences.","longDescription":"Defines an ordered list of OnboardingStep entries (hello, theme, language, server privacy, user privacy, storage template, backup, mobile app). Each step has a role, so admin-only steps are filtered by authManager. The current step is tracked in the URL through page state. On completion it runs updateAdminOnboardingMutation and setUserOnboardingMutation, then navigates to photos.","functions":["updateAdminOnboardingMutation","setUserOnboardingMutation","createPreloadedQuery()","executeMutation()","goto()"],"children":[],"edges":[]},{"id":"file:web/src/routes/maintenance/RestoreFlowDetectInstall.svelte","label":"RestoreFlowDetectInstall","kind":"file","path":"web/src/routes/maintenance/RestoreFlowDetectInstall.svelte","weight":88,"shortDescription":"Restore wizard step that checks storage folders of a prior install.","longDescription":"Runs detectPriorInstallQuery and lists each storage folder's read and write status and whether it contains files. Missing profile or upload data is flagged as a danger. Provides refresh, previous and next controls so the restore flow continues only after the user reviews the library folder checks.","functions":["getLibraryFolderCheckStatus()","detectPriorInstallQuery","next()","previous()"],"children":[],"edges":[]},{"id":"file:web/src/routes/auth/onboarding/OnboardingCard.svelte","label":"OnboardingCard","kind":"file","path":"web/src/routes/auth/onboarding/OnboardingCard.svelte","weight":78,"shortDescription":"Card wrapper for onboarding steps with title, icon and previous/next navigation.","longDescription":"Presentational container rendered around each onboarding step's content snippet. Shows an optional icon and title, plus previous/next buttons whose arrow direction follows languageManager.rtl. Both buttons call onLeave before onPrevious or onNext so a step can save its state before the wizard moves on.","functions":["onNext()","onPrevious()","onLeave()"],"children":[],"edges":[]},{"id":"file:web/src/routes/maintenance/+page.svelte","label":"Maintenance Page","kind":"file","path":"web/src/routes/maintenance/+page.svelte","weight":110,"shortDescription":"Maintenance mode page showing status, errors and database restore controls.","longDescription":"Polls getMaintenanceStatusQuery and shows progress, a filtered error log, or the MaintenanceRestoreFlow wizard. Uses setMaintenanceModeMutation to end maintenance or start a database restore selection. Removes the auth token from the URL with history.replaceState after load. Integrates ViewStatusModal from the FUTO backups orchestrator UI.","functions":["end()","startRestore()","getMaintenanceStatusQuery","setMaintenanceModeMutation"],"children":[],"edges":[]},{"id":"more:web:app-shell","label":"+38 more files","k ional numeric parsing of the selected option, and a disabled state. Shows an animated 'unsaved change' badge when isEdited is set, and notifies parents through an onSelect callback.","functions":["handleChange()","Props"],"children":[],"edges":[]},{"id":"file:web/src/routes/admin/system-settings/FFmpegSettings.svelte","label":"FFmpegSettings","kind":"file","path":"web/src/routes/admin/system-settings/FFmpegSettings.svelte","weight":428,"shortDescription":"Admin form for video transcoding settings like codecs, hardware acceleration and tone mapping.","longDescription":"Loads the admin system config through createPreloadedQuery(getAdminConfigQuery) and edits a deep-cloned copy. Exposes SDK enums such as VideoCodec, AudioCodec, TranscodeHWAccel, CQMode, ToneMapping and HlsVideoResolution through SettingSelect, SettingCheckboxes, inputs and switches grouped in accordions. Inputs are disabled when the server config comes from a file, and saving goes through SystemConfigButtonRow.","functions":["createPreloadedQuery()","getAdminConfigQuery()","cloneDeep()","isEqual()","sortBy()"],"children":[],"edges":[]},{"id":"file:web/src/routes/admin/system-settings/AuthSettings.svelte","label":"AuthSettings","kind":"file","path":"web/src/routes/admin/system-settings/AuthSettings.svelte","weight":339,"shortDescription":"Admin form for password login and OAuth authentication configuration.","longDescription":"Edits a cloned admin config for OAuth (issuer, client credentials, token endpoint auth method, mobile redirect override, scopes) and password login. Confirms before disabling all login methods using AuthDisableLoginConfirmModal through modalManager. Provides an unlink-all-OAuth-accounts action through executeMutation(unlinkAllOAuthAccountsAdminMutation). Saving is handled by SystemConfigButtonRow.","functions":["handleToggleOverride()","executeMutation()","unlinkAllOAuthAccountsAdminMutation()","getAdminConfigQuery()","AuthDisableLoginConfirmModal"],"children":[],"edges":[]},{"id" ons","PendingChange","ViewportTopMonth","ScrubberMonth","Direction"],"children":[],"edges":[]},{"id":"file:web/src/lib/managers/timeline-manager/timeline-manager.svelte.ts","label":"TimelineManager","kind":"file","path":"web/src/lib/managers/timeline-manager/timeline-manager.svelte.ts","weight":636,"shortDescription":"Rune-based controller for the virtualized photo timeline, its months, loading and updates.","longDescription":"Extends VirtualScrollManager to hold TimelineMonth buckets fetched via getTimeBuckets, tracking viewport proximity, geometry and scroll position. Delegates layout, loading, search and intersection logic to internal support modules and applies websocket changes through WebsocketSupport. Reacts to authManager, eventManager and userPreferencesManager, and uses CancellableTask for initialization and month loads.","functions":["TimelineManager"],"children":[],"edges":[]},{"id":"file:web/src/lib/managers/timeline-manager/timeline-month.svelte.ts","label":"TimelineMonth","kind":"file","path":"web/src/lib/managers/timeline-manager/timeline-month.svelte.ts","weight":354,"shortDescription":"Reactive month bucket holding day groups, assets, layout and load state.","longDescription":"Represents one year-month in the timeline, grouping assets into TimelineDay instances and tracking height, top offset and viewport proximity. Ingests TimeBucketAssetResponseDto columnar data, honors sort order and orderBy, and supports finding, moving and removing assets. Loads lazily through a CancellableTask and formats localized titles via svelte-i18n.","functions":["TimelineMonth"],"children":[],"edges":[]},{"id":"file:web/src/lib/managers/edit/transform-manager.svelte.ts","label":"transformManager","kind":"file","path":"web/src/lib/managers/edit/transform-manager.svelte.ts","weight":764,"shortDescription":"Singleton state for crop, rotate and mirror editing in the asset editor.","longDescription":"Implements EditToolManager for the transform tool, tracking crop region, aspect ratio, image scale, drag and resize interactions as runes. Converts regions between displayed and original image dimensions and normalizes edits into CropParameters and mirror/rotate actions. Loads asset previews via getAssetMediaUrl and is registered as a tool by EditManager.","functions":["transformManager","ResizeBoundary"],"children":[],"edges":[]},{"id":"file:web/src/lib/managers/timeline-manager/timeline-day.svelte.ts","label":"TimelineDay","kind":"file","path":"web/src/lib/managers/timeline-manager/timeline-day.svelte.ts","weight":174,"shortDescription":"Day group within a month that lays out and windows its viewer assets.","longDescription":"Holds the ViewerAssets for a single day, computes justified layout via getJustifiedLayoutFromAssets, and tracks its position, size and row/column within the month. Determines activeViewerAssets near the viewport using binary search over positions with TUNABLES expansion margins, so only visible thumbnails are rendered. Supports deferred layout and sorted insertion of assets.","functions":["TimelineDay","lowerBound()"],"children":[],"edges":[]},{"id":"file:web/src/lib/stores/preferences.store.ts","label":"preferences store","kind":"file","path":"web/src/lib/stores/preferences.store.ts","weight":119,"shortDescription":"Persisted Svelte stores for locale, language, map, album and places view settings.","longDescription":"Uses svelte-persisted-store to keep user UI preferences in localStorage, with custom serializers normalizing BCP47 locales and merging defaults into stored objects. Derives the effective formatting locale from the browser when set to default. Exposes enums and setting interfaces for album sort, grouping, filter and view modes plus places grouping.","functions":["localeSetting","locale","lang","mapSettings","albumViewSettings","placesViewSettings"],"children":[],"edges":[]},{"id":"file:web/src/lib/managers/asset-viewer-manager.svelte.ts","label":"assetViewerManager","kind":"file","path":"web/src/lib/ma atistics and map markers, with per-album queries derived via select from the cached album list. Mutations wrap SDK calls through asMutation, invalidate album cache keys, emit eventManager events, and show toasts for partial bulk failures. Delete redirects to the albums route via goto.","functions":["getAllAlbumsQuery()","getAlbumQuery()","invalidateAlbums()","createAlbumMutation()","addAssetsToAlbumsMutation()","removeAssetFromAlbumMutation()"],"children":[],"edges":[]},{"id":"file:web/src/lib/services/album.service.ts","label":"album.service","kind":"file","path":"web/src/lib/services/album.service.ts","weight":202,"shortDescription":"Album permission checks, album action lists, and album user management handlers.","longDescription":"Determines owner/editor rights from albumUsers and builds ActionItems for album lists, album pages and album asset selections: share, edit, options, upload, download, delete, leave. Handlers open modals (AddUsersModal, AlbumEditModal, SharedLinkCreateModal) and execute album mutations from album.query via executeMutation.","functions":["isAlbumOwner()","isAlbumEditor()","getAlbumActions()","getAlbumAssetsActions()","handleAddUsersToAlbum()","handleDeleteAlbum()"],"children":[],"edges":[]},{"id":"file:web/src/lib/queries/person.query.ts","label":"person.query","kind":"file","path":"web/src/lib/queries/person.query.ts","weight":103,"shortDescription":"Query and mutation definitions for people, faces and person sharing.","longDescription":"Provides paged and infinite queries for the people list, single person and statistics, plus users-for-people lookups. fetchFirstPeoplePage trims cached pages to the first before refetching. Mutations for create, update, merge, reassign faces and user sharing invalidate the people key or patch cache entries via updateCachedPerson.","functions":["getAllPeoplePagesQuery()","fetchFirstPeoplePage()","getPersonQuery()","updateCachedPerson()","mergePeopleMutation()","reassignFacesMutation()"],"children":[],"edges":[]},{"id":"file:web/src/lib/commands.ts","label":"commands","kind":"file","path":"web/src/lib/commands.ts","weight":241,"shortDescription":"Command palette providers listing navigable pages and quick settings.","longDescription":"Builds ActionItem providers for the @immich/ui command palette. getPagesProvider lists user and admin pages that navigate with goto and Route; getSettingsProvider exposes toggles such as theme preference, screencast mode and copying values to clipboard. Admin entries depend on authManager and user config read via readPreloadedQuery.","functions":["getPagesProvider()","getSettingsProvider()"],"children":[],"edges":[]},{"id":"file:web/src/lib/queries/client.ts","label":"query client","kind":"file","path":"web/src/lib/queries/client.ts","weight":151,"shortDescription":"Shared TanStack QueryClient with toast-driven error handling and mutation helpers.","longDescription":"Creates the app QueryClient with no retries and infinite staleTime, and global query/mutation caches that read typed meta to show success and error toasts. asMutation wraps SDK functions into mutation options; executeMutation runs a mutation imperatively with optional confirm modal, throwing MutationCancelledError on cancel. Also provides preloaded query helpers for route loaders.","functions":["queryClient","asMutation()","executeMutation()","readPreloadedQuery()","createPreloadedQuery()","MutationCancelledError"],"children":[],"edges":[]},{"id":"file:web/src/lib/services/queue.service.ts","label":"queue.service","kind":"file","path":"web/src/lib/services/queue.service.ts","weight":197,"shortDescription":"Action lists and display metadata for admin job queue pages.","longDescription":"Builds header and per-queue ActionItems: resume paused queues, create jobs, pause/resume, empty, open settings. Uses queue.query mutations through executeMutation, JobCreateModal via modalManager, and Route for navigation. asQueueItem maps each QueueName to an icon, title and subtitle for display.","functions":["getQueuesActions()","getQueueActions()","asQueueItem()"],"children":[],"edges":[]},{"id":"file:web/src/lib/queries/user.query.ts","label":"user.query","kind":"file","path":"web/src/lib/queries/user.query.ts","weight":83,"shortDescription":"Queries and mutations for the current user, preferences, and user lookups.","longDescription":"Defines queries for the signed-in user, preferences and calendar heatmap (kept with gcTime Infinity where long-lived), plus user search and single user. Mutations update profile, preferences, profile image, license and onboarding, writing results directly into the cache with setQueryData and declaring toast meta.","functions":["getMyUserQuery()","getMyPreferencesQuery()","getMyCalendarHeatmapQuery()","updateMyUserMutation()","updateMyPreferencesMutation()","setUserLicenseMutation()"],"children":[],"edges":[]},{"id":"file:web/src/lib/services/stack.service.ts","label":"stack.service","kind":"file","path":"web/src/lib/services/stack.service.ts","weight":161,"shortDescription":"Stack and unstack actions plus handlers for asset stacks.","longDescription":"Provides bulk Stack/Unstack actions based on owned selected assets, and per-stack actions such as set primary, remove asset, upload into stack and delete. Handlers execute stack.query mutations, read cached stacks via queryClient, emit eventManager updates, and navigate to the resulting primary asset.","functions":["getStackBulkActions()","getStackActions()","handleStack()","handleDeleteStack()"],"children":[],"edges":[]},{"id":"file:web/src/lib/queries/queue.query.ts","label":"queue.query","kind":"file","path":"web/src/lib/queries/queue.query.ts","weight":93,"shortDescription":"Polling queue queries, snapshot history, and queue command mutations.","longDescription":"getQueuesQuery polls every 3s and appends each result to a client-only snapshot query capped at 30 entries for charts. Single-queue queries derive from the list via select. Mutations update, empty or command queues, scan libraries and create manual jobs; isCreatingJob checks pending job-creation mutations.","functions":["getQueuesQuery()","getQueueSnapshotsQuery()","getQueueQuery()","updateQueueMutation()","emptyQueueMutation()","createJobMutation()"],"children":[],"edges":[]},{"id":"file:web/src/lib/queries/user-admin.query.ts","label":"user-admin.query","kind":"file","path":"web/src/lib/queries/user-admin.query.ts","weight":80,"shortDescription":"Admin queries and mutations for managing users, sessions and statistics.","longDescription":"Fetches all users including deleted once and filters client-side with select, deriving single-user queries from the same cache. Separate queries cover preferences, statistics, sessions and calendar heatmap. Mutations create, update, delete and restore users through asMutation with cache invalidation.","functions":["searchUsersAdminQuery()","getUserAdminQuery()","getUserStatisticsAdminQuery()","createUserAdminMutation()","deleteUserAdminMutation()","restoreUserAdminMutation()"],"children":[],"edges":[]},{"id":"file:web/src/lib/route.ts","label":"route","kind":"file","path":"web/src/lib/route.ts","weight":140,"shortDescription":"Typed URL builders for app pages, external links and API endpoints.","longDescription":"Route maps each page (auth, albums, assets, people, admin, queues) to a function producing a path with an encoded query string that drops empty values. Queue names convert to and from kebab-case slugs. ExternalRoute and ApiRoute hold outside links and SDK base-URL endpoints.","functions":["Route","ExternalRoute","ApiRoute","fromQueueSlug()"],"children":[],"edges":[]},{"id":"more:web:data-actions","label":"+53 more files","kind":"file","path":"web/src/lib/queries","weight":492,"shortDescription":"53 smaller files in this module.","longDescription":"search.query.ts, library.service.ts, shared-link.query.ts, workflow.query.ts, query-keys.ts, workflow.service.ts, auth.query.ts, database-backups.service.ts, library.query.ts, us
