  :root {
    --bg: #f5f5f7;
    /* label-3 is 4.5:1 on the page, cards, inspector, open groups and quiet wells; same ink as label-2, the lightest AA color on those surfaces */
    --label: #1d1d1f; --label-2: rgba(60,60,67,.76); --label-3: rgba(60,60,67,.76);
    --glass: rgba(255,255,255,.72); --glass-solid: rgba(250,250,252,.96); --glass-edge: rgba(0,0,0,.08); --glass-hi: rgba(255,255,255,.9);
    --glass-shadow: 0 0 0 .5px rgba(0,0,0,.06), 0 2px 6px rgba(0,0,0,.05), 0 12px 32px rgba(0,0,0,.10);
    --seg-bg: rgba(118,118,128,.12); --seg-on: #fff; --seg-on-shadow: 0 1px 2px rgba(0,0,0,.10), 0 0 0 .5px rgba(0,0,0,.04);
    --press: rgba(118,118,128,.14); --focus: #007aff; --flow: #007aff; --link: #0066cc;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", system-ui, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, "JetBrains Mono", Consolas, monospace;
  }
  /* macOS-style dark: elevated greys, never pure black; label alphas raised so every text style clears WCAG AA (4.5:1) */
  :root[data-theme="dark"] {
    --bg: #161618;
    --label: #f5f5f7; --label-2: rgba(235,235,245,.72); --label-3: rgba(235,235,245,.56);
    --glass: rgba(40,40,42,.76); --glass-solid: rgba(38,38,40,.97); --glass-edge: rgba(255,255,255,.10); --glass-hi: rgba(255,255,255,.06);
    --glass-shadow: 0 0 0 .5px rgba(255,255,255,.10), inset 0 .5px 0 rgba(255,255,255,.06), 0 2px 6px rgba(0,0,0,.32), 0 12px 32px rgba(0,0,0,.5);
    --seg-bg: rgba(118,118,128,.24); --seg-on: #636366; --seg-on-shadow: 0 1px 2px rgba(0,0,0,.35), inset 0 .5px 0 rgba(255,255,255,.08);
    --press: rgba(118,118,128,.28); --focus: #0a84ff; --flow: #0a84ff; --link: #409cff;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--label);
    font: 13px/1.38 var(--sans); letter-spacing: -0.006em; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  .grid { position: fixed; inset: 0; pointer-events: none; background-repeat: repeat; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; cursor: default; outline: none; }
  canvas.dragging { cursor: grabbing; }
  canvas:focus-visible { box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--focus) 55%, transparent); }
  button { -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 3px solid color-mix(in srgb, var(--focus) 55%, transparent); outline-offset: 1px; }

  /* floating glass capsule */
  #hud { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); height: 48px; box-sizing: border-box;
    max-width: calc(100vw - 48px); display: flex; align-items: center; gap: 8px; padding: 0 6px 0 16px;
    background: var(--glass); border-radius: 24px; box-shadow: var(--glass-shadow);
    -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); user-select: none; }
  #crumbs { display: flex; align-items: center; min-width: 0; overflow: hidden; white-space: nowrap; font-size: 13px; }
  #crumbs button { font: inherit; letter-spacing: inherit; color: var(--label-2); background: none; border: 0; padding: 4px 6px; border-radius: 8px;
    cursor: pointer; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: background-color .15s, color .15s; }
  #crumbs button:hover { color: var(--label); background: var(--press); }
  #crumbs button[aria-current="location"] { color: var(--label); font-weight: 600; }
  #crumbs .sep { width: 12px; height: 12px; flex: none; color: var(--label-3); }
  .divider { width: 1px; height: 20px; background: var(--glass-edge); margin: 0 4px; flex: none; }

tate, theming, and build configuration.","longDescription":"index.tsx mounts App.tsx, which composes the Excalidraw editor with collaboration, local persistence, menus, and sidebars. Holds the app Jotai store, timing constants, routes, theme handling, Sentry setup, and the Vite build config with PWA and chunk settings. Also includes a top-level error boundary and a bug-report template.","children":[{"id":"file:excalidraw-app/app_constants.ts","label":"app_constants","kind":"file","path":"excalidraw-app/app_constants.ts","weight":51,"shortDescription":"Shared timing, websocket, storage key, and Firebase prefix constants for the app.","longDescription":"Centralizes debounce and sync intervals (local storage saves, cursor sync, full-scene sync), upload size and cache limits, websocket event names and message subtypes for collaboration, Firebase storage path prefixes, room ID size, and localStorage/IndexedDB keys. Consumed by collaboration, persistence, and theming code so string keys and timeouts stay consistent.","functions":["STORAGE_KEYS","WS_EVENTS","WS_SUBTYPES","FIREBASE_STORAGE_PREFIXES","SYNC_FULL_SCENE_INTERVAL_MS","FILE_UPLOAD_MAX_BYTES"],"children":[],"edges":[]},{"id":"file:excalidraw-app/App.tsx","label":"App","kind":"file","path":"excalidraw-app/App.tsx","weight":1246,"shortDescription":"Root app component wiring the Excalidraw editor with collaboration, persistence, and UI extras.","longDescription":"Hosts the Excalidraw editor inside ExcalidrawAPIProvider and loads the initial scene from share links, collab rooms, or local storage. It reconciles and restores elements, debounces local saves, and syncs browser tabs. Also renders the share dialog, live collaboration trigger, command palette, error and overwrite dialogs, and branded menu links, and applies the theme from useHandleAppTheme.","functions":["ExcalidrawApp()","reconcileElements()","restoreElements()","restoreAppState()","useHandleAppTheme()","trackEvent()"],"children":[],"edges":[]},{"id":"file:excalidraw-app/app-jotai.ts","label":"app-jotai","kind":"file","path":"excalidraw-app/app-jotai.ts","weight":32,"shortDescription":"App-scoped Jotai store and atom helpers, including initialization from an initial value.","longDescription":"Creates a dedicated Jotai store (appJotaiStore) so app state stays separate from the editor package's store. Re-exports the Jotai primitives under one sanctioned import path, which an ESLint rule enforces. useAtomWithInitialValue seeds an atom once in a layout effect, from either a value or a lazy initializer.","functions":["appJotaiStore","useAtomWithInitialValue()","atom()","Provider"],"children":[],"edges":[]},{"id":"file:excalidraw-app/vite.config.mts","label":"vite config","kind":"file","path":"excalidraw-app/vite.config.mts","weight":474,"shortDescription":"Vite build configuration with PWA, HTML, sitemap, font, and lazy-chunk plugins.","longDescription":"Configures the dev server and production build: React, SVGR, EJS/HTML templating, type checking, a sitemap built from APP_ROUTES, and woff2 font handling. VitePWA sets up service-worker precaching and a navigation fallback. A custom lazyChunksPlugin finds chunks reachable only through dynamic imports, such as mermaid, and excludes them from the precache. It can also emit their file names as a JSON list for on-demand caching.","functions":["lazyChunksPlugin()","defineConfig()","VitePWA()","woff2BrowserPlugin()"],"children":[],"edges":[]},{"id":"file:excalidraw-app/components/TopErrorBoundary.tsx","label":"TopErrorBoundary","kind":"file","path":"excalidraw-app/components/TopErrorBoundary.tsx","weight":136,"shortDescription":"Top-level React error boundary that reports crashes to Sentry and shows a recovery splash.","longDescription":"Catches render errors and snapshots localStorage contents, parsing JSON where possible. It reports the exception to Sentry with error info attached, then shows a splash screen with the Sentry event ID and a selectable copy of the stored scene. It can open a prefilled GitHub issue, lazily importing bug-issue-template to build the issue body.","functions":["TopErrorBoundary","componentDidCatch()","errorSplash()","createGithubIssue()","selectTextArea()"],"children":[],"edges":[]},{"id":"file:excalidraw-app/sentry.ts","label":"sentry","kind":"file","path":"excalidraw-app/sentry.ts","weight":87,"shortDescription":"Initializes Sentry error reporting for production and staging hostnames only.","longDescription":"A side-effect module imported at startup. It maps hostnames to environments and stays off locally, in Docker, or when VITE_APP_DISABLE_SENTRY is set. It tags releases with the git SHA and ignores known noisy errors (IndexedDB closing, stale chunk fetches, quota errors). It captures console errors and feature flags, and beforeSend strips URL hashes so scene data and keys are never sent.","functions":["Sentry.init()","beforeSend()","SentryEnvHostnameMap"],"children":[],"edges":[]},{"id":"file:excalidraw-app/useHandleAppTheme.ts","label":"useHandleAppTheme","kind":"file","path":"excalidraw-app/useHandleAppTheme.ts","weight":40,"shortDescription":"Hook managing the light, dark, or system theme preference and the resolved editor theme.","longDescription":"Reads the saved preference from localStorage (default light) and writes changes back in a layout effect. Resolves the concrete editor theme from that preference. In 'system' mode it follows the prefers-color-scheme media query and listens for changes. Returns editorTheme, appTheme, and setAppTheme for App.tsx to pass to the editor.","functions":["useHandleAppTheme()","getDarkThemeMediaQuery()"],"children":[],"edges":[]},{"id":"file:excalidraw-app/app_routes.ts","label":"app_routes","kind":"file","path":"excalidraw-app/app_routes.ts","weight":11,"shortDescription":"Lists the extra URL paths the app is served on, besides root.","longDescription":"Defines APP_ROUTES, currently only the Excalidraw+ export path. The service worker navigation fallback allowlist and the sitemap in vite.config.mts both use it. Each route also needs a matching index.html rewrite in vercel.json, which a test enforces.","functions":["APP_ROUTES"],"children":[],"edges":[]},{"id":"file:excalidraw-app/index.tsx","label":"index","kind":"file","path":"excalidraw-app/index.tsx","weight":16,"shortDescription":"Browser entry point that initializes Sentry and the service worker, then renders the app.","longDescription":"Imports sentry.ts for its side effects and records a performance mark for startup stats. It exposes the build git SHA on window and registers the PWA service worker via virtual:pwa-register. Then it mounts ExcalidrawApp under React StrictMode with createRoot.","functions":["registerSW()","createRoot()","root.render()"],"children":[],"edges":[]},{"id":"file:excalidraw-app/bug-issue-template.js","label":"bug-issue-template","kind":"file","path":"excalidraw-app/bug-issue-template.js","weight":8,"shortDescription":"Builds the markdown body for a GitHub bug report, including the Sentry error ID.","longDescription":"A default-exported function that returns a markdown template with a placeholder section for scene content and the given Sentry event ID. TopErrorBoundary loads it lazily as a separate chunk when the user files an issue.","functions":["default()"],"children":[],"edges":[]}],"edges":[{"from":"file:excalidraw-app/App.tsx","to":"file:excalidraw-app/app-jotai.ts","weight":1},{"from":"file:excalidraw-app/App.tsx","to":"file:excalidraw-app/app_constants.ts","weight":1},{"from":"file:excalidraw-app/App.tsx","to":"file:excalidraw-app/app_routes.ts","weight":1},{"from":"file:excalidraw-app/App.tsx","to":"file:excalidraw-app/components/TopErrorBoundary.tsx","weight":1},{"from":"file:excalidraw-app/App.tsx","to":"file:excalidraw-app/useHandleAppTheme.ts","weight":1},{"from":"file:excalidraw-app/index.tsx","to":"file:excalidraw-app/App.tsx","weight":1},{"from":"file:excalidraw-app/index.tsx","to":"file:excalidraw-app/sentry.ts","weight":1},{"from":"file:excalidraw-app/useHandleAppTheme.ts","to":"file:excalidraw-app/app_constants.ts","weight":1},{"from":"file:excalidraw-app/vite.config.mts","to":"file:excalidraw-app/app_routes.ts","weight":1}]},{"id":"mod:excalidraw-app:collab","label":"Collaboration","kind":"module","path":"excalidraw-app","weight":1298,"shortDescription":"Real-time multi-user editing over websockets with encrypted scene sync.","longDescription":"Collab.tsx manages room lifecycle, scene reconciliation, cursor and follow state, and exposes CollabAPI through Jotai atoms. Portal.tsx wraps the socket connection and broadcasts encrypted updates. CollabError surfaces connection problems in the UI. A debug hook simulates collaborators for local testing.","children":[{"id":"file:excalidraw-app/collab/Collab.tsx","label":"Collab","kind":"file","path":"excalidraw-app/collab/Collab.tsx","weight":964,"shortDescription":"React component orchestrating collaboration sessions, scene reconciliation, and shared collab state atoms.","longDescription":"PureComponent that starts and stops collaboration rooms, decrypts incoming scene data, and reconciles remote elements with local ones via reconcileElements. Manages collaborator presence, idle state, cursor syncing, and image file uploads to Firebase storage. Exposes CollabAPI through Jotai atoms (collabAPIAtom, isCollaboratingAtom, isOfflineAtom) so the rest of the app can react to session state. Delegates socket transport to Portal.","functions":["collabAPIAtom","isCollaboratingAtom","isOfflineAtom","activeRoomLinkAtom","userToFollowAtom","CollabAPI"],"children":[],"edges":[]},{"id":"file:excalidraw-app/collab/Portal.tsx","label":"Portal","kind":"file","path":"excalidraw-app/collab/Portal.tsx","weight":229,"shortDescription":"Socket.io wrapper that joins rooms and broadcasts encrypted scene and presence updates.","longDescription":"Portal class owns the socket.io connection, room ID, and room key for one collaboration session. On open() it registers listeners for init-room, new-user, and room-user-change, then sends a full scene sync to joining users. Outgoing payloads are encrypted with encryptData before being emitted. broadcastedElementVersions tracks which element versions were already sent so only changed syncable elements go out; throttled broadcasts cover cursor and idle updates.","functions":["Portal","open()","broadcastScene()","broadcastMouseLocation()","broadcastIdleChange()","broadcastUserFollowed()"],"children":[],"edges":[]},{"id":"file:excalidraw-app/collab/CollabError.tsx","label":"CollabError","kind":"file","path":"excalidraw-app/collab/CollabError.tsx","weight":44,"shortDescription":"Warning indicator that shakes and shows a tooltip when a collaboration error occurs.","longDescription":"Reads an ErrorIndicator ({message, nonce}) stored in collabErrorIndicatorAtom and renders a warning icon wrapped in Tooltip. A useEffect replays a one-second shake animation whenever the message or nonce changes. Bumping the nonce lets the same error message animate again. Renders nothing when there is no message.","functions":["collabErrorIndicatorAtom","CollabError()"],"children":[],"edges":[]},{"id":"file:excalidraw-app/debugCollaborators.ts","label":"debugCollaborators","kind":"file","path":"excalidraw-app/debugCollaborators.ts","weight":61,"shortDescription":"Dev-only hook that fills the canvas with fake collaborators from a URL parameter.","longDescription":"The useSimulatedCollaborators hook reads ?collaborators=N in development builds and creates N static collaborators. Usernames come from a lazily imported @excalidraw/random-username, and the first entry is marked as the current user. The result is pushed into the Excalidraw API so avatar and UserList UI can be tested without a real room. Joining a real collab session overwrites these entries.","functions":["useSimulatedCollaborators()","generateSimulatedCollaborators()","getSimulatedCollaboratorCountFromUrl()"],"children":[],"edges":[]}],"edges":[{"from":"file:excalidraw-app/collab/Collab.tsx","to":"file:excalidraw-app/collab/CollabError.tsx","weight":1},{"from":"file:excalidraw-app/collab/Collab.tsx","to":"file:excalidraw-app/collab/Portal.tsx","weight":1},{"from":"file:excalidraw-app/collab/Portal.tsx","to":"file:excalidraw-app/collab/Collab.tsx","weight":1}]},{"id":"mod:excalidraw-app:data","label":"Data Persistence","kind":"module","path":"excalidraw-app/data","weight":1334,"shortDescription":"Local and Firebase storage for scenes, files, libraries, and tab sync.","longDescription":"LocalData debounces saves to localStorage and IndexedDB, including library and text-to-diagram adapters, with a Locker to pause saving. Firebase modules store encrypted scenes and binary files for shared rooms. FileManager tracks upload and load status for images. Tab-sync versioning keeps multiple browser tabs consistent; index.ts defines syncable element types and socket payload shapes.","children":[{"id":"file:excalidraw-app/data/index.ts","label":"Data Index","kind":"file","path":"excalidraw-app/data/index.ts","weight":269,"shortDescription":"Collaboration link handling, syncable element filtering, and shareable-link backend import/export.","longDescription":"Defines SyncableExcalidrawElement and filters elements eligible for sync, keeping recently deleted ones within DELETED_ELEMENT_TIMEOUT. Generates and parses collaboration links with room IDs and encryption keys. Exports scenes to the JSON backend by compressing and encrypting serialized data, uploading images via encodeFilesForUpload and saveFilesToFirebase, and imports them back by decrypting and decompressing.","functions":["getSyncableElements()","isSyncableElement()","generateCollaborationLinkData()","getCollaborationLinkData()","exportToBackend()","importFromBackend()"],"children":[],"edges":[]},{"id":"file:excalidraw-app/data/FileManager.ts","label":"FileManager","kind":"file","path":"excalidraw-app/data/FileManager.ts","weight":265,"shortDescription":"Tracks fetching and saving of binary image files with pluggable storage callbacks.","longDescription":"FileManager maintains maps of files being fetched, saved, already saved, and errored, keyed by fileId and version, so uploads are deduplicated. Storage is injected through getFiles/saveFiles callbacks, and status changes are reported via onFileStatusChange. Also provides compression for upload and marks stale image elements as errored through newElementWith and CaptureUpdateAction.","functions":["FileManager","encodeFilesForUpload()","updateStaleImageStatuses()"],"children":[],"edges":[]},{"id":"file:excalidraw-app/data/firebase.ts","label":"Firebase Storage","kind":"file","path":"excalidraw-app/data/firebase.ts","weight":275,"shortDescription":"Saves and loads encrypted collaboration scenes and files using Firestore and Firebase Storage.","longDescription":"Parses Firebase config from env and lazily initializes the SDK via dynamic import of firebaseSDK, retrying on failure. Scenes are encrypted and written inside Firestore transactions, reconciling with remote elements, with scene versions cached per socket to skip redundant saves. Files are uploaded to Storage with cache-control metadata and downloaded, decompressed, and restored on load.","functions":["saveToFirebase()","loadFromFirebase()","isSavedToFirebase()","saveFilesToFirebase()","loadFilesFromFirebase()","uploadBytesToFirebase()"],"children":[],"edges":[]},{"id":"file:excalidraw-app/data/LocalData.ts","label":"LocalData","kind":"file","path":"excalidraw-app/data/LocalData.ts","weight":249,"shortDescription":"Debounced browser persistence of scene state, images, and library data.","longDescription":"LocalData debounces saving elements and appState to localStorage and image files to IndexedDB via idb-keyval, using a Locker to pause saves and updating tab-sync versions after writes. A LocalFileManager subclass clears obsolete files. Quota errors set localStorageQuotaExceededAtom. Library persistence uses LibraryIndexedDBAdapter, with LibraryLocalStorageMigrationAdapter migrating legacy localStorage data.","functions":["LocalData","LibraryIndexedDBAdapter","LibraryLocalStorageMigrationAdapter","localStorageQuotaExceededAtom"],"children":[],"edges":[]},{"id":"file:excalidraw-app/data/localStorage.ts","label":"localStorage","kind":"file","path":"excalidraw-app/data/localStorage.ts","weight":87,"shortDescription":"Reads scene, app state, and collaborator username from localStorage, plus size helpers.","longDescription":"Wraps localStorage access in try/catch so unavailable storage or bad JSON degrades to defaults. Restores appState by merging getDefaultAppState with clearAppStateForLocalStorage output. Stores the collab username under its own key and reports byte sizes of stored elements and total app data.","functions":["importFromLocalStorage()","saveUsernameToLocalStorage()","importUsernameFromLocalStorage()","getElementsStorageSize()","getTotalStorageSize()"],"children":[],"edges":[]},{"id":"file:excalidraw-app/data/fileStatusStore.ts","label":"FileStatusStore","kind":"file","path":"excalidraw-app/data/fileStatusStore.ts","weight":41,"shortDescription":"Global versioned store of per-file loading statuses.","longDescription":"Static wrapper around VersionedSnapshotStore holding a Map of fileId to loading/loaded/error. updateStatuses produces a new Map only when a status actually changes, keeping snapshots stable for subscribers. getPendingCount computes loading versus total counts for progress display.","functions":["FileStatusStore","updateStatuses()","getSnapshot()","pull()","getPendingCount()"],"children":[],"edges":[]},{"id":"file:excalidraw-app/data/tabSync.ts","label":"Tab Sync","kind":"file","path":"excalidraw-app/data/tabSync.ts","weight":34,"shortDescription":"Timestamp versions in localStorage that detect newer state saved by other tabs.","longDescription":"Keeps in-memory timestamps for data state and files and compares them with values in localStorage to tell whether another tab saved more recently. Writes update both storage and memory; reset sets all versions to -1. Storage errors are logged rather than thrown.","functions":["isBrowserStorageStateNewer()","updateBrowserStateVersion()","resetBrowserStateVersions()"],"children":[],"edges":[]},{"id":"file:excalidraw-app/data/cacheMermaidChunks.ts","label":"Mermaid Chunk Cache","kind":"file","path":"excalidraw-app/data/cacheMermaidChunks.ts","weight":39,"shortDescription":"Prefetches Mermaid lazy chunks so the service worker caches them for offline use.","longDescription":"Reads a meta tag naming the chunk list emitted by the Vite lazyChunksPlugin, waits five seconds so the dialog loads its own chunks first, then fetches every listed chunk at low priority. Runs once per session when a service worker controls the page, and resets on failure so it can retry later.","functions":["cacheMermaidChunks()","MERMAID_CHUNKS_LIST_NAME"],"children":[],"edges":[]},{"id":"file:excalidraw-app/data/TTDStorage.ts","label":"TTD Storage","kind":"file","path":"excalidraw-app/data/TTDStorage.ts","weight":45,"shortDescription":"IndexedDB adapter persisting text-to-diagram chat history.","longDescription":"Static class backed by a dedicated idb-keyval store named from STORAGE_KEYS.IDB_TTD_CHATS, storing all chats under one key. Loading returns an empty array on missing data or errors; saving logs and rethrows failures. Implements the TTDPersistenceAdapter shape expected by the TTD dialog.","functions":["TTDIndexedDBAdapter","loadChats()","saveChats()"],"children":[],"edges":[]},{"id":"file:excalidraw-app/data/Locker.ts","label":"Locker","kind":"file","path":"excalidraw-app/data/Locker.ts","weight":15,"shortDescription":"Small typed lock registry for pausing operations while any lock is held.","longDescription":"Generic over string lock types, storing active locks in a Map. unlock reports whether no locks remain, and isLocked checks a specific lock or any lock. LocalData uses it to suspend local saves.","functions":["Locker","lock()","unlock()","isLocked()"],"children":[],"edges":[]},{"id":"file:excalidraw-app/data/firebaseSDK.ts","label":"Firebase SDK","kind":"file","path":"excalidraw-app/data/firebaseSDK.ts","weight":15,"shortDescription":"Re-exports the Firebase SDK subset loaded lazily by firebase.ts.","longDescription":"Statically re-exports initializeApp, Firestore helpers (getFirestore, doc, getDoc, runTransaction, Bytes), and Storage helpers (getStorage, ref, uploadBytes). Kept as a separate module so the dynamic import stays out of the main bundle, and static re-exports keep Rollup tree-shaking effective despite Vite's preload wrapper.","functions":["initializeApp()","getFirestore()","runTransaction()","getStorage()","uploadBytes()"],"children":[],"edges":[]}],"edges":[{"from":"file:excalidraw-app/data/LocalData.ts","to":"file:excalidraw-app/data/FileManager.ts","weight":1},{"from":"file:excalidraw-app/data/LocalData.ts","to":"file:excalidraw-app/data/fileStatusStore.ts","weight":1},{"from":"file:excalidraw-app/data/LocalData.ts","to":"file:excalidraw-app/data/Locker.ts","weight":1},{"from":"file:excalidraw-app/data/LocalData.ts","to":"file:excalidraw-app/data/tabSync.ts","weight":1},{"from":"file:excalidraw-app/data/firebase.ts","to":"file:excalidraw-app/data/index.ts","weight":1},{"from":"file:excalidraw-app/data/firebase.ts","to":"file:excalidraw-app/data/firebaseSDK.ts","weight":1},{"from":"file:excalidraw-app/data/index.ts","to":"file:excalidraw-app/data/FileManager.ts","weight":1},{"from":"file:excalidraw-app/data/index.ts","to":"file:excalidraw-app/data/firebase.ts","weight":1}]},{"id":"mod:excalidraw-app:share","label":"Sharing","kind":"module","path":"excalidraw-app/share","weight":311,"shortDescription":"Share dialog for live collaboration links and shareable exports with QR codes.","longDescription":"ShareDialog lets users start or join a live session or create a shareable link, with state held in a Jotai atom. QR code generation is split into a lazily loaded chunk to keep the main bundle small.","children":[{"id":"file:excalidraw-app/share/ShareDialog.tsx","label":"ShareDialog","kind":"file","path":"excalidraw-app/share/ShareDialog.tsx","weight":259,"shortDescription":"Dialog for starting, sharing, and stopping live collaboration sessions and exporting links.","longDescription":"Renders the share dialog whose open state and mode ('share' or 'collaborationOnly') live in a jotai atom. Shows the active room link with copy, native share, and QR code actions, or offers to start a session or export to backend. Reads activeRoomLinkAtom and CollabAPI from the collab module, picks platform-specific share icons, and tracks analytics events.","functions":["ShareDialog()","shareDialogStateAtom","getShareIcon()","ShareDialogProps"],"children":[],"edges":[]},{"id":"file:excalidraw-app/share/QRCode.tsx","label":"QRCode","kind":"file","path":"excalidraw-app/share/QRCode.tsx","weight":48,"shortDescription":"Renders a QR code SVG for a link, lazy-loading the generator.","longDescription":"Dynamically imports the qrcode chunk on mount or value change so the QR library stays out of the main bundle. Shows a Spinner while loading, renders nothing on failure, and injects the generated SVG markup with an accessible img role. A mounted flag prevents state updates after unmount.","functions":["QRCode()"],"children":[],"edges":[]},{"id":"file:excalidraw-app/share/qrcode.chunk.ts","label":"qrcode chunk","kind":"file","path":"excalidraw-app/share/qrcode.chunk.ts","weight":4,"shortDescription":"Thin wrapper turning text into QR code SVG markup via uqr.","longDescription":"Separate lazily loaded chunk wrapping the uqr library's renderSVG. Isolating it lets QRCode.tsx code-split the dependency so it loads only when a collaboration link QR code is displayed.","functions":["generateQRCodeSVG()"],"children":[],"edges":[]}],"edges":[{"from":"file:excalidraw-app/share/QRCode.tsx","to":"file:excalidraw-app/share/qrcode.chunk.ts","weight":1},{"from":"file:excalidraw-app/share/ShareDialog.tsx","to":"file:excalidraw-app/share/QRCode.tsx","weight":1}]},{"id":"mod:excalidraw-app:ui-components","label":"App UI Components","kind":"module","path":"excalidraw-app","weight":568,"shortDescription":"App-specific menus, sidebar, welcome screen, footer, stats, and AI integrations.","longDescription":"Customizes the editor's slots with the app main menu, welcome screen, sidebar, footer, and encryption indicator. AI.tsx connects diagram-to-code and text-to-diagram features to backend endpoints. CustomStats adds storage usage to the stats panel.","children":[{"id":"file:excalidraw-app/components/AI.tsx","label":"AI","kind":"file","path":"excalidraw-app/components/AI.tsx","weight":160,"shortDescription":"Wires diagram-to-code and text-to-diagram AI plugins into the app.","longDescription":"Renders DiagramToCodePlugin, which exports the selected frame as a JPEG data URL and streams generated code, plus TTDDialog backed by streaming fetch and SSE parsing. Persists text-to-diagram history via TTDIndexedDBAdapter and preloads Mermaid chunks when the TTD dialog opens, observed through useOnExcalidrawStateChange.","functions":["AIComponents()","DiagramToCodePlugin","TTDDialog","cacheMermaidChunks()","parseSSEStream()","exportScene()"],"children":[],"edges":[]},{"id":"file:excalidraw-app/components/AppSidebar.tsx","label":"AppSidebar","kind":"file","path":"excalidraw-app/components/AppSidebar.tsx","weight":125,"shortDescription":"App sidebar extending the default sidebar with promo tabs for comments and presentations.","longDescription":"Wraps DefaultSidebar with extra tab triggers and panels that promote Excalidraw+ features such as comments and presentations. SidebarPromoCopy renders inline SVG illustrations, a free-trial note, and a LinkButton call to action. Reads theme from useUIAppState to adjust visuals, and styling lives in AppSidebar.scss.","functions":["AppSidebar()","SidebarPromoCopy()","DefaultSidebar","Sidebar"],"children":[],"edges":[]},{"id":"file:excalidraw-app/components/AppMainMenu.tsx","label":"AppMainMenu","kind":"file","path":"excalidraw-app/components/AppMainMenu.tsx","weight":84,"shortDescription":"Hamburger main menu composed of default items plus app-specific links and options.","longDescription":"Memoized component that assembles MainMenu default items (load, save, export, help, clear canvas) and conditionally shows the live collaboration trigger. Adds Excalidraw+ marketing and sign-in links built from Vite env URLs, a dev-only visual debug toggle via saveDebugState, theme and language selection through LanguageList, and the canvas background picker.","functions":["AppMainMenu()","MainMenu","LanguageList()","saveDebugState()","isExcalidrawPlusSignedUser"],"children":[],"edges":[]},{"id":"file:excalidraw-app/components/AppWelcomeScreen.tsx","label":"AppWelcomeScreen","kind":"file","path":"excalidraw-app/components/AppWelcomeScreen.tsx","weight":78,"shortDescription":"Welcome screen with hints, heading, and quick-action menu items.","longDescription":"Memoized wrapper around WelcomeScreen that renders menu, toolbar, and help hints, a logo, and a localized heading. Signed-in Excalidraw+ users get a heading with an inline Excalidraw+ link produced by splitting the translated string. The center menu offers load scene, help, an optional live collaboration item, and an Excalidraw+ sign-up link.","functions":["AppWelcomeScreen()","WelcomeScreen","isExcalidrawPlusSignedUser"],"children":[],"edges":[]},{"id":"file:excalidraw-app/CustomStats.tsx","label":"CustomStats","kind":"file","path":"excalidraw-app/CustomStats.tsx","weight":79,"shortDescription":"Adds app version and local storage size rows to the stats panel.","longDescription":"Injects Stats.StatsRows at order -1 showing build timestamp and hash parsed from getVersion(), which can be copied to the clipboard with a toast confirmation. Uses a debounced getStorageSizes to compute scene and total localStorage usage, refreshing when elements or appState change and cancelling on unmount. Sizes are formatted with nFormatter.","functions":["CustomStats()","getStorageSizes()","getElementsStorageSize()","getTotalStorageSize()","copyTextToSystemClipboard()"],"children":[],"edges":[]},{"id":"file:excalidraw-app/components/AppFooter.tsx","label":"AppFooter","kind":"file","path":"excalidraw-app/components/AppFooter.tsx","weight":23,"shortDescription":"Footer showing the visual debugger controls and the encryption badge.","longDescription":"Memoized Footer wrapper that lays out a flex row containing DebugFooter when the visual debugger is enabled. It shows EncryptedIcon only for users not signed in to Excalidraw+. The onChange callback is passed through to the debug footer.","functions":["AppFooter()","DebugFooter()","isVisualDebuggerEnabled()","EncryptedIcon()"],"children":[],"edges":[]},{"id":"file:excalidraw-app/components/EncryptedIcon.tsx","label":"EncryptedIcon","kind":"file","path":"excalidraw-app/components/EncryptedIcon.tsx","weight":19,"shortDescription":"Shield icon linking to the end-to-end encryption blog post.","longDescription":"Renders an external anchor to the Excalidraw+ end-to-end encryption article, wrapping the shield icon in a long Tooltip. Uses useI18n for the aria-label and tooltip text.","functions":["EncryptedIcon()","Tooltip"],"children":[],"edges":[]}],"edges":[{"from":"file:excalidraw-app/components/AppFooter.tsx","to":"file:excalidraw-app/components/EncryptedIcon.tsx","weight":1}]},{"id":"mod:excalidraw-app:excalidraw-plus","label":"Excalidraw Plus","kind":"module","path":"excalidraw-app","weight":399,"shortDescription":"Export to Excalidraw+ and promo banner integration.","longDescription":"Uploads the current scene and files to Excalidraw+ through Firebase, and provides an iframe export entry point that Excalidraw+ embeds to read local scenes. A promo banner links users to the paid product.","children":[{"id":"file:excalidraw-app/ExcalidrawPlusIframeExport.tsx","label":"Plus Iframe Export","kind":"file","path":"excalidraw-app/ExcalidrawPlusIframeExport.tsx","weight":188,"shortDescription":"Iframe bridge that sends locally stored scene data to Excalidraw+ via postMessage.","longDescription":"Renders inside an iframe embedded by Excalidraw+, posts a READY message, and answers REQUEST_SCENE messages from the VITE_APP_PLUS_APP origin. Reads elements and appState from localStorage via STORAGE_KEYS, loads binary files through LocalData, and replies with SCENE_DATA or ERROR. Typed message unions define the protocol in both directions, and parseSceneData validates the raw strings before sending.","functions":["ExcalidrawPlusIframeExport()","parseSceneData()","base64urlToString()","LocalData"],"children":[],"edges":[]},{"id":"file:excalidraw-app/components/ExportToExcalidrawPlus.tsx","label":"Export To Plus","kind":"file","path":"excalidraw-app/components/ExportToExcalidrawPlus.tsx","weight":119,"shortDescription":"Encrypts and uploads the current scene to Firebase for import into Excalidraw+.","longDescription":"exportToExcalidrawPlus serializes the scene with serializeAsJSON, encrypts it with a newly generated key, and uploads the blob to Firebase under /migrations/scenes/{nanoid}. It records version and name metadata, encodes image files with encodeFilesForUpload, and saves them through saveFilesToFirebase, subject to FILE_UPLOAD_MAX_BYTES. It then redirects to Excalidraw+ with the id and key. The ExportToExcalidrawPlus card component provides the export dialog UI and analytics tracking.","functions":["exportToExcalidrawPlus()","ExportToExcalidrawPlus()","encryptData()","uploadBytesToFirebase()","saveFilesToFirebase()","encodeFilesForUpload()"],"children":[],"edges":[]},{"id":"file:excalidraw-app/components/ExcalidrawPlusPromoBanner.tsx","label":"Plus Promo Banner","kind":"file","path":"excalidraw-app/components/ExcalidrawPlusPromoBanner.tsx","weight":92,"shortDescription":"Shows a promo banner linking to an Excalidraw+ feature or the CLI.","longDescription":"Holds a fixed PROMOS list of features (presentations, MCP, comments, teams, voice chat, CLI). Each entry has an icon, translation keys, and a UTM-tagged link built by plusLink from VITE_APP_PLUS_LP. One promo is chosen at random once per editor load and rendered as a link using i18n strings. Promo text is kept short so the banner fits the width of the original button.","functions":["ExcalidrawPlusPromoBanner()","plusLink()","PROMOS"],"children":[],"edges":[]}],"edges":[]},{"id":"mod:excalidraw-app:language","label":"Language","kind":"module","path":"excalidraw-app/app-language","weight":53,"shortDescription":"Detects, stores, and lets users pick the UI language.","longDescription":"Uses a browser language detector to choose the initial locale, keeps the current code in a Jotai atom, and renders a language picker list in the main menu.","children":[{"id":"file:excalidraw-app/app-language/language-detector.ts","label":"language-detector","kind":"file","path":"excalidraw-app/app-language/language-detector.ts","weight":19,"shortDescription":"Detects the browser's preferred language and maps it to a supported locale.","longDescription":"Creates a shared i18next-browser-languagedetector instance and initializes it with empty languageUtils. getPreferredLanguage() takes the first detected language and matches it by prefix against Excalidraw's supported languages, so generic codes like \"zh\" still resolve to a regional variant. Falls back to defaultLang when nothing matches.","functions":["languageDetector","getPreferredLanguage()"],"children":[],"edges":[]},{"id":"file:excalidraw-app/app-language/language-state.ts","label":"language-state","kind":"file","path":"excalidraw-app/app-language/language-state.ts","weight":11,"shortDescription":"Holds the app's current language code in a Jotai atom and persists changes.","longDescription":"Defines appLangCodeAtom, seeded from getPreferredLanguage() at module load. The useAppLangCode() hook returns the language code and its setter, and an effect calls languageDetector.cacheUserLanguage() whenever the code changes. That writes the user's choice back to the detector's caches so it is picked up on the next visit.","functions":["appLangCodeAtom","useAppLangCode()"],"children":[],"edges":[]},{"id":"file:excalidraw-app/app-language/LanguageList.tsx","label":"LanguageList","kind":"file","path":"excalidraw-app/app-language/LanguageList.tsx","weight":23,"shortDescription":"Dropdown select that lets users choose the UI language.","longDescription":"React component that renders a \u003cselect> with one option per entry in Excalidraw's languages list. It reads the active langCode and the translation function t from useI18n(), and writes the user's choice to appLangCodeAtom via useSetAtom. The dropdown gets a localized aria-label and accepts an optional style prop.","functions":["LanguageList()"],"children":[],"edges":[]}],"edges":[{"from":"file:excalidraw-app/app-language/LanguageList.tsx","to":"file:excalidraw-app/app-language/language-state.ts","weight":1},{"from":"file:excalidraw-app/app-language/language-state.ts","to":"file:excalidraw-app/app-language/language-detector.ts","weight":1}]},{"id":"mod:excalidraw-app:debug-canvas","label":"Visual Debugger","kind":"module","path":"excalidraw-app/components","weight":517,"shortDescription":"Developer canvas overlay for rendering and saving geometry debug state.","longDescription":"Renders debug shapes on a separate canvas over the editor when the visual debugger is enabled. Saves and restores debug frames and provides a footer of controls for stepping through them.","children":[{"id":"file:excalidraw-app/components/DebugCanvas.tsx","label":"DebugCanvas","kind":"file","path":"excalidraw-app/components/DebugCanvas.tsx","weight":517,"shortDescription":"Renders geometry debug overlays on a canvas and persists debug state to storage.","longDescription":"Draws debug primitives (line segments, cubic Bezier curves, polygons) and arrow binding fixed points onto a dedicated overlay canvas, scaled by zoom and throttled with throttleRAF. Saves and loads debug frames via localStorage under STORAGE_KEYS. Also exposes a React DebugFooter with controls to step, clear, or close the debugger. Uses @excalidraw/math type guards and @excalidraw/element binding helpers.","functions":["debugRenderer()","saveDebugState()","loadSavedDebugState()","isVisualDebuggerEnabled()","DebugFooter()","renderCubicBezier()"],"children":[],"edges":[]}],"edges":[]}],"edges":[{"from":"mod:excalidraw-app:app-shell","to":"mod:excalidraw-app:data","weight":8},{"from":"mod:excalidraw-app:collab","to":"mod:excalidraw-app:data","weight":8},{"from":"mod:excalidraw-app:data","to":"mod:excalidraw-app:app-shell","weight":7},{"from":"mod:excalidraw-app:app-shell","to":"mod:excalidraw-app:ui-components","weight":6},{"from":"mod:excalidraw-app:collab","to":"mod:excalidraw-app:app-shell","weight":4},{"from":"mod:excalidraw-app:app-shell","to":"mod:excalidraw-app:collab","weight":3},{"from":"mod:excalidraw-app:app-shell","to":"mod:excalidraw-app:excalidraw-plus","weight":3},{"from":"mod:excalidraw-app:ui-components","to":"mod:excalidraw-app:data","weight":3},{"from":"mod:excalidraw-app:excalidraw-plus","to":"mod:excalidraw-app:data","weight":3},{"from":"mod:excalidraw-app:ui-components","to":"mod:excalidraw-app:app-shell","weight":3},{"from":"mod:excalidraw-app:app-shell","to":"mod:excalidraw-app:language","weight":2},{"from":"mod:excalidraw-app:excalidraw-plus","to":"mod:excalidraw-app:app-shell","weight":2},{"from":"mod:excalidraw-app:language","to":"mod:excalidraw-app:app-shell","weight":2},{"from":"mod:excalidraw-app:ui-components","to":"mod:excalidraw-app:debug-canvas","weight":2},{"from":"mod:excalidraw-app:app-shell","to":"mod:excalidraw-app:share","weight":1},{"from":"mod:excalidraw-app:app-shell","to":"mod:excalidraw-app:debug-canvas","weight":1},{"from":"mod:excalidraw-app:ui-components","to":"mod:excalidraw-app:language","weight":1},{"from":"mod:excalidraw-app:debug-canvas","to":"mod:excalidraw-app:app-shell","weight":1},{"from":"mod:excalidraw-app:data","to":"mod:excalidraw-app:collab","weight":1},{"from":"mod:excalidraw-app:share","to":"mod:excalidraw-app:app-shell","weight":1},{"from":"mod:excalidraw-app:share","to":"mod:excalidraw-app:collab","weight":1}]},{"id":"pkg:packages/common","label":"Excalidraw Common","kind":"package","path":"packages/common","packageName":"@excalidraw/common","weight":3368,"shortDescription":"Shared constants, utilities, data structures, and types used across Excalidraw packages.","longDescription":"Foundation layer for the Excalidraw monorepo with no editor-specific logic. Provides app-wide constants, color palettes, font metadata, keyboard mappings, general DOM and string helpers, small generic data structures, and event primitives. Exposed through a single src/index.ts barrel, with a standalone debug helper at the package root.","children":[{"id":"mod:packages/common:constants-config","label":"Constants & Config","kind":"module","path":"packages/common/src","weight":1310,"shortDescription":"App-wide constants, color palettes, font metadata, and responsive breakpoints.","longDescription":"Centralizes tunable values such as text wrap thresholds, drag thresholds, and arrow sizes. Defines color palettes and dark-mode filter helpers, font metadata with line-height and vertical-offset lookups, and media-query breakpoints plus the EditorInterface and StylesPanelMode descriptors used for layout decisions.","children":[{"id":"file:packages/common/src/constants.ts","label":"constants","kind":"file","path":"packages/common/src/constants.ts","weight":553,"shortDescription":"Central app-wide constants for interaction thresholds, cursors, fonts, and defaults.","longDescription":"Defines numeric thresholds for text wrapping, dragging, arrow sizing, snapping and shift-locking, plus enums like CURSOR_TYPE and font family maps. Re-exports DEFAULT_STICKY_NOTE_BG and draws on COLOR_PALETTE from colors.ts for default colors. Imports element and app-state types only, keeping the module dependency-light so element, math and excalidraw packages can share it.","functions":["supportsResizeObserver","TEXT_AUTOWRAP_THRESHOLD","TEXT_MAX_WRAP_WIDTH","DRAGGING_THRESHOLD","SHIFT_LOCKING_ANGLE","CURSOR_TYPE"],"children":[],"edges":[]},{"id":"file:packages/common/src/colors.ts","label":"colors","kind":"file","path":"packages/common/src/colors.ts","weight":391,"shortDescription":"Color palette definitions and dark-mode color transformation helpers.","longDescription":"Declares COLOR_PALETTE with shade tuples, picker layout constants, top-pick slots and default stroke/background indexes. Implements dark-mode conversion by emulating CSS invert and hue-rotate filters with a matrix, using tinycolor2 and @excalidraw/math helpers. Results are memoized in a browser-only Map so server-side use does not leak memory.","functions":["applyDarkModeFilter()","removeDarkModeFilter()","COLOR_PALETTE","DEFAULT_ELEMENT_STROKE_PICKS","COLOR_TOP_PICKS_SLOTS","ColorPalette"],"children":[],"edges":[]},{"id":"file:packages/common/src/editorInterface.ts","label":"editorInterface","kind":"file","path":"packages/common/src/editorInterface.ts","weight":195,"shortDescription":"Responsive breakpoints, editor form-factor types, and user-agent platform detection.","longDescription":"Defines the EditorInterface type describing form factor, desktop UI mode, touch support and sidebar fit, plus StylesPanelMode. Exports media-query breakpoints for mobile, tablet, landscape, desktop and right sidebar. Browser and OS flags are computed at module scope with guards for missing navigator/window, so the export pipeline can load the module under Node. Persists desktop UI mode under a localStorage key.","functions":["EditorInterface","MQ_MAX_MOBILE","MQ_MAX_TABLET","MQ_RIGHT_SIDEBAR_MIN_WIDTH","isDarwin","isSafari"],"children":[],"edges":[]},{"id":"file:packages/common/src/font-metadata.ts","label":"font-metadata","kind":"file","path":"packages/common/src/font-metadata.ts","weight":171,"shortDescription":"Font metrics registry and helpers for text line height and vertical offset.","longDescription":"FONT_METADATA maps each FONT_FAMILY id to head/hhea metrics (unitsPerEm, ascender, descender, line height) and flags for deprecated, private, local or fallback fonts. Helpers derive the vertical baseline offset and line height used for text layout and rendering. Also exposes Google Fonts unicode ranges and the local font protocol, using FONT_FAMILY and FONT_FAMILY_FALLBACKS from constants.ts.","functions":["FONT_METADATA","getVerticalOffset()","getLineHeight()","GOOGLE_FONTS_RANGES","LOCAL_FONT_PROTOCOL","FontMetadata"],"children":[],"edges":[]}],"edges":[{"from":"file:packages/common/src/constants.ts","to":"file:packages/common/src/colors.ts","weight":1},{"from":"file:packages/common/src/font-metadata.ts","to":"file:packages/common/src/constants.ts","weight":1}]},{"id":"mod:packages/common:input-keys","label":"Keyboard Input","kind":"module","path":"packages/common/src","weight":141,"shortDescription":"Key and code maps plus helpers for matching keyboard events.","longDescription":"Defines KEYS and CODES lookup tables and a KeyCodeMap type for layout-independent shortcut handling. Helpers like matchKey, isLatinChar, isArrowKey, and shouldResizeFromCenter interpret keyboard events consistently for editor shortcuts and modifier-driven transforms.","children":[{"id":"file:packages/common/src/keys.ts","label":"keys","kind":"file","path":"packages/common/src/keys.ts","weight":141,"shortDescription":"Keyboard key/code constants and helpers for matching events across layouts and platforms.","longDescription":"Defines CODES (physical KeyboardEvent.code values) and KEYS (logical key values), with CTRL_OR_CMD resolved to metaKey or ctrlKey via isDarwin from editorInterface. KeyCodeMap provides code fallbacks so shortcuts like Z/Y/W work on non-latin layouts, used by matchKey. Also exposes modifier-based predicates for transform behavior: resizing from center, keeping aspect ratio, and snapping rotation to discrete angles.","functions":["matchKey()","isArrowKey()","isLatinChar()","shouldResizeFromCenter()","shouldMaintainAspectRatio()","shouldRotateWithDiscreteAngle()"],"children":[],"edges":[]}],"edges":[]},{"id":"mod:packages/common:general-utils","label":"General Utilities","kind":"module","path":"packages/common/src","weight":1266,"shortDescription":"Miscellaneous DOM, string, date, URL, randomness, and geometry helpers.","longDescription":"utils.ts is the large grab-bag for DOM checks such as isInputLike and isWritableElement, window lookup, string formatting, and test-controllable date handling. Smaller files cover link normalization and validation, seeded random and ID generation, point sizing, rescaling and grid snapping, and a Bounds tuple with its type guard.","children":[{"id":"file:packages/common/src/utils.ts","label":"utils","kind":"file","path":"packages/common/src/utils.ts","weight":1123,"shortDescription":"Grab-bag of DOM, string, date, font, timing, and array helpers shared across packages.","longDescription":"Provides date formatting with a test-mockable clock, string capitalization, and DOM checks for writable/interactive elements and owning windows (supporting editors rendered into other documents). Builds CSS font strings using font-family fallbacks from constants. Includes timing utilities such as debounce, requestAnimationFrame throttling and promises, easing, and array chunking. Imports types from @excalidraw/element and @excalidraw/excalidraw.","functions":["getDateTime()","getTargetWindow()","isWritableElement()","getFontString()","debounce()","throttleRAF()"],"children":[],"edges":[]},{"id":"file:packages/common/src/points.ts","label":"points","kind":"file","path":"packages/common/src/points.ts","weight":70,"shortDescription":"Computes point-set sizes, rescales points along an axis, and snaps to grid.","longDescription":"Operates on GlobalPoint/LocalPoint tuples from @excalidraw/math. getSizeFromPoints returns the width/height of a point set's extent. rescalePoints scales one dimension to a target size and can normalize so the minimum coordinate stays fixed, skipping translation for two-point lines. getGridPoint snaps coordinates to a nullable grid size.","functions":["getSizeFromPoints()","rescalePoints()","getGridPoint()"],"children":[],"edges":[]},{"id":"file:packages/common/src/random.ts","label":"random","kind":"file","path":"packages/common/src/random.ts","weight":27,"shortDescription":"Provides reseedable random integers, ID generation, and a deterministic seeded PRNG.","longDescription":"Wraps roughjs's Random for reseedable integers, with reseed() for reproducible tests. randomId uses nanoid but returns sequential ids in test environments via isTestEnv. seededRandom implements mulberry32 for stable per-seed sequences, used for renders that must match across frames and clients. It is chosen because roughjs's generator degenerates for seed 0.","functions":["randomInteger()","reseed()","randomId()","seededRandom()"],"children":[],"edges":[]},{"id":"file:packages/common/src/url.ts","label":"url","kind":"file","path":"packages/common/src/url.ts","weight":30,"shortDescription":"Sanitizes and validates user-supplied links for safe use in href and src.","longDescription":"normalizeLink trims input, escapes double quotes, and runs @braintree/sanitize-url. isLocalLink checks for same-origin or root-relative links. toValidURL turns relative paths into absolute URLs using location.origin and falls back to about:blank when the URL constructor rejects the link, so it is safe for iframe src and anchor href attributes.","functions":["normalizeLink()","isLocalLink()","toValidURL()"],"children":[],"edges":[]},{"id":"file:packages/common/src/bounds.ts","label":"bounds","kind":"file","path":"packages/common/src/bounds.ts","weight":16,"shortDescription":"Defines the Bounds tuple type and a runtime type guard for it.","longDescription":"Bounds is a readonly labeled tuple [minX, minY, maxX, maxY] for the top-left and bottom-right corners of an axis-aligned box. isBounds is a type guard that checks for a four-element numeric array. It lets callers validate unknown values before treating them as bounding boxes.","functions":["Bounds","isBounds()"],"children":[],"edges":[]}],"edges":[{"from":"file:packages/common/src/random.ts","to":"file:packages/common/src/utils.ts","weight":1},{"from":"file:packages/common/src/url.ts","to":"file:packages/common/src/utils.ts","weight":1}]},{"id":"mod:packages/common:data-structures","label":"Data Structures","kind":"module","path":"packages/common/src","weight":230,"shortDescription":"Generic heap, queue, promise pool, and versioned snapshot store.","longDescription":"Small reusable containers independent of editor state. BinaryHeap supports priority-ordered processing, Queue serializes async jobs, and PromisePool caps concurrent promise execution. VersionedSnapshotStore holds a value with a version counter so consumers can detect changes cheaply.","children":[{"id":"file:packages/common/src/binary-heap.ts","label":"binary-heap","kind":"file","path":"packages/common/src/binary-heap.ts","weight":90,"shortDescription":"Generic array-backed min-heap ordered by a caller-supplied score function.","longDescription":"Implements a binary min-heap over an internal array, ordering nodes by a scoreFunction passed to the constructor. sinkDown moves a node toward the root and bubbleUp moves it toward the leaves, using a hole-shifting approach that writes the node once at its final slot. Provides push, pop and related operations for priority-ordered processing such as pathfinding.","functions":["BinaryHeap","push()","pop()","sinkDown()","bubbleUp()"],"children":[],"edges":[]},{"id":"file:packages/common/src/versionedSnapshotStore.ts","label":"versionedSnapshotStore","kind":"file","path":"packages/common/src/versionedSnapshotStore.ts","weight":58,"shortDescription":"Observable value store with version counter, subscribers, and promise-based change pulling.","longDescription":"Holds a single value plus a monotonically increasing version, skipping updates deemed equal by a configurable isEqual (default Object.is). On change it notifies persistent subscribers and resolves one-shot waiters. pull(sinceVersion) returns the current snapshot immediately if the version differs, otherwise a promise resolving on the next change, enabling long-poll style consumers.","functions":["VersionedSnapshotStore","set()","update()","subscribe()","pull()","getSnapshot()"],"children":[],"edges":[]},{"id":"file:packages/common/src/promise-pool.ts","label":"promise-pool","kind":"file","path":"packages/common/src/promise-pool.ts","weight":43,"shortDescription":"Concurrency-limited promise runner that collects results in original call order.","longDescription":"Wraps the es6-promise-pool library, adding missing typings for its fulfilled event listeners. The source iterator yields promises resolving to [index, value] tuples; all() listens for fulfilled events, stores values keyed by index, and returns them ordered once the pool finishes. The listener is removed in a deferred setTimeout after completion.","functions":["PromisePool","all()"],"children":[],"edges":[]},{"id":"file:packages/common/src/queue.ts","label":"queue","kind":"file","path":"packages/common/src/queue.ts","weight":39,"shortDescription":"Serial async job queue running one job at a time in FIFO order.","longDescription":"Accepts job factories with arguments via push(), returning a promise for each job's result. tick() starts the next job only when none is running, invoking it through promiseTry so sync throws become rejections, and chains the next tick in finally. Relies on resolvablePromise and promiseTry utilities from the common package index.","functions":["Queue","push()","tick()"],"children":[],"edges":[]}],"edges":[]},{"id":"mod:packages/common:events","label":"Event Primitives","kind":"module","path":"packages/common/src","weight":152,"shortDescription":"Typed emitter and application event bus for decoupled communication.","longDescription":"Emitter is a minimal typed subscribe/emit primitive. AppEventBus builds on it with a payload map keyed by event name and per-event behavior settings, for example whether late subscribers receive the last emitted value. Other packages use these to communicate without direct imports.","children":[{"id":"file:packages/common/src/appEventBus.ts","label":"appEventBus","kind":"file","path":"packages/common/src/appEventBus.ts","weight":112,"shortDescription":"Typed application event bus with per-event cardinality and replay behavior.","longDescription":"Keys a lazily created Emitter per event name and enforces a behavior map declaring each event as 'once' or 'many' and whether the last payload is replayed to late subscribers. Tracks last payloads and already-emitted once-events. Overloaded on() returns a Promise for awaitable keys (once + replay last), unwrapping single-argument payloads. Uses isProdEnv to gate developer warnings.","functions":["AppEventBus","on()","emit()","AppEventBehavior","AppEventBehaviorMap","AppEventPayloadMap"],"children":[],"edges":[]},{"id":"file:packages/common/src/emitter.ts","label":"emitter","kind":"file","path":"packages/common/src/emitter.ts","weight":40,"shortDescription":"Minimal typed pub/sub emitter with on, once, off, trigger and clear.","longDescription":"Generic over a payload tuple type, storing subscribers in a public array. on() accepts single or nested handler arrays, filters non-functions, and returns an unsubscribe callback. once() appends a self-detaching handler. trigger() calls subscribers synchronously in registration order. Serves as the building block for AppEventBus and other observable state across packages.","functions":["Emitter","on()","once()","off()","trigger()","clear()"],"children":[],"edges":[]}],"edges":[{"from":"file:packages/common/src/appEventBus.ts","to":"file:packages/common/src/emitter.ts","weight":1}]},{"id":"mod:packages/common:types-entry","label":"Types & Entry","kind":"module","path":"packages/common/src","weight":77,"shortDescription":"Shared TypeScript utility types and the package's public export barrel.","longDescription":"utility-types.ts provides generic helpers such as Mutable, Merge, MarkOptional, MarkRequired, and ValueOf used throughout the monorepo. index.ts re-exports the public surface of the src modules so consumers import from a single entry point.","children":[{"id":"file:packages/common/src/index.ts","label":"index","kind":"file","path":"packages/common/src/index.ts","weight":17,"shortDescription":"Public export barrel re-exporting all @excalidraw/common submodules.","longDescription":"Aggregates the package's public API by re-exporting binary-heap, bounds, colors, constants, font metadata, queue, keys, points, promise pool, random, url, utils, emitter, app event bus, editor interface and versioned snapshot store. Also exposes the Debug helper from a sibling debug module outside src. Contains no logic of its own; utility-types is not re-exported here and is imported directly.","functions":["Debug"],"children":[],"edges":[]},{"id":"file:packages/common/src/utility-types.ts","label":"utility-types","kind":"file","path":"packages/common/src/utility-types.ts","weight":60,"shortDescription":"Generic TypeScript helper types for mutability, optionality, merging and type assertions.","longDescription":"Provides compile-time-only type utilities shared across Excalidraw packages: stripping readonly, merging object types, marking keys optional/required/non-nullable, extracting promise resolution and Set element types, and deriving callable signatures. Includes a ForwardRef helper built on React.ForwardRefRenderFunction and SameType/Assert for static type equality checks. Several helpers are adapted from ts-essentials and StackOverflow.","functions":["Mutable","Merge","MarkOptional","MarkNonNullable","ForwardRef","Assert"],"children":[],"edges":[]}],"edges":[]},{"id":"mod:packages/common:debug","label":"Debug Tooling","kind":"module","path":"packages/common","weight":192,"shortDescription":"Development-time Debug class for timing and logging diagnostics.","longDescription":"Sits outside src and is not part of the main export barrel. Provides a Debug class with static helpers for measuring and logging code-path timings during development and profiling.","children":[{"id":"file:packages/common/debug.ts","label":"debug","kind":"file","path":"packages/common/debug.ts","weight":192,"shortDescription":"Static Debug class that aggregates timing samples and logs performance stats each second.","longDescription":"Collects named timing measurements into aggregate and averaging buckets held in static records. A window.setInterval logger prints totals, sorted samples, and averages once per second, while a requestAnimationFrame loop counts frames to correlate timings with frame rate. Recording starts lazily on first use and can be toggled via DEBUG_LOG_TIMES; helpers lessPrecise() and getAvgFrameTime() round output.","functions":["Debug","setupInterval()","debugLogger()","scheduleAnimationFrame()","getAvgFrameTime()","lessPrecise()"],"children":[],"edges":[]}],"edges":[]}],"edges":[{"from":"mod:packages/common:types-entry","to":"mod:packages/common:general-utils","weight":5},{"from":"mod:packages/common:types-entry","to":"mod:packages/common:data-structures","weight":4},{"from":"mod:packages/common:types-entry","to":"mod:packages/common:constants-config","weight":4},{"from":"mod:packages/common:types-entry","to":"mod:packages/common:events","weight":2},{"from":"mod:packages/common:data-structures","to":"mod:packages/common:types-entry","weight":2},{"from":"mod:packages/common:events","to":"mod:packages/common:general-utils","weight":1},{"from":"mod:packages/common:types-entry","to":"mod:packages/common:input-keys","weight":1},{"from":"mod:packages/common:types-entry","to":"mod:packages/common:debug","weight":1},{"from":"mod:packages/common:input-keys","to":"mod:packages/common:constants-config","weight":1},{"from":"mod:packages/common:input-keys","to":"mod:packages/common:types-entry","weight":1},{"from":"mod:packages/common:general-utils","to":"mod:packages/common:constants-config","weight":1},{"from":"mod:packages/common:general-utils","to":"mod:packages/common:types-entry","weight":1}]},{"id":"pkg:packages/element","label":"Excalidraw Element Core","kind":"package","path":"packages/element","packageName":"@excalidraw/element","weight":34998,"shortDescription":"Element model, geometry, editing, rendering and history for Excalidraw scenes.","longDescription":"Defines Excalidraw element types and constructors, the Scene container and fractional z-ordering, and the Store/Delta history system. Provides geometry, hit-testing, binding and elbow-arrow routing, text layout, interactive transforms, and canvas rendering via roughjs-based shape caching. Used by the editor app and by consumers building elements programmatically.","children":[{"id":"mod:packages/element:element-model","label":"Element Model","kind":"module","path":"packages/element/src","weight":5578,"shortDescription":"Element types, type guards, creation, mutation, duplication and skeleton conversion.","longDescription":"Holds the element type definitions and type-check predicates, factory functions for new elements including sticky notes, embeddables and iframes, and mutateElement/newElementWith with version bumping. Also covers deep copying and duplication, programmatic skeleton-to-element conversion, and the package's public index helpers for scene versioning and filtering out deleted elements.","children":[{"id":"file:packages/element/src/index.ts","label":"index","kind":"file","path":"packages/element/src/index.ts","weight":101,"shortDescription":"Scene version hashing, string hashing and non-deleted/visible element filtering helpers.","longDescription":"Provides djb2-based hashElementsVersion over element versionNonces and a generic hashString for versioning. Keeps the deprecated getSceneVersion sum for compatibility. Offers filters for non-deleted elements and visible elements, the latter excluding invisibly small elements via sizeHelpers. Accepts maps or arrays through toIterable from @excalidraw/common.","functions":["hashElementsVersion()","hashString()","getSceneVersion()","isNonDeletedElement()","getVisibleElements()","getNonDeletedElements()"],"children":[],"edges":[]},{"id":"file:packages/element/src/types.ts","label":"Element Types","kind":"file","path":"packages/element/src/types.ts","weight":432,"shortDescription":"TypeScript type definitions for all Excalidraw element kinds and their shared properties.","longDescription":"Defines the readonly base element shape (geometry, styling, seed, version, versionNonce, groupIds, bindings) and every concrete element type: text, linear, arrow, elbow arrow, frame, image, embeddable, iframe, freedraw and sticky note. Uses branded types for FontString and FractionalIndex, and derives enum-like unions from @excalidraw/common constants. Also declares element map and collection types used across the package.","functions":["ExcalidrawElement","ExcalidrawTextElement","ExcalidrawLinearElement","BoundElement","FractionalIndex","FontString"],"children":[],"edges":[]},{"id":"file:packages/element/src/typeChecks.ts","label":"Type Guards","kind":"file","path":"packages/element/src/typeChecks.ts","weight":386,"shortDescription":"Runtime type guards narrowing generic elements to specific Excalidraw element types.","longDescription":"Implements null-safe predicates such as isTextElement, isLinearElement, isArrowElement, isFrameLikeElement and isImageElement that narrow TypeScript types while preserving generics. Covers composite categories like bindable, iframe-like and text containers, plus checks over tool types via ElementOrToolType. Uses pointsEqual from @excalidraw/math for shape-specific checks and assertNever for exhaustive switches.","functions":["isTextElement()","isLinearElement()","isArrowElement()","isElbowArrow()","isFrameLikeElement()","isBindableElement()"],"children":[],"edges":[]},{"id":"file:packages/element/src/mutateElement.ts","label":"mutateElement","kind":"file","path":"packages/element/src/mutateElement.ts","weight":175,"shortDescription":"In-place and immutable element updates with version bumping for collaboration.","longDescription":"mutateElement applies partial updates in place, recomputing elbow arrow routes via updateElbowArrowPoints and invalidating ShapeCache when geometry or files change. newElementWith returns an updated copy instead. Both bump version, versionNonce and updated timestamp so collaborators can reconcile changes. ElementUpdate excludes id, updated and created, which are lifetime metadata.","functions":["mutateElement()","newElementWith()","bumpVersion()","ElementUpdate"],"children":[],"edges":[]},{"id":"file:packages/element/src/stickyNote.ts","label":"Sticky Note","kind":"file","path":"packages/element/src/stickyNote.ts","weight":920,"shortDescription":"Sticky note styling, geometry, font sizing and hand-drawn path rendering helpers.","longDescription":"Normalizes sticky note stroke and background colors and keeps bound text ink in sync. Computes seeded, roughened outline points and quadratic path commands with corner radius rules. Fits bound text by stepping font size using measureText and wrapText, adjusting height and bound elements on resize. Also produces footer date labels and routes color updates to the right target element.","functions":["getStickyNotePathCommands()","getStickyNoteRenderPoints()","normalizeStickyNoteFontSize()","syncStickyNoteInk()","getColorUpdate()","getStickyNoteDateLabel()"],"children":[],"edges":[]},{"id":"file:packages/element/src/newElement.ts","label":"newElement","kind":"file","path":"packages/element/src/newElement.ts","weight":662,"shortDescription":"Factory functions creating new elements of every type with defaults applied.","longDescription":"Builds elements from ElementConstructorOpts, filling ids, seeds, versions, timestamps and default style props from @excalidraw/common. Provides specialized constructors for text, linear, arrow, freedraw, image, frame, embeddable, iframe and sticky note elements. Text creation measures and wraps content and computes anchor ratios; refreshTextDimensions recalculates size after edits. Sticky note helpers normalize style and enforce minimum geometry.","functions":["newElement()","newTextElement()","newLinearElement()","newStickyNoteElement()","refreshTextDimensions()","newFrameElement()"],"children":[],"edges":[]},{"id":"file:packages/element/src/transform.ts","label":"Skeleton Transform","kind":"file","path":"packages/element/src/transform.ts","weight":1147,"shortDescription":"Converts simplified element skeletons into fully formed, bound Excalidraw elements.","longDescription":"convertToExcalidrawElements accepts ExcalidrawElementSkeleton inputs, the public API for programmatic scene creation, and creates real elements via newElement factories. It resolves container labels, text measurement, arrow start/end bindings to existing or new shapes, frame children and sticky note geometry. Uses a temporary Scene, LinearElementEditor and binding helpers, then repairs fractional indices with syncInvalidIndices.","functions":["convertToExcalidrawElements()","ExcalidrawElementSkeleton","ValidLinearElement","ValidContainer","ValidStickyNote"],"children":[],"edges":[]},{"id":"file:packages/element/src/duplicate.ts","label":"Duplication","kind":"file","path":"packages/element/src/duplicate.ts","weight":605,"shortDescription":"Duplicates elements with new ids, preserving groups, frames, bound text and bindings.","longDescription":"duplicateElement copies a single element with fresh id, seed and version, remapping group ids. duplicateElements expands selection to include bound text, group members and frame children, then fixes arrow bindings and frame membership and normalizes ordering. OnDuplicateData exposes original-to-duplicate lookups to the host's onDuplicate callback, and reconcileDuplicatedElements merges host edits back. deepCopyElement performs structural cloning.","functions":["duplicateElement()","duplicateElements()","reconcileDuplicatedElements()","deepCopyElement()","OnDuplicateData"],"children":[],"edges":[]},{"id":"file:packages/element/src/embeddable.ts","label":"Embeddables","kind":"file","path":"packages/element/src/embeddable.ts","weight":505,"shortDescription":"Parses and validates embed URLs and builds iframe sources for embeddable elements.","longDescription":"Matches links against regexes for YouTube, Vimeo, Figma, GitHub Gist, Twitter/X, Val Town, Giphy, Microsoft Forms and generic iframe snippets, producing IframeData with sandbox settings. Results are memoized in an in-module cache. createSrcDoc builds inline HTML for script-based embeds, embeddableURLValidator applies host-provided allowlists, and placeholder labels are created with newTextElement and wrapText.","functions":["getEmbedLink()","embeddableURLValidator()","createSrcDoc()","maybeParseEmbedSrc()","createPlaceholderEmbeddableLabel()"],"children":[],"edges":[]},{"id":"file:packages/element/src/comparisons.ts","label":"Capability Checks","kind":"file","path":"packages/element/src/comparisons.ts","weight":58,"shortDescription":"Predicates telling which style properties each element or tool type supports.","longDescription":"Simple type-string predicates over ElementOrToolType deciding whether background, fill style, stroke color, width, style, roughness, roundness or arrowheads apply. Used by the UI to show or hide property controls. Sticky notes get background and roughness but not fill style, and the tool-only bucketfill type counts as having a background.","functions":["hasBackground()","hasStrokeColor()","hasStrokeStyle()","canChangeRoundness()","canHaveArrowheads()","toolIsArrow()"],"children":[],"edges":[]},{"id":"file:packages/element/src/listMarker.ts","label":"List Markers","kind":"file","path":"packages/element/src/listMarker.ts","weight":329,"shortDescription":"Increments list markers in duplicated text elements, like 1., a), or iv.","longDescription":"Detects decimal, alphabetic and roman list markers in text with regexes, including lone numbers used as step badges, and caps ordinals to avoid matching years. advanceDuplicatedListMarkers computes the next marker for duplicated texts, and applyListMarkerAdvances writes the new text, then refreshes dimensions or redraws the container's bounding box through textElement helpers.","functions":["advanceDuplicatedListMarkers()","applyListMarkerAdvances()","ListMarkerAdvance"],"children":[],"edges":[]},{"id":"file:packages/element/src/image.ts","label":"Image Helpers","kind":"file","path":"packages/element/src/image.ts","weight":143,"shortDescription":"Loads image files into HTML images and maintains the image cache.","longDescription":"loadHTMLImageElement wraps image loading in a promise, creating images through the render environment so cross-document scenes keep ownership. updateImageCache loads BinaryFiles by fileId into the app's imageCache and reports updated and errored files. Also filters initialized image elements and validates and normalizes SVG data with SVG_NS.","functions":["loadHTMLImageElement()","updateImageCache()","getInitializedImageElements()","normalizeSVG()","isHTMLSVGElement()"],"children":[],"edges":[]},{"id":"more:packages/element:element-model","label":"+2 more files","kind":"file","path":"packages/element/src","weight":23,"shortDescription":"2 smaller files in this module.","longDescription":"elementLink.ts, arrowheads.ts","functions":[],"children":[],"edges":[]}],"edges":[{"from":"more:packages/element:element-model","to":"file:packages/element/src/types.ts","weight":2},{"from":"file:packages/element/src/index.ts","to":"more:packages/element:element-model","weight":2},{"from":"file:packages/element/src/duplicate.ts","to":"file:packages/element/src/mutateElement.ts","weight":1},{"from":"file:packages/element/src/duplicate.ts","to":"file:packages/element/src/typeChecks.ts","weight":1},{"from":"file:packages/element/src/duplicate.ts","to":"file:packages/element/src/index.ts","weight":1},{"from":"file:packages/element/src/duplicate.ts","to":"file:packages/element/src/types.ts","weight":1},{"from":"file:packages/element/src/embeddable.ts","to":"file:packages/element/src/newElement.ts","weight":1},{"from":"file:packages/element/src/embeddable.ts","to":"file:packages/element/src/typeChecks.ts","weight":1},{"from":"file:packages/element/src/embeddable.ts","to":"file:packages/element/src/types.ts","weight":1},{"from":"file:packages/element/src/image.ts","to":"file:packages/element/src/typeChecks.ts","weight":1},{"from":"file:packages/element/src/image.ts","to":"file:packages/element/src/types.ts","weight":1},{"from":"file:packages/element/src/index.ts","to":"file:packages/element/src/types.ts","weight":1},{"from":"file:packages/element/src/index.ts","to":"file:packages/element/src/comparisons.ts","weight":1},{"from":"file:packages/element/src/index.ts","to":"file:packages/element/src/duplicate.ts","weight":1},{"from":"file:packages/element/src/index.ts","to":"file:packages/element/src/embeddable.ts","weight":1},{"from":"file:packages/element/src/index.ts","to":"file:packages/element/src/image.ts","weight":1},{"from":"file:packages/element/src/index.ts","to":"file:packages/element/src/listMarker.ts","weight":1},{"from":"file:packages/element/src/index.ts","to":"file:packages/element/src/mutateElement.ts","weight":1},{"from":"file:packages/element/src/index.ts","to":"file:packages/element/src/newElement.ts","weight":1},{"from":"file:packages/element/src/index.ts","to":"file:packages/element/src/stickyNote.ts","weight":1},{"from":"file:packages/element/src/index.ts","to":"file:packages/element/src/transform.ts","weight":1},{"from":"file:packages/element/src/index.ts","to":"file:packages/element/src/typeChecks.ts","weight":1},{"from":"file:packages/element/src/listMarker.ts","to":"file:packages/element/src/newElement.ts","weight":1},{"from":"file:packages/element/src/listMarker.ts","to":"file:packages/element/src/typeChecks.ts","weight":1},{"from":"file:packages/element/src/listMarker.ts","to":"file:packages/element/src/types.ts","weight":1},{"from":"file:packages/element/src/mutateElement.ts","to":"file:packages/element/src/typeChecks.ts","weight":1},{"from":"file:packages/element/src/mutateElement.ts","to":"file:packages/element/src/types.ts","weight":1},{"from":"file:packages/element/src/newElement.ts","to":"file:packages/element/src/mutateElement.ts","weight":1},{"from":"file:packages/element/src/newElement.ts","to":"file:packages/element/src/stickyNote.ts","weight":1},{"from":"file:packages/element/src/newElement.ts","to":"file:packages/element/src/typeChecks.ts","weight":1},{"from":"file:packages/element/src/newElement.ts","to":"file:packages/element/src/types.ts","weight":1},{"from":"file:packages/element/src/stickyNote.ts","to":"file:packages/element/src/mutateElement.ts","weight":1},{"from":"file:packages/element/src/stickyNote.ts","to":"file:packages/element/src/typeChecks.ts","weight":1},{"from":"file:packages/element/src/stickyNote.ts","to":"file:packages/element/src/types.ts","weight":1},{"from":"file:packages/element/src/transform.ts","to":"file:packages/element/src/newElement.ts","weight":1},{"from":"file:packages/element/src/transform.ts","to":"file:packages/element/src/stickyNote.ts","weight":1},{"from":"file:packages/element/src/transform.ts","to":"file:packages/element/src/typeChecks.ts","weight":1},{"from":"file:packages/element/src/transform.ts","to":"file:packages/element/src/types.ts","weight":1},{"from":"file:packages/element/src/typeChecks.ts","to":"file:packages/element/src/types.ts","weight":1}]},{"id":"mod:packages/element:scene-history","label":"Scene And History","kind":"module","path":"packages/element/src","weight":5868,"shortDescription":"Scene container, ordering, grouping, selection and undoable change tracking.","longDescription":"Scene owns the element collection and its maps. Fractional indices keep z-order stable for collaboration, and zindex/sortElements reorder elements. Groups, frames and selection helpers decide membership and what is selected. Store captures snapshots into durable and ephemeral increments, and Delta/ElementsDelta/AppStateDelta compute and apply reversible diffs for undo/redo and sync.","children":[{"id":"file:packages/element/src/frame.ts","label":"frame","kind":"file","path":"packages/element/src/frame.ts","weight":993,"shortDescription":"Frame membership, containment, and intersection logic for frame-like elements.","longDescription":"Computes which elements lie inside, intersect, or fall outside frames using bounds and line-segment intersection tests. Handles binding elements to frames after duplication, grouping elements by frame, and finding frame children and root elements. Collaborates with selection, groups, bounds, and fractionalIndex to keep frame children ordered and selection rules consistent.","functions":["bindElementsToFramesAfterDuplication()","isElementIntersectingFrame()","getElementsInResizingFrame()","getFrameChildren()","groupByFrameLikes()","getRootElements()"],"children":[],"edges":[]},{"id":"file:packages/element/src/Scene.ts","label":"Scene","kind":"file","path":"packages/element/src/Scene.ts","weight":383,"shortDescription":"Container holding scene elements, maps, and change callbacks.","longDescription":"Scene class stores ordered elements including deleted ones, plus cached non-deleted arrays and maps, frame lists, and memoized selected-element lookups keyed by a selection hash. Replacing elements syncs invalid fractional indices and validates them on a throttle in dev and test. Subscribers get notified via callbacks on updates, and m
