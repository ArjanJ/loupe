t":115,"shortDescription":"Reusable panel layout with label, content and action buttons for TTD dialog.","longDescription":"React component that renders a labeled panel with child content and a row of actions. Each action is drawn as a link, a button or a rate-limit display, and actions are disabled while a submission is in progress. Optional render props supply top-right content and a submit-shortcut hint. Uses the shared Button and Spinner components and clsx for class composition.","functions":["TTDDialogPanel()","TTDPanelAction"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/components/TTDDialog/TTDContext.tsx","label":"TTD atoms","kind":"file","path":"packages/excalidraw/components/TTDDialog/TTDContext.tsx","weight":11,"shortDescription":"Jotai atoms holding TTD dialog rate limits, preview, error and chat state.","longDescription":"Declares editor-scoped jotai atoms for shared dialog state: current rate limits, preview visibility, the last error and chat history. Chat history is initialized with a random id, no messages and an empty prompt. Using atoms lets the dialog's subcomponents share this state without prop drilling.","functions":["rateLimitsAtom","showPreviewAtom","errorAtom","chatHistoryAtom"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/components/TTDDialog/utils/chat.ts","label":"chat utils","kind":"file","path":"packages/excalidraw/components/TTDDialog/utils/chat.ts","weight":74,"shortDescription":"Immutable helpers for updating TTD chat history and building LLM messages.","longDescription":"Pure functions that return new ChatHistory objects. They append messages with generated ids and timestamps, patch or remove the last assistant message, and fetch the last assistant message. getMessagesForLLM converts chat history into the role/content array sent to the backend. Relies on findLastIndex and randomId from @excalidraw/common.","functions":["addMessages()","updateAssistantContent()","getLastAssistantMessage()","removeLastAssistantMessage()","getMessagesForLLM()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/components/TTDDialog/common.ts","label":"TTD common","kind":"file","path":"packages/excalidraw/components/TTDDialog/common.ts","weight":150,"shortDescription":"Mermaid conversion, preview rendering, storage and canvas insertion for TTD.","longDescription":"convertMermaidToExcalidraw runs the mermaid-to-excalidraw library, converts its output with convertToExcalidrawElements, and renders an SVG preview into the canvas ref using exportScene. The converted elements and files are stored in a mutable ref. Other helpers clear the preview, persist the Mermaid definition to EditorLocalStorage, and insert the generated elements into the editor through the App instance.","functions":["convertMermaidToExcalidraw()","resetPreview()","saveMermaidDataToStorage()","insertToEditor()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/components/TTDDialog/utils/TTDStreamFetch.ts","label":"TTD stream fetch","kind":"file","path":"packages/excalidraw/components/TTDDialog/utils/TTDStreamFetch.ts","weight":196,"shortDescription":"Streams LLM responses over SSE from the text-to-diagram backend.","longDescription":"Posts chat messages to the backend URL and reads the response body through an SSE line parser built as an async generator. Content deltas are forwarded through onChunk, and rate limits are optionally read from the X-Ratelimit headers. Supports AbortSignal cancellation and reports failures as RequestError. StreamChunk types the content, done and error events.","functions":["TTDStreamFetch()","parseSSEStream()","StreamChunk"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/charts/index.ts","label":"charts entry","kind":"file","path":"packages/excalidraw/charts/index.ts","weight":35,"shortDescription":"Public entry that renders a spreadsheet as a bar, line or radar chart.","longDescription":"renderSpreadsheet dispatches on the chart type to renderLineChart, renderRadarChart or renderBarChart, with bar as the default. It passes through the position, color seed and render environment. The file also re-exports the spreadsheet parsers, the chart types and isSpreadsheetValidForChartType, forming the module's public API for spreadsheet-to-chart generation.","functions":["renderSpreadsheet()","tryParseSpreadsheet()","tryParseCells()","tryParseNumber()","isSpreadsheetValidForChartType()"],"children":[],"edges":[]},{"id":"more:packages/excalidraw:diagram-generation","label":"+35 more files","kind":"file","path":"packages/excalidraw/components/TTDDialog","weight":813,"shortDescription":"35 smaller files in this module.","longDescription":"CodeMirrorEditor.tsx, TTDDialog.tsx, ChatMessage.tsx, useTTDChatStorage.ts, MermaidToExcalidraw.tsx, ChatInterface.tsx, TextToDiagram.tsx, useTextGeneration.ts, PasteChartDialog.tsx, TTDDialogOutput.tsx, charts.radar.ts, useMermaidRenderer.ts, charts.parse.ts, types.ts, TTDChatPanel.tsx, charts.line.ts, TTDDialogInput.tsx, charts.bar.ts, mermaid.ts, useChatManagement.ts, ChatHistoryMenu.tsx, useChatAgent.ts, mermaid-lang-lite.ts, TTDPreviewPanel.tsx, TTDDialogTabs.tsx, TTDWelcomeMessage.tsx, mermaidValidation.ts, TTDDialogTrigger.tsx, TTDDialogTabTrigger.tsx, index.ts, TTDDialogTab.tsx, DiagramToCodePlugin.tsx, TTDDialogSubmitShortcut.tsx, TTDDialogTabTriggers.tsx, TTDDialogPanels.tsx","functions":[],"children":[],"edges":[]}],"edges":[{"from":"more:packages/excalidraw:diagram-generation","to":"file:packages/excalidraw/components/TTDDialog/types.ts","weight":13},{"from":"more:packages/excalidraw:diagram-generation","to":"file:packages/excalidraw/components/TTDDialog/TTDContext.tsx","weight":7},{"from":"more:packages/excalidraw:diagram-generation","to":"file:packages/excalidraw/components/TTDDialog/utils/chat.ts","weight":5},{"from":"more:packages/excalidraw:diagram-generation","to":"file:packages/excalidraw/charts/charts.types.ts","weight":4},{"from":"file:packages/excalidraw/charts/index.ts","to":"more:packages/excalidraw:diagram-generation","weight":4},{"from":"more:packages/excalidraw:diagram-generation","to":"file:packages/excalidraw/components/TTDDialog/utils/mermaidError.ts","weight":4},{"from":"more:packages/excalidraw:diagram-generation","to":"file:packages/excalidraw/charts/charts.constants.ts","weight":3},{"from":"more:packages/excalidraw:diagram-generation","to":"file:packages/excalidraw/charts/charts.helpers.ts","weight":3},{"from":"more:packages/excalidraw:diagram-generation","to":"file:packages/excalidraw/components/TTDDialog/TTDDialogPanel.tsx","weight":3},{"from":"more:packages/excalidraw:diagram-generation","to":"file:packages/excalidraw/components/TTDDialog/common.ts","weight":3},{"from":"file:packages/excalidraw/charts/charts.helpers.ts","to":"file:packages/excalidraw/charts/charts.constants.ts","weight":1},{"from":"file:packages/excalidraw/charts/charts.helpers.ts","to":"file:packages/excalidraw/charts/charts.types.ts","weight":1},{"from":"file:packages/excalidraw/charts/index.ts","to":"file:packages/excalidraw/charts/charts.types.ts","weight":1},{"from":"file:packages/excalidraw/charts/index.ts","to":"file:packages/excalidraw/charts/charts.helpers.ts","weight":1},{"from":"more:packages/excalidraw:diagram-generation","to":"file:packages/excalidraw/charts/index.ts","weight":1},{"from":"more:packages/excalidraw:diagram-generation","to":"file:packages/excalidraw/components/TTDDialog/utils/mermaidAutoFix.ts","weight":1},{"from":"file:packages/excalidraw/components/TTDDialog/TTDContext.tsx","to":"file:packages/excalidraw/components/TTDDialog/types.ts","weight":1},{"from":"file:packages/excalidraw/components/TTDDialog/common.ts","to":"file:packages/excalidraw/components/TTDDialog/types.ts","weight":1},{"from":"file:packages/excalidraw/components/TTDDialog/utils/TTDStreamFetch.ts","to":"file:packages/excalidraw/components/TTDDialog/types.ts","weight":1},{"from":"file:packages/excalidraw/components/TTDDialog/utils/chat.ts","to":"file:packages/excalidraw/components/TTDDialog/types.ts","weight":1},{"from":"file:packages/excalidraw/components/TTDDialog/utils/mermaidAutoFix.ts","to":"file:packages/excalidraw/components/TTDDialog/utils/mermaidError.ts","weight":1}]},{"id":"mod:packages/excalidraw:rendering","label":"Rendering","kind":"module","path":"packages/excalidraw","weight":6835,"shortDescription":"Draws scenes to static, interactive and new-element canvases, and to SVG and image exports.","longDescription":"Three layered React canvases (static, interactive and new-element) call throttled scene renderers. The interactive renderer draws selection, handles, snaps and remote cursors. The Renderer class memoizes the visible elements. scene/export produces PNG/SVG output with embedded scene payloads and clipboard export. Also covers scrollbars, zoom normalization, an animation controller and per-element render overrides.","children":[{"id":"file:packages/excalidraw/scene/index.ts","label":"scene index","kind":"file","path":"packages/excalidraw/scene/index.ts","weight":22,"shortDescription":"Barrel re-exporting selection, element-capability, scroll and normalization helpers for scenes.","longDescription":"Aggregates scene-level helpers into one import point. Re-exports selection queries and element style capability checks (hasBackground, canHaveArrowheads, etc.) from @excalidraw/element, getScrollToContentState from the viewport module, and zoom/grid normalizers from ./normalize. Contains no logic of its own.","functions":["getSelectedElements()","getElementsWithinSelection()","getScrollToContentState()","getNormalizedZoom()","getNormalizedGridSize()","hasBackground()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/scene/export.ts","label":"export","kind":"file","path":"packages/excalidraw/scene/export.ts","weight":1253,"shortDescription":"Exports scenes to canvas, SVG, PNG and clipboard with optional embedded scene data.","longDescription":"Builds export configuration from app state, computes bounds and padding, handles frame clipping and frame titles, and renders via renderStaticScene or renderSceneToSvg using roughjs. Loads fonts and image caches, applies dark-mode filters, and embeds serialized scene JSON into SVG (base64) or PNG metadata. Also drives clipboard copying of PNG, SVG and JSON.","functions":["exportScene()","exportToClipboard()","getExportConfigFromAppState()","encodeSvgBase64Payload()","decodeSvgBase64Payload()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/scene/types.ts","label":"scene types","kind":"file","path":"packages/excalidraw/scene/types.ts","weight":185,"shortDescription":"Type definitions for render configs, renderable maps, scrollbars and element shapes.","longDescription":"Declares the contracts shared by all renderers: the branded RenderableElementsMap, static/interactive/new-element/SVG render configs, animation state for interactive rendering, scroll and scrollbar shapes, and export types. StaticCanvasRenderConfig documents that scale must match the canvas backing-store ratio and accepts an optional RenderEnvironment for per-window canvas creation.","functions":["RenderableElementsMap","StaticCanvasRenderConfig","InteractiveSceneRenderConfig","SVGRenderConfig","NewElementSceneRenderConfig","ScrollBars"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/renderer/interactiveScene.ts","label":"interactive scene","kind":"file","path":"packages/excalidraw/renderer/interactiveScene.ts","weight":1955,"shortDescription":"Draws selection, transform handles, binding hints and collaborator overlays on the interactive canvas.","longDescription":"Renders the editor's interaction layer above the static scene: selection outlines and group boxes, transform and rotation handles, linear-element editing points and midpoints, arrow binding highlights and focus points, frame highlights, snapping guides, remote cursors and scrollbars. Draws on geometry helpers from @excalidraw/element and @excalidraw/math, and returns state used to drive ongoing animations.","functions":["renderInteractiveScene()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/renderer/staticScene.ts","label":"static scene","kind":"file","path":"packages/excalidraw/renderer/staticScene.ts","weight":604,"shortDescription":"Renders scene elements, frames, grid and links onto the static canvas.","longDescription":"Bootstraps the canvas, snaps scroll to device pixels, draws the grid, then renders each visible element with frame clipping, embeddable placeholders, bound text and link icons. Per-element errors are logged instead of aborting the render so one bad element doesn't blank the canvas or fail exports. A RAF-throttled variant serves the editor, with explicit cancellation.","functions":["renderStaticScene()","renderStaticSceneThrottled()","cancelStaticSceneThrottle()","frameClip()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/renderer/helpers.ts","label":"render helpers","kind":"file","path":"packages/excalidraw/renderer/helpers.ts","weight":144,"shortDescription":"Shared canvas helpers for setup, scroll snapping, selection color and shapes.","longDescription":"Provides low-level utilities used by the canvas renderers: bootstrapping a canvas with scale, background and theme, normalizing canvas dimensions, and rounding scroll to whole device pixels so cached element bitmaps don't shimmer during panning. Also reads the themable --color-selection CSS variable and offers circle and rotated-rect drawing primitives.","functions":["bootstrapCanvas()","snapScrollToDevicePixels()","getNormalizedCanvasDimensions()","getSelectionColor()","fillCircle()","strokeRectWithRotation_simple()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/renderer/staticSvgScene.ts","label":"SVG scene","kind":"file","path":"packages/excalidraw/renderer/staticSvgScene.ts","weight":861,"shortDescription":"Converts scene elements into SVG nodes for SVG export.","longDescription":"Walks elements and emits SVG for shapes via roughjs with precision-limited paths, text with font, RTL and line-height handling, images with crop, embeds and iframes, frames with clip paths, sticky notes with shadows, and hyperlinks. Reuses ShapeCache drawables and applies dark-theme filters when needed. Called by scene/export for SVG output.","functions":["renderSceneToSvg()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/clients.ts","label":"clients","kind":"file","path":"packages/excalidraw/clients.ts","weight":227,"shortDescription":"Colors, initials and canvas rendering of remote collaborators' cursors.","longDescription":"Derives stable per-collaborator hues by hashing the collaborator or socket id into 37 evenly spaced values, and extracts a capitalized name initial that handles surrogate pairs. renderRemoteCursors paints remote pointers, name labels, idle/away states and voice-call indicators onto the interactive canvas, clamped to the viewport edges, using roundRect.","functions":["getClientColor()","getNameInitial()","renderRemoteCursors()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/scene/scrollbars.ts","label":"scrollbars","kind":"file","path":"packages/excalidraw/scene/scrollbars.ts","weight":136,"shortDescription":"Computes viewport scrollbar geometry and tests pointer hits against them.","longDescription":"Calculates horizontal and vertical scrollbar rectangles from the combined bounds of elements and the zoomed viewport, accounting for device safe-area insets read from CSS variables and RTL layouts. isOverScrollBars hit-tests a pointer position against those rectangles. Exports scrollbar sizing and color constants used by the interactive renderer.","functions":["getScrollBars()","isOverScrollBars()","SCROLLBAR_WIDTH","SCROLLBAR_MARGIN","SCROLLBAR_COLOR"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/renderer/animation.ts","label":"animation","kind":"file","path":"packages/excalidraw/renderer/animation.ts","weight":194,"shortDescription":"Keyed animation loop controller scheduling frames per window or scheduler.","longDescription":"AnimationController keeps static registries of named animations and per-scheduler scheduled frames, ticking each animation with deltaTime and its previous state until it returns null. String keys are global and symbol keys per instance, so multiple editors can run the same animation independently. Falls back between requestAnimationFrame and timeouts depending on render throttling, and cleans up when idle or on errors.","functions":["AnimationController","AnimationController.start()","Animation","AnimationScheduler","AnimationKey"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/scene/Renderer.ts","label":"Renderer","kind":"file","path":"packages/excalidraw/scene/Renderer.ts","weight":385,"shortDescription":"Selects and memoizes the renderable, viewport-visible elements of a scene.","longDescription":"Wraps a Scene and computes, with memoization, the visible elements and RenderableElementsMap for the current viewport, excluding text being edited and the in-progress new element, and ordering frame children appropriately while dragging. Adjusts visibility for render-override offsets, memoized by offsets identity. Its destroy path cancels the throttled static render.","functions":["Renderer","getRenderableElements()","getVisibleElementsWithRenderOffsets()","destroy()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/components/canvases/InteractiveCanvas.tsx","label":"InteractiveCanvas","kind":"file","path":"packages/excalidraw/components/canvases/InteractiveCanvas.tsx","weight":297,"shortDescription":"React component hosting the interactive canvas and triggering its render.","longDescription":"Renders the top canvas that receives pointer, touch and context-menu events, and on updates assembles an InteractiveCanvasRenderConfig (remote pointers, selections, usernames, selection color) before calling renderInteractiveScene. Runs ongoing renders through AnimationController so selection and binding animations keep ticking. A custom props comparator limits re-renders to relevant appState and element changes.","functions":["InteractiveCanvas","renderInteractiveScene()","getSelectionColor()","AnimationController.start()"],"children":[],"edges":[]},{"id":"more:packages/excalidraw:rendering","label":"+8 more files","kind":"file","path":"packages/excalidraw/renderer","weight":114,"shortDescription":"8 smaller files in this module.","longDescription":"renderSnaps.ts, StaticCanvas.tsx, renderNewElementScene.ts, roundRect.ts, renderOverrides.ts, NewElementCanvas.tsx, normalize.ts, index.tsx","functions":[],"children":[],"edges":[]}],"edges":[{"from":"more:packages/excalidraw:rendering","to":"file:packages/excalidraw/scene/types.ts","weight":3},{"from":"more:packages/excalidraw:rendering","to":"file:packages/excalidraw/renderer/staticScene.ts","weight":2},{"from":"file:packages/excalidraw/renderer/interactiveScene.ts","to":"more:packages/excalidraw:rendering","weight":2},{"from":"file:packages/excalidraw/clients.ts","to":"more:packages/excalidraw:rendering","weight":1},{"from":"file:packages/excalidraw/clients.ts","to":"file:packages/excalidraw/scene/types.ts","weight":1},{"from":"file:packages/excalidraw/components/canvases/InteractiveCanvas.tsx","to":"file:packages/excalidraw/scene/types.ts","weight":1},{"from":"file:packages/excalidraw/components/canvases/InteractiveCanvas.tsx","to":"file:packages/excalidraw/renderer/helpers.ts","weight":1},{"from":"file:packages/excalidraw/components/canvases/InteractiveCanvas.tsx","to":"file:packages/excalidraw/renderer/interactiveScene.ts","weight":1},{"from":"file:packages/excalidraw/components/canvases/InteractiveCanvas.tsx","to":"file:packages/excalidraw/renderer/animation.ts","weight":1},{"from":"more:packages/excalidraw:rendering","to":"file:packages/excalidraw/components/canvases/InteractiveCanvas.tsx","weight":1},{"from":"file:packages/excalidraw/renderer/helpers.ts","to":"file:packages/excalidraw/scene/types.ts","weight":1},{"from":"file:packages/excalidraw/renderer/interactiveScene.ts","to":"file:packages/excalidraw/scene/scrollbars.ts","weight":1},{"from":"file:packages/excalidraw/renderer/interactiveScene.ts","to":"file:packages/excalidraw/clients.ts","weight":1},{"from":"file:packages/excalidraw/renderer/interactiveScene.ts","to":"file:packages/excalidraw/renderer/helpers.ts","weight":1},{"from":"file:packages/excalidraw/renderer/interactiveScene.ts","to":"file:packages/excalidraw/scene/types.ts","weight":1},{"from":"more:packages/excalidraw:rendering","to":"file:packages/excalidraw/renderer/helpers.ts","weight":1},{"from":"file:packages/excalidraw/renderer/staticScene.ts","to":"file:packages/excalidraw/renderer/helpers.ts","weight":1},{"from":"file:packages/excalidraw/renderer/staticScene.ts","to":"file:packages/excalidraw/scene/types.ts","weight":1},{"from":"file:packages/excalidraw/renderer/staticSvgScene.ts","to":"file:packages/excalidraw/scene/types.ts","weight":1},{"from":"file:packages/excalidraw/scene/Renderer.ts","to":"file:packages/excalidraw/renderer/staticScene.ts","weight":1},{"from":"file:packages/excalidraw/scene/Renderer.ts","to":"file:packages/excalidraw/scene/types.ts","weight":1},{"from":"file:packages/excalidraw/scene/export.ts","to":"file:packages/excalidraw/renderer/staticScene.ts","weight":1},{"from":"file:packages/excalidraw/scene/export.ts","to":"file:packages/excalidraw/renderer/staticSvgScene.ts","weight":1},{"from":"file:packages/excalidraw/scene/export.ts","to":"file:packages/excalidraw/scene/types.ts","weight":1},{"from":"file:packages/excalidraw/scene/index.ts","to":"more:packages/excalidraw:rendering","weight":1},{"from":"file:packages/excalidraw/scene/scrollbars.ts","to":"file:packages/excalidraw/scene/types.ts","weight":1}]},{"id":"mod:packages/excalidraw:interaction-tools","label":"Interaction Tools","kind":"module","path":"packages/excalidraw","weight":4411,"shortDescription":"Pointer tool helpers: trails, lasso, eraser, snapping, viewport math and in-place text editing.","longDescription":"AnimatedTrail is the shared base for laser, eraser, lasso and draw-shape trails. The lasso and eraser derive hit elements from the trail path. snapping.ts computes point and gap snaps used during drag and resize. viewport.ts handles zoom-to-fit and scroll constraints. textWysiwyg mounts a positioned textarea over the canvas for text editing, with helpers for auto-resize handles and gesture math.","children":[{"id":"file:packages/excalidraw/snapping.ts","label":"snapping","kind":"file","path":"packages/excalidraw/snapping.ts","weight":1230,"shortDescription":"Computes point and gap snapping for dragged, resized and drawn elements.","longDescription":"Finds point snaps and equal-gap snaps between selected elements and visible, non-selected elements. It also produces the snap lines that the renderer draws. Snap distance scales with zoom. SnapCache stores reference points and visible gaps so they are not recomputed during a drag. Bounds and grouping helpers come from @excalidraw/element, and range math comes from @excalidraw/math.","functions":["getSnapDistance()","SnapCache","isSnappingEnabled()","isGridModeEnabled()","areRoughlyEqual()","SnapLine"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/viewport.ts","label":"viewport","kind":"file","path":"packages/excalidraw/viewport.ts","weight":458,"shortDescription":"Stateless viewport math for zooming, scrolling, fitting bounds and scroll constraints.","longDescription":"Holds viewport utilities shared across the codebase, separate from the instance-specific App.viewport.ts. It clamps scroll state to scroll constraints with rubberband overscroll and computes zoom-to-fit for bounds or elements. It also centers the view on targets and scrolls bounds into view. Zoom is normalized via scene helpers and coordinates are converted with @excalidraw/common.","functions":["constrainScrollState()","zoomToFitBounds()","centerScrollOn()","scrollBoundsIntoView()","getScrollToContentState()","getViewportForZoomWithScrollConstraints()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/wysiwyg/textWysiwyg.tsx","label":"textWysiwyg","kind":"file","path":"packages/excalidraw/wysiwyg/textWysiwyg.tsx","weight":1427,"shortDescription":"In-place textarea editor overlaid on canvas for editing text elements.","longDescription":"Creates and positions a DOM textarea that matches a text element's font, rotation, zoom and container bounds. It syncs edits back to the scene, wraps bound text, and resizes containers through @excalidraw/element helpers. It also handles keyboard shortcuts, paste parsing, RTL text and caret-follow scrolling, then cleans up on submit or blur.","functions":["textWysiwyg()","CARET_FOLLOW_PADDING"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/animatedTrail.ts","label":"animatedTrail","kind":"file","path":"packages/excalidraw/animatedTrail.ts","weight":184,"shortDescription":"Base SVG trail renderer built on LaserPointer strokes with fade animation.","longDescription":"Defines the Trail interface and the AnimatedTrail class. AnimatedTrail turns pointer paths into LaserPointer strokes and renders them as SVG path elements, updated through AnimationController. It keeps the current and past trails, converts scene coordinates to viewport coordinates, and can animate a dashed stroke offset. Laser, eraser, lasso and shape-draw trails all build on it.","functions":["AnimatedTrail","Trail","AnimatedTrailOptions"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/lasso/utils.ts","label":"lasso utils","kind":"file","path":"packages/excalidraw/lasso/utils.ts","weight":354,"shortDescription":"Geometry for deciding which elements a lasso path selects.","longDescription":"Optionally simplifies the lasso path, then filters out locked and bound-text elements. It tests each element for enclosure with a non-zero polygon point test and for intersection against cached line segments. The result depends on the contain or overlap box selection mode. Frame clipping and bound text positions are taken into account through @excalidraw/element helpers.","functions":["getLassoSelectedElementIds()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/eraser/index.ts","label":"eraser","kind":"file","path":"packages/excalidraw/eraser/index.ts","weight":255,"shortDescription":"Eraser trail that detects and marks elements crossed by the pointer.","longDescription":"EraserTrail extends AnimatedTrail with a fast-decaying stroke. On each point it checks segment distance and intersection against nearby elements, including freedraw outlines, linear elements and point-inside tests for filled shapes. It tracks the elements and groups to erase, and expands the set to bound text and group members.","functions":["EraserTrail"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/lasso/index.ts","label":"lasso","kind":"file","path":"packages/excalidraw/lasso/index.ts","weight":174,"shortDescription":"Lasso selection trail that updates element selection while drawing.","longDescription":"LassoTrail extends AnimatedTrail with an animated dashed stroke in the selection color. It caches element line segments and the canvas translation, and calls getLassoSelectedElementIds as the path grows. It applies the result to app state with group selection via selectGroupsForSelectedElements. It handles frame children and linear element editing, and can keep the previous selection.","functions":["LassoTrail"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/textAutoResizeHandle.ts","label":"textAutoResizeHandle","kind":"file","path":"packages/excalidraw/textAutoResizeHandle.ts","weight":77,"shortDescription":"Geometry and hit-testing for the text element auto-resize handle.","longDescription":"Computes a small rotated vertical handle placed beside a text element. The handle is shown only on desktop and when the element is tall enough at the current zoom. Padding and gap scale inversely with zoom. A rotated hitbox test tells whether a pointer hits the handle.","functions":["getTextAutoResizeHandle()","isPointHittingTextAutoResizeHandle()","getTextBoxPadding()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/components/positionElementBesideCursor.ts","label":"positionElementBesideCursor","kind":"file","path":"packages/excalidraw/components/positionElementBesideCursor.ts","weight":62,"shortDescription":"Places a floating element beside the cursor, flipping sides to avoid overflow.","longDescription":"Converts client cursor coordinates into container-local coordinates. Each axis is resolved independently: the element goes after the cursor plus a gap, or flips to the other side if it would overflow. The result is clamped so as much of the element as possible stays inside the container.","functions":["positionElementBesideCursor()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/laserTrails.ts","label":"laserTrails","kind":"file","path":"packages/excalidraw/laserTrails.ts","weight":112,"shortDescription":"Manages local and collaborator laser pointer trails.","longDescription":"LaserTrails implements Trail and owns a local AnimatedTrail in the default laser color. It also keeps a map of trails for collaborators, keyed by socket id and colored with getClientColor. Trails fade by time and length decay. Collaborator trails are synced from app state and are started or stopped along with the SVG container.","functions":["LaserTrails"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/drawShapeTrail.ts","label":"drawShapeTrail","kind":"file","path":"packages/excalidraw/drawShapeTrail.ts","weight":66,"shortDescription":"Translucent preview trail shown while sketching shapes freehand.","longDescription":"DrawShapeTrail wraps an AnimatedTrail with a theme-aware translucent fill. Stroke size is derived from the current stroke width and zoom. It exposes the raw recorded points through getCurrentPoints so callers can recognize or build shapes from the sketched path.","functions":["DrawShapeTrail"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/gesture.ts","label":"gesture","kind":"file","path":"packages/excalidraw/gesture.ts","weight":12,"shortDescription":"Multi-touch helpers computing pointer centroid and two-finger distance.","longDescription":"Small pure helpers for pinch and pan gestures. getCenter averages all active pointer coordinates. getDistance returns the distance between two pointers, which is used to derive zoom changes.","functions":["getCenter()","getDistance()"],"children":[],"edges":[]}],"edges":[{"from":"file:packages/excalidraw/drawShapeTrail.ts","to":"file:packages/excalidraw/animatedTrail.ts","weight":1},{"from":"file:packages/excalidraw/eraser/index.ts","to":"file:packages/excalidraw/animatedTrail.ts","weight":1},{"from":"file:packages/excalidraw/laserTrails.ts","to":"file:packages/excalidraw/animatedTrail.ts","weight":1},{"from":"file:packages/excalidraw/lasso/index.ts","to":"file:packages/excalidraw/animatedTrail.ts","weight":1},{"from":"file:packages/excalidraw/lasso/index.ts","to":"file:packages/excalidraw/lasso/utils.ts","weight":1}]},{"id":"mod:packages/excalidraw:data-io","label":"Data & Persistence","kind":"module","path":"packages/excalidraw","weight":4449,"shortDescription":"Scene serialization, restore and migration, library storage, encryption, file and clipboard I/O.","longDescription":"restore.ts normalizes and migrates imported elements and appState. JSON and blob loaders read .excalidraw files and PNG files with embedded scene metadata. Encode and encryption provide compression and AES-GCM for sharing. library.ts manages library items through persistence and migration adapters. reconcile merges remote collaborator elements. clipboard.ts reads and writes mixed clipboard content, and filesystem wraps the browser file open and save APIs.","children":[{"id":"file:packages/excalidraw/data/blob.ts","label":"blob","kind":"file","path":"packages/excalidraw/data/blob.ts","weight":498,"shortDescription":"Loads scenes, libraries and images from blobs and converts between files and data URLs.","longDescription":"Parses file contents (including scene metadata embedded in PNGs via ./image), validates them as scene or library JSON, and runs them through restore before returning. Also detects MIME and file handle types, checks for supported image formats, converts canvases to blobs, builds data URLs, and derives file IDs by hashing file contents.","functions":["loadSceneOrLibraryFromBlob()","loadFromBlob()","loadLibraryFromBlob()","canvasToBlob()","generateIdFromFile()","getDataURL()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/clipboard.ts","label":"clipboard","kind":"file","path":"packages/excalidraw/clipboard.ts","weight":604,"shortDescription":"Copies elements to the system clipboard and parses pasted content.","longDescription":"Serializes selected elements and their image files into excalidraw clipboard JSON, and writes text or PNG blobs to the system clipboard. On paste, it parses DataTransfer events and mime types into elements, files, plain text or mixed text/image-URL content. Feature-detection flags report which browser clipboard APIs are likely available, and blob helpers handle image files.","functions":["copyToClipboard()","serializeAsClipboardJSON()","parseClipboard()","parseDataTransferEvent()","readSystemClipboard()","copyBlobToClipboardAsPng()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/data/library.ts","label":"library","kind":"file","path":"packages/excalidraw/data/library.ts","weight":874,"shortDescription":"Manages library item state, persistence adapters, merging and URL-based installs.","longDescription":"Holds library items in a Jotai atom, with an update queue and emitter that compute added, deleted and updated diffs for onLibraryChange. Defines persistence and migration adapter interfaces for hosts. The useHandleLibrary hook loads libraries from allow-listed URLs given in the URL hash. Helpers merge item sets, lay items out on a grid, and hash item versions.","functions":["useHandleLibrary()","mergeLibraryItems()","distributeLibraryItemsOnSquareGrid()","validateLibraryUrl()","parseLibraryTokensFromUrl()","getLibraryItemsHash()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/data/restore.ts","label":"restore","kind":"file","path":"packages/excalidraw/data/restore.ts","weight":1308,"shortDescription":"Normalizes and migrates imported elements, app state and library items to current schemas.","longDescription":"Repairs each element by filling defaults, fixing invalid points, normalizing fonts, line heights, arrowheads, bindings, elbow arrows, sticky notes and fractional indices, and repairs container/bound-text links. Restores AppState with defaults, renames legacy keys and validates the active tool. It is the shared migration layer used by blob, clipboard and library loading.","functions":["restoreElements()","restoreElement()","restoreAppState()","restoreLibraryItems()","bumpElementVersions()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/data/encode.ts","label":"encode","kind":"file","path":"packages/excalidraw/data/encode.ts","weight":360,"shortDescription":"Handles byte-string, base64, compression and the encrypted binary data envelope.","longDescription":"Converts between strings, byte strings, ArrayBuffers and base64/base64url. encode and decode wrap text with optional pako deflate. compressData and decompressData pack the encoding metadata, IV and AES-GCM-encrypted payload into a single versioned binary buffer, using encryption.ts for the crypto.","functions":["compressData()","decompressData()","encode()","decode()","stringToBase64()","base64ToString()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/data/json.ts","label":"json","kind":"file","path":"packages/excalidraw/data/json.ts","weight":143,"shortDescription":"Serializes scenes and libraries to JSON and saves or loads .excalidraw files.","longDescription":"Builds versioned export payloads. In local mode it cleans AppState for export and drops files that only deleted elements reference. In database mode it uses the database-safe AppState instead. It saves through the filesystem wrappers and loads through blob.ts. Also provides type guards that recognize valid scene and library JSON.","functions":["serializeAsJSON()","saveAsJSON()","loadFromJSON()","isValidExcalidrawData()","isValidLibrary()","serializeLibraryAsJSON()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/data/types.ts","label":"data types","kind":"file","path":"packages/excalidraw/data/types.ts","weight":58,"shortDescription":"Type definitions for exported and imported scene and library data.","longDescription":"Declares the shapes of serialized scene data (ExportedDataState) and the looser ImportedDataState, which accepts legacy AppState keys mapped through LegacyAppState. It also defines library export and import formats, including the deprecated v1 library field, plus a container type for library item ID lists.","functions":["ExportedDataState","ImportedDataState","LegacyAppState","ExportedLibraryData","ImportedLibraryData","ExcalidrawLibraryIds"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/data/index.ts","label":"data index","kind":"file","path":"packages/excalidraw/data/index.ts","weight":205,"shortDescription":"Prepares elements for export and runs canvas exports to PNG, SVG or clipboard.","longDescription":"Chooses which elements to export: the whole scene, the current selection, or a single selected frame together with its overlapping elements. exportCanvas renders through scene/export and then saves PNG or SVG files, copies a PNG to the clipboard, or copies SVG text. It also re-exports loadFromBlob, loadFromJSON and saveAsJSON.","functions":["prepareElementsForExport()","exportCanvas()","ExportedElements"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/data/filesystem.ts","label":"filesystem","kind":"file","path":"packages/excalidraw/data/filesystem.ts","weight":64,"shortDescription":"Typed wrappers around browser-fs-access for opening and saving files.","longDescription":"Maps excalidraw file extension keys to MIME types and extension lists, expanding jpg to cover jpeg as well. Opened files are normalized through blob.ts. fileSave passes an existing FileSystemFileHandle through so that saves can overwrite in place, and the module re-exports native file system support detection.","functions":["fileOpen()","fileSave()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/data/encryption.ts","label":"encryption","kind":"file","path":"packages/excalidraw/data/encryption.ts","weight":85,"shortDescription":"AES-GCM key generation, import, encryption and decryption using WebCrypto.","longDescription":"Generates extractable AES-GCM keys and exports them as the JWK k string. It imports keys from that string for either encrypt or decrypt usage. encryptData accepts strings, buffers or blobs, creates a random 12-byte IV and returns the ciphertext with that IV. Collaboration and shareable-link payloads rely on it through encode.ts.","functions":["generateEncryptionKey()","getCryptoKey()","encryptData()","decryptData()","createIV()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/data/reconcile.ts","label":"reconcile","kind":"file","path":"packages/excalidraw/data/reconcile.ts","weight":102,"shortDescription":"Merges remote collaborator elements with local ones using version-based conflict rules.","longDescription":"A remote element is discarded when the local copy is being resized or created, has a higher version, or ties on version with a lower or equal versionNonce. The merged result is ordered by fractional index and invalid indices are synced. In dev and test environments, a throttled check validates the indices.","functions":["reconcileElements()","shouldDiscardRemoteElement()","ReconciledExcalidrawElement","RemoteExcalidrawElement"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/data/EditorLocalStorage.ts","label":"EditorLocalStorage","kind":"file","path":"packages/excalidraw/data/EditorLocalStorage.ts","weight":47,"shortDescription":"Safe JSON get, set, has and delete wrapper over localStorage for editor keys.","longDescription":"A static class limited to keys from EDITOR_LS_KEYS. Values are stored as JSON and parsed on read. Each operation catches storage exceptions, logs a warning and returns a fallback such as null or false, so quota or privacy-mode errors do not break the editor.","functions":["EditorLocalStorage","get()","set()","has()","delete()"],"children":[],"edges":[]},{"id":"more:packages/excalidraw:data-io","label":"+2 more files","kind":"file","path":"packages/excalidraw/data","weight":20,"shortDescription":"2 smaller files in this module.","longDescription":"image.ts, resave.ts","functions":[],"children":[],"edges":[]}],"edges":[{"from":"more:packages/excalidraw:data-io","to":"file:packages/excalidraw/data/blob.ts","weight":2},{"from":"file:packages/excalidraw/clipboard.ts","to":"file:packages/excalidraw/data/blob.ts","weight":1},{"from":"file:packages/excalidraw/data/blob.ts","to":"file:packages/excalidraw/data/encode.ts","weight":1},{"from":"file:packages/excalidraw/data/blob.ts","to":"file:packages/excalidraw/data/filesystem.ts","weight":1},{"from":"file:packages/excalidraw/data/blob.ts","to":"file:packages/excalidraw/data/json.ts","weight":1},{"from":"file:packages/excalidraw/data/blob.ts","to":"file:packages/excalidraw/data/restore.ts","weight":1},{"from":"file:packages/excalidraw/data/blob.ts","to":"file:packages/excalidraw/data/types.ts","weight":1},{"from":"file:packages/excalidraw/data/blob.ts","to":"more:packages/excalidraw:data-io","weight":1},{"from":"file:packages/excalidraw/data/encode.ts","to":"file:packages/excalidraw/data/encryption.ts","weight":1},{"from":"file:packages/excalidraw/data/encryption.ts","to":"file:packages/excalidraw/data/blob.ts","weight":1},{"from":"file:packages/excalidraw/data/filesystem.ts","to":"file:packages/excalidraw/data/blob.ts","weight":1},{"from":"more:packages/excalidraw:data-io","to":"file:packages/excalidraw/data/encode.ts","weight":1},{"from":"file:packages/excalidraw/data/index.ts","to":"file:packages/excalidraw/clipboard.ts","weight":1},{"from":"file:packages/excalidraw/data/index.ts","to":"file:packages/excalidraw/data/blob.ts","weight":1},{"from":"file:packages/excalidraw/data/index.ts","to":"file:packages/excalidraw/data/filesystem.ts","weight":1},{"from":"file:packages/excalidraw/data/index.ts","to":"file:packages/excalidraw/data/json.ts","weight":1},{"from":"file:packages/excalidraw/data/index.ts","to":"more:packages/excalidraw:data-io","weight":1},{"from":"file:packages/excalidraw/data/json.ts","to":"file:packages/excalidraw/data/blob.ts","weight":1},{"from":"file:packages/excalidraw/data/json.ts","to":"file:packages/excalidraw/data/filesystem.ts","weight":1},{"from":"file:packages/excalidraw/data/json.ts","to":"file:packages/excalidraw/data/types.ts","weight":1},{"from":"file:packages/excalidraw/data/library.ts","to":"file:packages/excalidraw/data/blob.ts","weight":1},{"from":"file:packages/excalidraw/data/library.ts","to":"file:packages/excalidraw/data/restore.ts","weight":1},{"from":"more:packages/excalidraw:data-io","to":"file:packages/excalidraw/data/index.ts","weight":1},{"from":"file:packages/excalidraw/data/restore.ts","to":"file:packages/excalidraw/data/types.ts","weight":1}]},{"id":"mod:packages/excalidraw:fonts","label":"Fonts & Subsetting","kind":"module","path":"packages/excalidraw","weight":6893,"shortDescription":"Font face registry, loading, and WASM-based glyph subsetting for SVG export.","longDescription":"The Fonts class registers bundled families such as Excalifont, Virgil and Xiaolai (split into unicode-range shards) and loads them on demand. ExcalidrawFontFace fetches and inlines font sources. The subset folder uses HarfBuzz and WOFF2 WASM bindings, run in a worker pool when available, to shrink fonts to only the glyphs used before embedding them in exported SVGs.","children":[{"id":"file:packages/excalidraw/subset/woff2/woff2-bindings.ts","label":"woff2 bindings","kind":"file","path":"packages/excalidraw/subset/woff2/woff2-bindings.ts","weight":4038,"shortDescription":"Emscripten-generated JS glue for the WOFF2 compression/decompression WASM module.","longDescription":"Vendored, slightly modified emscripten bindings from fonteditor-core that instantiate the woff2 WASM binary. Changes include a default ESM export and a cross-realm-safe ArrayBuffer check via Object.prototype.toString. Consumed only by woff2-loader, which passes the wasm binary in manually.","functions":["Module()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/fonts/Fonts.ts","label":"Fonts","kind":"file","path":"packages/excalidraw/fonts/Fonts.ts","weight":444,"shortDescription":"Central registry that registers, loads, and refreshes font faces for the scene.","longDescription":"Fonts class holds the static registry of all font families (Excalifont, Virgil, Xiaolai, Nunito, etc.) mapped to ExcalidrawFontFace instances, plus a loadedFontsCache. It loads fonts used by scene text elements, including CJK and emoji fallbacks, invalidates ShapeCache and re-renders after loading, and generates CSS for SVG export. Handles worker FontFaceSets and server environments lacking document.fonts.","functions":["Fonts","ExcalidrawFontFaceDescriptor","loadedFontsCache","getWorkerFontFaceSet()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/fonts/Xiaolai/index.ts","label":"Xiaolai faces","kind":"file","path":"packages/excalidraw/fonts/Xiaolai/index.ts","weight":1319,"shortDescription":"Declares Xiaolai CJK font face descriptors split into many unicode-range woff2 chunks.","longDescription":"Generated by an online font splitter and rewritten into TS descriptors for the FontFace API. Imports roughly 200 hashed woff2 shards and pairs each with its unicode-range so browsers fetch only needed CJK glyph chunks. Serves as the hand-drawn CJK fallback registered by Fonts.","functions":["XiaolaiFontFaces"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/subset/subset-shared.chunk.ts","label":"subset shared","kind":"file","path":"packages/excalidraw/subset/subset-shared.chunk.ts","weight":72,"shortDescription":"Shared subsetting logic: decompress woff2, subset glyphs via HarfBuzz, recompress.","longDescription":"Lazy-loaded chunk used by both the main thread and workers, deliberately free of main-chunk imports to keep bundles separate. subsetToBinary loads woff2 and hb-subset WASM, decompresses, subsets by codepoints, and recompresses. subsetToBase64 wraps it and falls back to encoding the whole font on error. Defines the Commands message protocol.","functions":["subsetToBase64()","subsetToBinary()","toBase64()","Commands"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/fonts/ExcalidrawFontFace.ts","label":"ExcalidrawFontFace","kind":"file","path":"packages/excalidraw/fonts/ExcalidrawFontFace.ts","weight":170,"shortDescription":"Wraps a browser FontFace with fallback URLs and subsetted CSS generation.","longDescription":"Builds a FontFace from one or more source URLs, adding an esm.sh CDN fallback keyed on package version and honoring the local font protocol. toCSS checks the unicode range against used characters, fetches woff2 content from the URLs in order, and subsets it via subsetWoff2GlyphsByCodepoints into a data-URL @font-face rule for SVG export.","functions":["ExcalidrawFontFace","toCSS()","getContent()","createUrls()","getFormat()","getUnicodeRangeRegex()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/subset/harfbuzz/harfbuzz-bindings.ts","label":"harfbuzz bindings","kind":"file","path":"packages/excalidraw/subset/harfbuzz/harfbuzz-bindings.ts","weight":182,"shortDescription":"TypeScript bindings around hb-subset WASM to subset font glyphs by codepoints.","longDescription":"Adapted from the subset-font package: node APIs, lodash, p-limit and brotli dependencies removed so it runs in browsers. Accepts codepoints instead of text and drives HarfBuzz subset-input, face, and blob calls over WASM memory to emit a reduced TTF. Loaded through harfbuzz-loader in the shared subset chunk.","functions":["subset()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/fonts/index.ts","label":"fonts index","kind":"file","path":"packages/excalidraw/fonts/index.ts","weight":1,"shortDescription":"Barrel file re-exporting everything from Fonts.","longDescription":"Single-line entry point re-exporting the Fonts module so consumers import from the fonts directory. Holds no logic of its own.","functions":["Fonts"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/fonts/Excalifont/index.ts","label":"Excalifont faces","kind":"file","path":"packages/excalidraw/fonts/Excalifont/index.ts","weight":140,"shortDescription":"Declares Excalifont font face descriptors across seven unicode-range woff2 shards.","longDescription":"Generated with cn-font-split and includes the font's OFL license metadata. Imports hashed woff2 shards and maps each to its unicode-range descriptor. Excalifont is the default hand-drawn family registered by Fonts.","functions":["ExcalifontFontFaces"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/subset/subset-main.ts","label":"subset main","kind":"file","path":"packages/excalidraw/subset/subset-main.ts","weight":109,"shortDescription":"Main-thread entry for glyph subsetting, dispatching to a worker pool or inline fallback.","longDescription":"subsetWoff2GlyphsByCodepoints lazy-loads the shared subset chunk and, when Web Workers exist, posts a copied, transferred ArrayBuffer to a WorkerPool, base64-encoding the result on the main thread. On worker failures such as WorkerUrlNotDefinedError or WorkerInTheMainChunkError it disables workers and subsets inline. Server environments always use the main thread.","functions":["subsetWoff2GlyphsByCodepoints()","lazyLoadSharedSubsetChunk()","getOrCreateWorkerPool()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/fonts/ComicShanns/index.ts","label":"ComicShanns faces","kind":"file","path":"packages/excalidraw/fonts/ComicShanns/index.ts","weight":84,"shortDescription":"Declares Comic Shanns font face descriptors split into four woff2 shards.","longDescription":"Generated with cn-font-split and rewritten into TS FontFace descriptors, carrying the font's MIT license header. Maps four hashed woff2 imports to unicode-range descriptors for registration in Fonts.","functions":["ComicShannsFontFaces"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/subset/subset-worker.chunk.ts","label":"subset worker","kind":"file","path":"packages/excalidraw/subset/subset-worker.chunk.ts","weight":38,"shortDescription":"Web Worker script that handles subset commands and returns transferable buffers.","longDescription":"Exports WorkerUrl from import.meta.url so bundlers emit it as a separate chunk without plugins; undefined in Node. When running in a worker context, it listens for Subset commands, calls subsetToBinary, and posts the resulting ArrayBuffer back with transfer to avoid copying. Avoids main-chunk imports.","functions":["WorkerUrl","self.onmessage()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/subset/woff2/woff2-loader.ts","label":"woff2 loader","kind":"file","path":"packages/excalidraw/subset/woff2/woff2-loader.ts","weight":67,"shortDescription":"Lazily initializes the woff2 WASM module and exposes compress/decompress functions.","longDescription":"Instantiates the emscripten bindings with an inlined wasm binary and caches the load promise so concurrent callers share one initialization. Exposes only compress and decompress, converting emscripten vectors into Uint8Arrays. Wraps the non-Promise/A+ compliant bindings.then in explicit try/catch.","functions":["load()","convertFromVecToUint8Array()","compress()","decompress()"],"children":[],"edges":[]},{"id":"more:packages/excalidraw:fonts","label":"+10 more files","kind":"file","path":"packages/excalidraw/subset/harfbuzz","weight":46,"shortDescription":"10 smaller files in this module.","longDescription":"harfbuzz-loader.ts, harfbuzz-wasm.ts, woff2-wasm.ts, index.ts, index.ts, index.ts, index.ts, index.ts, index.ts, index.ts","functions":[],"children":[],"edges":[]}],"edges":[{"from":"more:packages/excalidraw:fonts","to":"file:packages/excalidraw/fonts/Fonts.ts","weight":7},{"from":"file:packages/excalidraw/fonts/Fonts.ts","to":"more:packages/excalidraw:fonts","weight":7},{"from":"file:packages/excalidraw/fonts/ComicShanns/index.ts","to":"file:packages/excalidraw/fonts/Fonts.ts","weight":1},{"from":"file:packages/excalidraw/fonts/ExcalidrawFontFace.ts","to":"file:packages/excalidraw/subset/subset-main.ts","weight":1},{"from":"file:packages/excalidraw/fonts/Excalifont/index.ts","to":"file:packages/excalidraw/fonts/Fonts.ts","weight":1},{"from":"file:packages/excalidraw/fonts/Fonts.ts","to":"file:packages/excalidraw/fonts/ComicShanns/index.ts","weight":1},{"from":"file:packages/excalidraw/fonts/Fonts.ts","to":"file:packages/excalidraw/fonts/ExcalidrawFontFace.ts","weight":1},{"from":"file:packages/excalidraw/fonts/Fonts.ts","to":"file:packages/excalidraw/fonts/Excalifont/index.ts","weight":1},{"from":"file:packages/excalidraw/fonts/Fonts.ts","to":"file:packages/excalidraw/fonts/Xiaolai/index.ts","weight":1},{"from":"file:packages/excalidraw/fonts/Xiaolai/index.ts","to":"file:packages/excalidraw/fonts/Fonts.ts","weight":1},{"from":"file:packages/excalidraw/fonts/index.ts","to":"file:packages/excalidraw/fonts/Fonts.ts","weight":1},{"from":"more:packages/excalidraw:fonts","to":"file:packages/excalidraw/subset/harfbuzz/harfbuzz-bindings.ts","weight":1},{"from":"file:packages/excalidraw/subset/subset-main.ts","to":"file:packages/excalidraw/subset/subset-shared.chunk.ts","weight":1},{"from":"file:packages/excalidraw/subset/subset-main.ts","to":"file:packages/excalidraw/subset/subset-worker.chunk.ts","weight":1},{"from":"file:packages/excalidraw/subset/subset-shared.chunk.ts","to":"more:packages/excalidraw:fonts","weight":1},{"from":"file:packages/excalidraw/subset/subset-shared.chunk.ts","to":"file:packages/excalidraw/subset/woff2/woff2-loader.ts","weight":1},{"from":"file:packages/excalidraw/subset/subset-worker.chunk.ts","to":"file:packages/excalidraw/subset/subset-shared.chunk.ts","weight":1},{"from":"file:packages/excalidraw/subset/woff2/woff2-loader.ts","to":"file:packages/excalidraw/subset/woff2/woff2-bindings.ts","weight":1},{"from":"file:packages/excalidraw/subset/woff2/woff2-loader.ts","to":"more:packages/excalidraw:fonts","weight":1}]}],"edges":[{"from":"mod:packages/excalidraw:ui-components","to":"mod:packages/excalidraw:editor-core","weight":256},{"from":"mod:packages/excalidraw:actions","to":"mod:packages/excalidraw:editor-core","weight":69},{"from":"mod:packages/excalidraw:actions","to":"mod:packages/excalidraw:ui-components","weight":66},{"from":"mod:packages/excalidraw:diagram-generation","to":"mod:packages/excalidraw:editor-core","weight":48},{"from":"mod:packages/excalidraw:ui-components","to":"mod:packages/excalidraw:actions","weight":39},{"from":"mod:packages/excalidraw:editor-core","to":"mod:packages/excalidraw:ui-components","weight":38},{"from":"mod:packages/excalidraw:diagram-generation","to":"mod:packages/excalidraw:ui-components","weight":24},{"from":"mod:packages/excalidraw:editor-core","to":"mod:packages/excalidraw:actions","weight":23},{"from":"mod:packages/excalidraw:data-io","to":"mod:packages/excalidraw:editor-core","weight":22},{"from":"mod:packages/excalidraw:rendering","to":"mod:packages/excalidraw:editor-core","weight":21},{"from":"mod:packages/excalidraw:editor-core","to":"mod:packages/excalidraw:interaction-tools","weight":18},{"from":"mod:packages/excalidraw:editor-core","to":"mod:packages/excalidraw:data-io","weight":17},{"from":"mod:packages/excalidraw:ui-components","to":"mod:packages/excalidraw:data-io","weight":17},{"from":"mod:packages/excalidraw:actions","to":"mod:packages/excalidraw:rendering","weight":16},{"from":"mod:packages/excalidraw:ui-components","to":"mod:packages/excalidraw:rendering","weight":15},{"from":"mod:packages/excalidraw:editor-core","to":"mod:packages/excalidraw:rendering","weight":14},{"from":"mod:packages/excalidraw:interaction-tools","to":"mod:packages/excalidraw:editor-core","weight":13},{"from":"mod:packages/excalidraw:editor-core","to":"mod:packages/excalidraw:diagram-generation","weight":9},{"from":"mod:packages/excalidraw:actions","to":"mod:packages/excalidraw:data-io","weight":8},{"from":"mod:packages/excalidraw:data-io","to":"mod:packages/excalidraw:rendering","weight":6},{"from":"mod:packages/excalidraw:ui-components","to":"mod:packages/excalidraw:interaction-tools","weight":5},{"from":"mod:packages/excalidraw:rendering","to":"mod:packages/excalidraw:data-io","weight":5},{"from":"mod:packages/excalidraw:interaction-tools","to":"mod:packages/excalidraw:rendering","weight":4},{"from":"mod:packages/excalidraw:interaction-tools","to":"mod:packages/excalidraw:actions","weight":4},{"from":"mod:packages/excalidraw:ui-components","to":"mod:packages/excalidraw:fonts","weight":3},{"from":"mod:packages/excalidraw:rendering","to":"mod:packages/excalidraw:interaction-tools","weight":3},{"from":"mod:packages/excalidraw:editor-core","to":"mod:packages/excalidraw:fonts","weight":2},{"from":"mod:packages/excalidraw:ui-components","to":"mod:packages/excalidraw:diagram-generation","weight":2},{"from":"mod:packages/excalidraw:diagram-generation","to":"mod:packages/excalidraw:data-io","weight":2},{"from":"mod:packages/excalidraw:fonts","to":"mod:packages/excalidraw:editor-core","weight":2},{"from":"mod:packages/excalidraw:actions","to":"mod:packages/excalidraw:interaction-tools","weight":1},{"from":"mod:packages/excalidraw:actions","to":"mod:packages/excalidraw:fonts","weight":1},{"from":"mod:packages/excalidraw:diagram-generation","to":"mod:packages/excalidraw:rendering","weight":1},{"from":"mod:packages/excalidraw:rendering","to":"mod:packages/excalidraw:ui-components","weight":1},{"from":"mod:packages/excalidraw:rendering","to":"mod:packages/excalidraw:fonts","weight":1},{"from":"mod:packages/excalidraw:interaction-tools","to":"mod:packages/excalidraw:data-io","weight":1}]},{"id":"pkg:packages/fractional-indexing","label":"Fractional Indexing","kind":"package","path":"packages/fractional-indexing","packageName":"@excalidraw/fractional-indexing","weight":303,"shortDescription":"Generates string order keys that sort between existing keys for list ordering.","longDescription":"Implements fractional indexing over base-62 digits so items can be inserted between neighbors without renumbering the whole list. Exposes key validation plus single and batch key generation between two bounds. Excalidraw uses it to keep a stable z-order of elements across collaborative edits.","children":[{"id":"mod:packages/fractional-indexing:order-key-generation","label":"Order Key Generation","kind":"module","path":"packages/fractional-indexing/src","weight":303,"shortDescription":"Validates and generates base-62 fractional order keys between two bounds.","longDescription":"Defines the BASE_62_DIGITS alphabet and validateOrderKey for checking key format. generateKeyBetween produces one key strictly between optional lower and upper bounds. generateNKeysBetween produces many evenly spread keys for batch inserts. All logic is in one self-contained file with no external dependencies, so it cannot be split into the requested three or more modules.","children":[{"id":"file:packages/fractional-indexing/src/index.ts","label":"index","kind":"file","path":"packages/fractional-indexing/src/index.ts","weight":303,"shortDescription":"Generates and validates base-62 fractional order keys between two existing keys.","longDescription":"Vendored copy of the CC0 fractional-indexing package. A recursive midpoint() strips common prefixes and picks a middle digit, while integer-part helpers handle variable-length head characters. validateOrderKey() rejects malformed or trailing-zero keys. generateKeyBetween() returns one key between optional bounds, and generateNKeysBetween() splits ranges to produce evenly spread batches of keys for element ordering.","functions":["generateKeyBetween()","generateNKeysBetween()","validateOrderKey()","midpoint()","BASE_62_DIGITS"],"children":[],"edges":[]}],"edges":[]}],"edges":[]},{"id":"pkg:packages/laser-pointer","label":"Laser Pointer","kind":"package","path":"packages/laser-pointer","packageName":"@excalidraw/laser-pointer","weight":411,"shortDescription":"Builds smoothed, tapered polygon outlines for laser-pointer style freehand strokes.","longDescription":"Accepts timestamped input points, applies streamline interpolation and optional Douglas-Peucker simplification, then computes a closed outline polygon whose width follows a caller-supplied size mapping. Exposes a single LaserPointer class plus option and size-mapping types, backed by small vector-math and simplification helpers.","children":[{"id":"mod:packages/laser-pointer:stroke-engine","label":"Stroke Engine","kind":"module","path":"packages/laser-pointer/src","weight":292,"shortDescription":"LaserPointer class that collects points and generates stroke outlines.","longDescription":"Defines LaserPointerOptions, SizeMappingDetails and the LaserPointer class with addPoint, close and getStrokeOutline. Merges defaults for size, streamline, simplify, simplifyPhase and keepHead, smooths incoming points, and builds left/right outline edges with rounded caps. Relies on math helpers for vector operations and douglasPeucker for input, output or tail simplification.","children":[{"id":"file:packages/laser-pointer/src/state.ts","label":"LaserPointer state","kind":"file","path":"packages/laser-pointer/src/state.ts","weight":292,"shortDescription":"Collects pointer input points and produces smoothed, variable-width laser stroke outlines.","longDescription":"Defines LaserPointer, which deduplicates incoming points, applies streamline interpolation via math plerp, and splits them into stable and tail segments. Uses douglasPeucker from simplify at a configurable phase (tail, output, or input) and detects corners by angle thresholds. Stroke width comes from a pluggable sizeMapping callback receiving pressure and running-length details, with defaults and tuning constants exposed statically.","functions":["LaserPointer","addPoint()","LaserPointerOptions","SizeMappingDetails","LaserPointer.defaults","LaserPointer.constants"],"children":[],"edges":[]}],"edges":[]},{"id":"mod:packages/laser-pointer:geometry","label":"Geometry Utilities","kind":"module","path":"packages/laser-pointer/src","weight":117,"shortDescription":"Vector math and polyline simplification helpers for stroke computation.","longDescription":"math.ts defines the Point tuple type and pure functions for addition, subtraction, scalar multiply, normalization, rotation and linear interpolation of points and scalars. simplify.ts implements recursive Douglas-Peucker reduction over point arrays using those helpers. Both are stateless and consumed by the stroke engine.","children":[{"id":"file:packages/laser-pointer/src/math.ts","label":"math","kind":"file","path":"packages/laser-pointer/src/math.ts","weight":82,"shortDescription":"Vector math helpers for 3-component points carrying x, y, and radius.","longDescription":"Defines the Point tuple [x, y, r] and pure functions for addition, subtraction, scaling, normalization, rotation, and interpolation. Also provides angle computation and normalization, distances, polyline run length, and clamping. getCircleAndPerpendicularLineIntersectionsAtPoint offsets a point perpendicular to a direction by a radius to build stroke outline edges. simplify.ts imports distancePointToSegment from here.","functions":["getCircleAndPerpendicularLineIntersectionsAtPoint()","plerp()","rot()","norm()","runLength()","angle()"],"children":[],"edges":[]},{"id":"file:packages/laser-pointer/src/simplify.ts","label":"simplify","kind":"file","path":"packages/laser-pointer/src/simplify.ts","weight":35,"shortDescription":"Recursive Douglas-Peucker polyline simplification for laser pointer stroke points.","longDescription":"Implements douglasPeucker, which finds the point farthest from the segment joining the first and last points. If that distance meets epsilon, the function splits there, recurses on both halves, and joins the results without duplicating the split point. Otherwise it collapses the run to its endpoints. An epsilon of 0 or input of two or fewer points returns unchanged. Distance comes from distancePointToSegment in math.ts.","functions":["douglasPeucker()"],"children":[],"edges":[]}],"edges":[{"from":"file:packages/laser-pointer/src/simplify.ts","to":"file:packages/laser-pointer/src/math.ts","weight":1}]},{"id":"mod:packages/laser-pointer:public-api","label":"Public API","kind":"module","path":"packages/laser-pointer/src","weight":2,"shortDescription":"Package entry point re-exporting the stroke class and its types.","longDescription":"index.ts is the barrel module that re-exports LaserPointer and its option types from the stroke engine, forming the import surface for '@excalidraw/laser-pointer'. It holds no logic of its own.","children":[{"id":"file:packages/laser-pointer/src/index.ts","label":"index","kind":"file","path":"packages/laser-pointer/src/index.ts","weight":2,"shortDescription":"Package entry point re-exporting the laser pointer stroke class and Point type.","longDescription":"Re-exports everything from ./state, which holds the LaserPointer stroke class and its option types, so consumers import from a single module. Also re-exports the Point type from ./math as a type-only export, keeping the math helpers internal. Contains no logic of its own.","functions":["LaserPointer","Point"],"children":[],"edges":[]}],"edges":[]}],"edges":[{"from":"mod:packages/laser-pointer:stroke-engine","to":"mod:packages/laser-pointer:geometry","weight":2},{"from":"mod:packages/laser-pointer:public-api","to":"mod:packages/laser-pointer:stroke-engine","weight":1},{"from":"mod:packages/laser-pointer:public-api","to":"mod:packages/laser-pointer:geometry","weight":1}]},{"id":"pkg:packages/math","label":"Excalidraw Math","kind":"package","path":"packages/math","packageName":"@excalidraw/math","weight":2100,"shortDescription":"Branded geometry types and pure functions for points, vectors, shapes, curves, and statistics.","longDescription":"Provides the 2D math foundation for Excalidraw: branded tuple types for global and local points, vectors, and angles, plus constructors, predicates, and intersection or distance routines for lines, segments, polygons, ellipses, and Bezier curves. Functions are pure and allocation-light, and index.ts re-exports the public surface.","children":[{"id":"mod:packages/math:core-types","label":"Core Types","kind":"module","path":"packages/math/src","weight":232,"shortDescription":"Branded type definitions, numeric helpers, constants, and the package entry point.","longDescription":"types.ts defines branded nominal types such as Radians, Degrees, GlobalPoint, LocalPoint, Line, and InclusiveRange, so coordinate spaces cannot be mixed. utils.ts supplies PRECISION, clamp, round, and isCloseTo for tolerance-based comparisons. constants.ts holds the Legendre-Gauss quadrature tables used by curve.ts. index.ts re-exports every module.","children":[{"id":"file:packages/math/src/index.ts","label":"index","kind":"file","path":"packages/math/src/index.ts","weight":14,"shortDescription":"Package entry point re-exporting every math submodule.","longDescription":"Barrel file that re-exports angle, curve, ellipse, line, pca, point, polygon, range, rectangle, segment, triangle, vector, types and utils. Consumers import everything from @excalidraw/math through it. constants.ts is not re-exported, so the Legendre-Gauss tables stay internal to the package.","functions":[],"children":[],"edges":[]},{"id":"file:packages/math/src/types.ts","label":"types","kind":"file","path":"packages/math/src/types.ts","weight":138,"shortDescription":"Branded TypeScript types for angles, points, lines, shapes and curves.","longDescription":"Defines nominal types by intersecting primitives or tuples with a _brand field. This stops global and local points, or radians and degrees, from being mixed at compile time. Generic shapes such as Line, LineSegment, Triangle, Polygon and Curve are parameterized over GlobalPoint or LocalPoint. Legacy object-style GlobalCoord and LocalCoord are kept until the codebase finishes migrating to tuples. InclusiveRange reuses the degree brand string.","functions":["Radians","Degrees","GlobalPoint","LocalPoint","LineSegment","Curve"],"children":[],"edges":[]},{"id":"file:packages/math/src/utils.ts","label":"utils","kind":"file","path":"packages/math/src/utils.ts","weight":26,"shortDescription":"Scalar numeric helpers for clamping, rounding, averaging and tolerance comparisons.","longDescription":"Small pure functions on numbers that the geometry modules share. PRECISION (1e-4) is the default tolerance for isCloseTo. round adds Number.EPSILON before scaling to reduce float artifacts, and accepts round, floor or ceil modes. roundToStep snaps a value to an arbitrary step. isFiniteNumber is a type guard that rejects NaN and Infinity.","functions":["clamp()","round()","roundToStep()","isCloseTo()","isFiniteNumber()","PRECISION"],"children":[],"edges":[]},{"id":"file:packages/math/src/constants.ts","label":"constants","kind":"file","path":"packages/math/src/constants.ts","weight":54,"shortDescription":"Legendre-Gauss quadrature abscissae and weights for n=24.","longDescription":"Holds precomputed tables of 24-point Legendre-Gauss abscissae and weights, sourced from Pomax's Bezier primer. The curve module uses them for numerical integration, such as computing Bezier arc length. Values are stored as symmetric ± pairs at high precision.","functions":["LegendreGaussN24TValues","LegendreGaussN24CValues"],"children":[],"edges":[]}],"edges":[{"from":"file:packages/math/src/index.ts","to":"file:packages/math/src/types.ts","weight":1},{"from":"file:packages/math/src/index.ts","to":"file:packages/math/src/utils.ts","weight":1}]},{"id":"mod:packages/math:points-vectors","label":"Points And Vectors","kind":"module","path":"packages/math/src","weight":455,"shortDescription":"Point and vector constructors, arithmetic, rotation, and angle conversions.","longDescription":"Covers primitive operations that every shape module builds on: creating points from arrays, pairs, or vectors; point equality and rotation; vector add, subtract, scale, dot, and cross products; and conversions between radians and degrees, plus cartesian-to-polar conversion. Results use branded tuples from types.ts.","children":[{"id":"file:packages/math/src/point.ts","label":"point","kind":"file","path":"packages/math/src/point.ts","weight":247,"shortDescription":"Constructs, compares, transforms, and measures branded 2D point tuples.","longDescription":"Provides overloaded pointFrom() that builds GlobalPoint or LocalPoint tuples from coordinates, arrays, pairs, or legacy {x, y} objects. Implements equality with PRECISION tolerance, rotation by radians or degrees around a center, translation by vectors, midpoints, and Euclidean distance. Relies on vector.ts for translation and scaling, and angle.ts for degree conversion.","functions":["pointFrom()","pointRotateRads()","pointTranslate()","pointDistance()","pointsEqual()","pointCenter()"],"children":[],"edges":[]},{"id":"file:packages/math/src/vector.ts","label":"vector","kind":"file","path":"packages/math/src/vector.ts","weight":144,"shortDescription":"Creates 2D vectors and provides dot, cross, scaling, and normalization operations.","longDescription":"Defines branded Vector tuples built from coordinates with an optional origin, or from points via vectorFromPoint(), which returns a default vector when magnitude falls below a threshold. Supplies arithmetic (add, subtract, scale), 2D cross and dot products, magnitude, normalization, and perpendicular normals. Depends only on shared types, so point.ts and geometry code can build on it.","functions":["vectorFromPoint()","vectorCross()","vectorDot()","vectorScale()","vectorNormalize()","vectorMagnitude()"],"children":[],"edges":[]},{"id":"file:packages/math/src/angle.ts","label":"angle","kind":"file","path":"packages/math/src/angle.ts","weight":64,"shortDescription":"Converts and normalizes angles, and compares angular ranges and differences.","longDescription":"Handles branded Radians and Degrees types: normalizes radians into [0, 2π), converts between degrees and radians, and converts cartesian points to polar coordinates. Also checks for right angles within PRECISION, tests whether an angle lies in a range that may wrap past zero, and computes signed differences clamped to [-π, π].","functions":["normalizeRadians()","degreesToRadians()","radiansToDegrees()","cartesian2Polar()","radiansBetweenAngles()","radiansDifference()"],"children":[],"edges":[]}],"edges":[{"from":"file:packages/math/src/point.ts","to":"file:packages/math/src/angle.ts","weight":1},{"from":"file:packages/math/src/point.ts","to":"file:packages/math/src/vector.ts","weight":1}]},{"id":"mod:packages/math:linear-shapes","label":"Linear Shapes","kind":"module","path":"packages/math/src","weight":527,"shortDescription":"Lines, segments, rectangles, triangles, polygons, and 1D ranges with intersection tests.","longDescription":"Implements straight-edged geometry: infinite line intersection, segment rotation, point-on-segment and distance checks, and segment intersection points. Also handles rectangle and segment intersection, triangle and polygon containment using both even-odd and non-zero rules, signed area, and convex hull. Range helpers handle 1D interval overlap and intersection. All of these build on the point and vector primitives.","children":[{"id":"file:packages/math/src/segment.ts","label":"segment","kind":"file","path":"packages/math/src/segment.ts","weight":177,"shortDescription":"Line segment construction, rotation, intersection, and distance utilities.","longDescription":"Represents segments as branded two-point tuples and provides type guards, rotation about an origin or midpoint, intersection points, point-on-segment tests, and point/segment distances. Builds on line.ts for infinite-line intersection and on point/vector helpers for cross products and projections. Tolerance comparisons use the shared PRECISION constant.","functions":["lineSegment()","segmentsIntersectAt()","lineSegmentIntersectionPoints()","distanceToLineSegment()","pointOnLineSegment()","lineSegmentsDistance()"],"children":[],"edges":[]},{"id":"file:packages/math/src/polygon.ts","label":"polygon","kind":"file","path":"packages/math/src/polygon.ts","weight":185,"shortDescription":"Polygon creation, point containment tests, area, and convex hull computation.","longDescription":"Builds closed polygons by appending the first point when missing. Offers two containment tests: even-odd ray casting and a non-zero winding rule. Also computes signed and absolute area, convex hulls, and simplified convex polygons. Relies on pointsEqual and PRECISION for closure checks.","functions":["polygon()","polygonIncludesPoint()","polygonIncludesPointNonZero()","polygonArea()","convexHull()","simplifyConvexPolygon()"],"children":[],"edges":[]},{"id":"file:packages/math/src/range.ts","label":"range","kind":"file","path":"packages/math/src/range.ts","weight":73,"shortDescription":"Inclusive 1D numeric ranges with overlap, intersection, and containment checks.","longDescription":"Models closed intervals as branded InclusiveRange tuples created via toBrandedType from @excalidraw/common. Provides overlap detection, intersection that returns null when the ranges are disjoint, and value inclusion tests. These helpers are used for interval logic such as bounds and snapping comparisons.","functions":["rangeInclusive()","rangeInclusiveFromPair()","rangesOverlap()","rangeIntersection()","rangeIncludesValue()"],"children":[],"edges":[]},{"id":"file:packages/math/src/line.ts","label":"line","kind":"file","path":"packages/math/src/line.ts","weight":35,"shortDescription":"Infinite line construction and line-line intersection point calculation.","longDescription":"Defines a Line as a branded pair of points lying on it. linesIntersectAt solves the two-line system with determinants in standard form (Ax + By = C) and returns null for parallel lines. segment.ts uses it as the basis for bounded segment intersection.","functions":["line()","linesIntersectAt()"],"children":[],"edges":[]},{"id":"file:packages/math/src/rectangle.ts","label":"rectangle","kind":"file","path":"packages/math/src/rectangle.ts","weight":33,"shortDescription":"Axis-aligned rectangles with segment and rectangle intersection tests.","longDescription":"Represents rectangles as top-left/bottom-right point pairs. A rectangle can be built from min/max coordinates. To intersect a line segment, the rectangle is decomposed into four edge segments and lineSegmentIntersectionPoints from segment.ts is applied to each. Rectangle-rectangle overlap uses a strict AABB comparison, so edges that only touch do not count as intersecting.","functions":["rectangle()","rectangleFromNumberSequence()","rectangleIntersectLineSegment()","rectangleIntersectRectangle()"],"children":[],"edges":[]},{"id":"file:packages/math/src/triangle.ts","label":"triangle","kind":"file","path":"packages/math/src/triangle.ts","weight":24,"shortDescription":"Point-in-triangle test using the signs of edge cross products.","longDescription":"Implements triangleIncludesPoint by computing the sign of a 2D cross product for each triangle edge relative to the test point. The point is inside when the signs do not mix. The only dependencies are the type definitions for points and triangles.","functions":["triangleIncludesPoint()"],"children":[],"edges":[]}],"edges":[{"from":"file:packages/math/src/rectangle.ts","to":"file:packages/math/src/segment.ts","weight":1},{"from":"file:packages/math/src/segment.ts","to":"file:packages/math/src/line.ts","weight":1}]},{"id":"mod:packages/math:curved-shapes","label":"Curved Shapes","kind":"module","path":"packages/math/src","weight":702,"shortDescription":"Cubic Bezier curves and ellipses: evaluation, closest points, distances, and intersections.","longDescription":"curve.ts evaluates cubic Bezier equations and tangents, and finds closest parameters and points. It uses numeric methods with Legendre-Gauss constants and intersects curves with line segments. ellipse.ts tests whether a point is inside or touching an ellipse, measures distance from a point, and finds where an ellipse meets lines and segments. Both rely on the segment and vector modules.","children":[{"id":"file:packages/math/src/curve.ts","label":"curve","kind":"file","path":"packages/math/src/curve.ts","weight":487,"shortDescription":"Cubic Bezier curve construction, evaluation, intersection, closest-point, offset and arc-length utilities.","longDescription":"Builds four-point cubic Bezier curves and evaluates them via bezierEquation. Finds line-segment intersections with a Newton solver using an analytical Jacobian, and locates closest parameters/points for distance queries. Also provides tangents, Catmull-Rom approximations, offset point generation, and arc length computed with 24-point Legendre-Gauss quadrature. Depends on point and vector helpers.","functions":["curve()","bezierEquation","curveIntersectLineSegment()","curveClosestPoint()","curvePointDistance()","curveLength()"],"children":[],"edges":[]},{"id":"file:packages/math/src/ellipse.ts","label":"ellipse","kind":"file","path":"packages/math/src/ellipse.ts","weight":215,"shortDescription":"Axis-aligned ellipse construction, point
