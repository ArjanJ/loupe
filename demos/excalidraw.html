containment, distance, and line/segment intersection functions.","longDescription":"Represents ellipses by center, halfWidth and halfHeight. Tests point inclusion with a normalized equation, and checks whether a point touches the outline within a threshold via distance-from-point. Computes intercept points with line segments and infinite lines. Uses point and vector helpers and the shared PRECISION constant for tolerance.","functions":["ellipse()","ellipseIncludesPoint","ellipseTouchesPoint","ellipseDistanceFromPoint","ellipseSegmentInterceptPoints()","ellipseLineIntersectionPoints()"],"children":[],"edges":[]}],"edges":[]},{"id":"mod:packages/math:shape-analysis","label":"Shape Analysis","kind":"module","path":"packages/math/src","weight":184,"shortDescription":"Principal component analysis of point sets for orientation and elongation metrics.","longDescription":"pca.ts computes centroids, principal axes, and principal coordinates for point clouds. It also orients axes consistently and derives shape descriptors such as elongation and standardized moments, which are useful for recognizing or classifying freehand shapes.","children":[{"id":"file:packages/math/src/pca.ts","label":"pca","kind":"file","path":"packages/math/src/pca.ts","weight":184,"shortDescription":"Principal component analysis and moment statistics for 2D point sets.","longDescription":"Computes centroids and the eigen decomposition of a point set's 2x2 covariance matrix, yielding orthonormal major/minor axes ordered by variance. Projects points into the canonical principal frame to remove translation, rotation and scale, and derives shape metrics such as elongation, skewness and kurtosis via standardized moments. Builds on point and vector helpers from the same package.","functions":["principalAxes()","principalCoords()","centroid()","orientPrincipalAxes()","elongation()","standardizedMoment()"],"children":[],"edges":[]}],"edges":[]}],"edges":[{"from":"mod:packages/math:linear-shapes","to":"mod:packages/math:core-types","weight":8},{"from":"mod:packages/math:core-types","to":"mod:packages/math:linear-shapes","weight":6},{"from":"mod:packages/math:points-vectors","to":"mod:packages/math:core-types","weight":5},{"from":"mod:packages/math:linear-shapes","to":"mod:packages/math:points-vectors","weight":5},{"from":"mod:packages/math:curved-shapes","to":"mod:packages/math:points-vectors","weight":4},{"from":"mod:packages/math:curved-shapes","to":"mod:packages/math:core-types","weight":4},{"from":"mod:packages/math:core-types","to":"mod:packages/math:points-vectors","weight":3},{"from":"mod:packages/math:core-types","to":"mod:packages/math:curved-shapes","weight":2},{"from":"mod:packages/math:shape-analysis","to":"mod:packages/math:points-vectors","weight":2},{"from":"mod:packages/math:core-types","to":"mod:packages/math:shape-analysis","weight":1},{"from":"mod:packages/math:shape-analysis","to":"mod:packages/math:core-types","weight":1}]},{"id":"pkg:packages/utils","label":"Excalidraw Utils","kind":"package","path":"packages/utils","packageName":"@excalidraw/utils","weight":522,"shortDescription":"Standalone export helpers and geometric shape utilities for Excalidraw diagrams.","longDescription":"Published as a UMD bundle exposing serializeAsJSON, exportToBlob and exportToSvg so diagrams can be rendered outside the editor. Also hosts geometry primitives that convert Excalidraw elements into polygons, ellipses, polylines and curves for hit-testing and selection, built on shared math helpers.","children":[{"id":"mod:packages/utils:entry","label":"Package Entry","kind":"module","path":"packages/utils/src","weight":14,"shortDescription":"Re-exports the public utils API for bundler and browser consumers.","longDescription":"Small barrel file that defines what the UMD build exposes as ExcalidrawUtils. Forwards export and serialization functions from the main excalidraw package and shape helpers, keeping the public surface in one place.","children":[{"id":"file:packages/utils/src/index.ts","label":"index","kind":"file","path":"packages/utils/src/index.ts","weight":14,"shortDescription":"Re-exports scene export helpers and element geometry utilities as the utils package API.","longDescription":"Serves as a thin backwards-compatibility facade: scene export functions, MIME_TYPES, and export config types come from @excalidraw/excalidraw/scene/export, while bounding-box helpers and the RenderEnvironment type come from @excalidraw/element. Contains no logic of its own, so consumers of the legacy @excalidraw/utils package keep working while implementations live in the core packages.","functions":["exportScene()","exportToClipboard()","MIME_TYPES","elementsOverlappingBBox()","getCommonBounds()","ExportSceneConfig"],"children":[],"edges":[]}],"edges":[]},{"id":"mod:packages/utils:shape-geometry","label":"Shape Geometry","kind":"module","path":"packages/utils/src","weight":480,"shortDescription":"Converts Excalidraw elements into geometric shapes for hit-testing and selection.","longDescription":"Defines the GeometricShape union (Polyline, Polycurve, Ellipse, polygon) and builders such as getPolygonShape, getEllipseShape and getSelectionBoxShape. getCurvePathOps extracts rough.js drawing ops so freehand and linear elements become curves. Accounts for element rotation and bounds, relying on shared math point and vector utilities.","children":[{"id":"file:packages/utils/src/shape.ts","label":"shape","kind":"file","path":"packages/utils/src/shape.ts","weight":480,"shortDescription":"Defines pure geometric shapes and converts Excalidraw elements into them for collision checks.","longDescription":"Declares shape types (Polyline, Polycurve, Ellipse, Polygon, Curve) as a GeometricShape union independent of roughjs or element specifics. Converts elements into these shapes: rectangles and diamonds to polygons, ellipses to center/axes form, linear and freedraw elements via roughjs Drawable ops sampled with points-on-curve. Also provides ellipse point tests and segment-rectangle intersection, built on @excalidraw/math primitives and getElementAbsoluteCoords.","functions":["getPolygonShape()","getEllipseShape()","getCurveShape()","getFreedrawShape()","getClosedCurveShape()","segmentIntersectRectangleElement()"],"children":[],"edges":[]}],"edges":[]},{"id":"mod:packages/utils:test-support","label":"Test Support","kind":"module","path":"packages/utils/src","weight":28,"shortDescription":"Helpers shared by the package's unit tests.","longDescription":"Provides small test utilities, such as custom matchers or fixture helpers, used when verifying geometry and export behavior. Not part of the published API and only loaded by the test runner.","children":[{"id":"file:packages/utils/src/test-utils.ts","label":"test-utils","kind":"file","path":"packages/utils/src/test-utils.ts","weight":28,"shortDescription":"Registers a custom Jest matcher for approximately comparing arrays of 2D points.","longDescription":"Extends Jest's expect with toCloselyEqualPoints, which checks each received point's x and y against the expected point within a tolerance derived from a precision argument (default 2). On failure it renders a unified diff of the JSON-serialized arrays via jest-diff's diffStringsUnified. Imported for side effects only; exports nothing.","functions":["toCloselyEqualPoints()","expect.extend()","diffStringsUnified()"],"children":[],"edges":[]}],"edges":[]}],"edges":[]},{"id":"pkg:external","label":"External services","kind":"package","external":true,"path":"outside the repo","weight":9475,"shortDescription":"Third-party services and backends Excalidraw talks to.","longDescription":"Detected from SDK imports, API hosts, *_URL settings and webhook routes: Sentry, WS Server, Backend V2, Firebase, AI Backend, Library Backend.","children":[{"id":"ext:sentry","label":"Sentry","kind":"external","path":"external service","weight":57,"shortDescription":"Error and performance monitoring.","longDescription":"","functions":[],"children":     select(id) { selected = byId.get(id) || null; inspKey = '\u0001'; render(); return !!selected; },
