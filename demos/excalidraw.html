utateElement calls are routed through the scene to trigger re-renders.","functions":["Scene","replaceAllElements()","getNonDeletedElements()","getSelectedElements()","mutateElement()","onUpdate()"],"children":[],"edges":[]},{"id":"file:packages/element/src/delta.ts","label":"delta","kind":"file","path":"packages/element/src/delta.ts","weight":1971,"shortDescription":"Reversible deleted/inserted diffs of elements and app state for history.","longDescription":"Delta represents paired deleted/inserted partials of an object. ElementsDelta tracks added, removed, and updated elements and applies them to a scene with conflict handling, binding and bound-text repair, and fractional index reordering. AppStateDelta diffs observed app state such as selection and groups. Both support inverse, squash, and applyTo, and are used by the Store and history for undo/redo and collaboration.","functions":["Delta","ElementsDelta","AppStateDelta","ApplyToOptions","DeltaContainer"],"children":[],"edges":[]},{"id":"file:packages/element/src/groups.ts","label":"groups","kind":"file","path":"packages/element/src/groups.ts","weight":281,"shortDescription":"Group selection, editing, and membership helpers using element groupIds.","longDescription":"Pure functions that read and derive group state from element groupIds and appState. Selects whole groups and expands selection from given elements. Resolves the selected group for an element and handles entering group edit mode. Also adds or removes group ids, computes maximum groups, and checks shared membership. Bound text elements follow their containers.","functions":["selectGroup()","selectGroupsFromGivenElements()","getElementsInGroup()","editGroupForSelectedElement()","addToGroup()","getMaximumGroups()"],"children":[],"edges":[]},{"id":"file:packages/element/src/store.ts","label":"store","kind":"file","path":"packages/element/src/store.ts","weight":888,"shortDescription":"Captures scene snapshots and emits durable or ephemeral change increments.","longDescription":"Store compares StoreSnapshot instances of elements and observed app state to produce StoreChange and StoreDelta objects. CaptureUpdateAction decides when updates are scheduled: IMMEDIATELY, NEVER, or EVENTUALLY. Durable increments go to undo/redo history. Ephemeral increments cover transient changes such as dragging. Snapshots use element version hashes to detect changes cheaply, and an Emitter broadcasts increments to subscribers.","functions":["Store","CaptureUpdateAction","StoreSnapshot","StoreDelta","DurableIncrement","getObservedAppState()"],"children":[],"edges":[]},{"id":"file:packages/element/src/fractionalIndex.ts","label":"fractionalIndex","kind":"file","path":"packages/element/src/fractionalIndex.ts","weight":400,"shortDescription":"Keeps element fractional indices valid and in sync with array order.","longDescription":"Treats the elements array as a cache of order defined by fractional indices. Validates indices and throws InvalidFractionalIndexError when they are broken. Orders elements by index. Generates new keys between valid neighbours for moved or invalid elements, either mutably or immutably. Bound text elements are kept adjacent to their containers. Uses the @excalidraw/fractional-indexing library.","functions":["syncMovedIndices()","syncInvalidIndices()","syncInvalidIndicesImmutable()","validateFractionalIndices()","orderByFractionalIndex()","InvalidFractionalIndexError"],"children":[],"edges":[]},{"id":"file:packages/element/src/zindex.ts","label":"zindex","kind":"file","path":"packages/element/src/zindex.ts","weight":591,"shortDescription":"Z-order operations moving selected elements forward, backward, front, back.","longDescription":"Reorders elements by computing indices to move from the selection. Contiguous deleted elements between selected ones are included. Group and frame boundaries are respected so moves stay within the editing group or target frame. Bound text stays with its container. After reordering, syncMovedIndices updates the fractional indices. Also places arrows above the bindable elements they attach to.","functions":["moveOneLeft()","moveOneRight()","moveAllLeft()","moveAllRight()","moveArrowAboveBindable()"],"children":[],"edges":[]},{"id":"file:packages/element/src/selection.ts","label":"selection","kind":"file","path":"packages/element/src/selection.ts","weight":240,"shortDescription":"Derives selected elements and box-selection results from app state.","longDescription":"Resolves selected elements from selectedElementIds, with options to include bound text and frame children. Computes elements within a selection box using bounds overlap and BoxSelectionMode. Frames and their children are never selected together. Locked and bound-text elements are excluded from direct selection. Builds stable next selectedElementIds objects, using shallow equality to avoid needless re-renders.","functions":["getSelectedElements()","getElementsWithinSelection()","makeNextSelectedElementIds()","excludeElementsInFramesFromSelection()","getTargetElements()","shouldIgnoreElementFromSelection()"],"children":[],"edges":[]},{"id":"file:packages/element/src/sortElements.ts","label":"sortElements","kind":"file","path":"packages/element/src/sortElements.ts","weight":102,"shortDescription":"Normalizes element order so groups and bound elements stay contiguous.","longDescription":"Defragments groups by recursing from the outermost groupId inward. Each group takes the slot of its first-seen member, so grouped elements become contiguous while relative order is preserved. Also places bound elements such as text right after their containers. If any elements are lost during sorting, it logs an error and returns the original input.","functions":["normalizeElementOrder()","normalizeBoundElementsOrder()"],"children":[],"edges":[]},{"id":"file:packages/element/src/showSelectedShapeActions.ts","label":"showSelectedShapeActions","kind":"file","path":"packages/element/src/showSelectedShapeActions.ts","weight":19,"shortDescription":"Decides whether the shape properties panel should be shown.","longDescription":"A single predicate that checks UI app state. The panel is hidden in view mode and while the element link selector is open. It is shown while editing text, when a drawing tool other than selection, lasso, eraser, hand, or laser is active, or when any element is selected via getSelectedElements.","functions":["showSelectedShapeActions()"],"children":[],"edges":[]}],"edges":[{"from":"file:packages/element/src/delta.ts","to":"file:packages/element/src/store.ts","weight":1},{"from":"file:packages/element/src/delta.ts","to":"file:packages/element/src/groups.ts","weight":1},{"from":"file:packages/element/src/delta.ts","to":"file:packages/element/src/fractionalIndex.ts","weight":1},{"from":"file:packages/element/src/delta.ts","to":"file:packages/element/src/Scene.ts","weight":1},{"from":"file:packages/element/src/frame.ts","to":"file:packages/element/src/selection.ts","weight":1},{"from":"file:packages/element/src/frame.ts","to":"file:packages/element/src/groups.ts","weight":1},{"from":"file:packages/element/src/frame.ts","to":"file:packages/element/src/fractionalIndex.ts","weight":1},{"from":"file:packages/element/src/frame.ts","to":"file:packages/element/src/Scene.ts","weight":1},{"from":"file:packages/element/src/selection.ts","to":"file:packages/element/src/frame.ts","weight":1},{"from":"file:packages/element/src/showSelectedShapeActions.ts","to":"file:packages/element/src/selection.ts","weight":1},{"from":"file:packages/element/src/store.ts","to":"file:packages/element/src/delta.ts","weight":1},{"from":"file:packages/element/src/zindex.ts","to":"file:packages/element/src/groups.ts","weight":1},{"from":"file:packages/element/src/zindex.ts","to":"file:packages/element/src/fractionalIndex.ts","weight":1},{"from":"file:packages/element/src/zindex.ts","to":"file:packages/element/src/selection.ts","weight":1},{"from":"file:packages/element/src/zindex.ts","to":"file:packages/element/src/Scene.ts","weight":1}]},{"id":"mod:packages/element:geometry","label":"Geometry And Hit-Testing","kind":"module","path":"packages/element/src","weight":5766,"shortDescription":"Bounds, shape decomposition, collision, distance and size calculations for elements.","longDescription":"Computes absolute coordinates and bounding boxes, breaks elements into line and curve segments, and runs point hit tests and distance queries used by selection and binding. Size helpers handle viewport visibility and aspect-locked sizing. Bucket fill builds fill polygons from surrounding geometry, and visualdebug draws debug overlays of hit volumes and curves.","children":[{"id":"file:packages/element/src/bounds.ts","label":"bounds","kind":"file","path":"packages/element/src/bounds.ts","weight":1646,"shortDescription":"Computes element bounding boxes, absolute coordinates, and arrowhead geometry.","longDescription":"Calculates axis-aligned and rotated bounds for every element type, using roughjs curve path ops for curved linear elements and caching results via ElementBounds. Also derives diamond points, line segments for outlines, and arrowhead sizes including cardinality-style heads. Collaborates with shape caching, linearElementEditor, textElement and frame clipping logic.","functions":["ElementBounds","getElementAbsoluteCoords()","getElementLineSegments()","getDiamondPoints()","getCubicBezierCurveBound()","getArrowheadSize()"],"children":[],"edges":[]},{"id":"file:packages/element/src/utils.ts","label":"shape utils","kind":"file","path":"packages/element/src/utils.ts","weight":809,"shortDescription":"Deconstructs elements into line segments and curves for geometric queries.","longDescription":"Breaks rectanguloid, diamond, linear and freedraw elements into LineSegment and Curve primitives, accounting for roundness and corner radius, with results memoized in a WeakMap keyed by element version. Also provides midpoint and snap-point helpers for elbow arrows and binding outlines, and loop detection for paths. Used heavily by collision, distance and bounds.","functions":["deconstructRectanguloidElement()","deconstructDiamondElement()","deconstructLinearOrFreeDrawElement()","getCornerRadius()","isPathALoop()","getSnapOutlineMidPoint()"],"children":[],"edges":[]},{"id":"file:packages/element/src/collision.ts","label":"collision","kind":"file","path":"packages/element/src/collision.ts","weight":852,"shortDescription":"Hit-tests points against elements and intersects elements with line segments.","longDescription":"Decides whether a pointer hits an element's stroke, fill, bounding box or bound text, considering transparency, background and frames. Supplies binding-area checks and hovered-element lookup for arrow binding, plus line-segment intersection against rectangles, diamonds, ellipses and curves. Builds on utils deconstruction, distanceToElement and bounds helpers.","functions":["hitElementItself()","hitElementBoundingBox()","isPointInElement()","intersectElementWithLineSegment()","getHoveredElementForBinding()","isPointInBindingArea()"],"children":[],"edges":[]},{"id":"file:packages/element/src/bucketFill.ts","label":"bucket fill","kind":"file","path":"packages/element/src/bucketFill.ts","weight":1815,"shortDescription":"Computes the enclosed polygon under a click point for bucket fill.","longDescription":"Pure geometry for the bucket fill tool: gathers element outlines as segments, splits them at intersections into a planar arrangement, and selects the smallest bounded face containing the click. Returns scene-space points the app converts into a line polygon, or a failure reason. Also decides which elements count as opaque or restylable fills.","functions":["computeBucketFillPolygon()","isBucketFillCompatible()","rendersOpaqueFill()","isRestylableFill()","DEFAULT_BUCKET_FILL_OPTIONS"],"children":[],"edges":[]},{"id":"file:packages/element/src/sizeHelpers.ts","label":"size helpers","kind":"file","path":"packages/element/src/sizeHelpers.ts","weight":253,"shortDescription":"Size normalization, viewport visibility checks, and shift-locked dimension helpers.","longDescription":"Provides helpers for detecting invisibly small elements, testing whether elements lie in or fully within the viewport, and snapping dimensions to perfect squares or locked angles when shift is held. Also repositions elements so a chosen edge stays fixed after height changes under rotation. Relies on bounds and SHIFT_LOCKING_ANGLE from common.","functions":["isInvisiblySmallElement()","isElementInViewport()","getPerfectElementSize()","getLockedLinearCursorAlignSize()","getNormalizedDimensions()","getPositionAfterHeightChange()"],"children":[],"edges":[]},{"id":"file:packages/element/src/distance.ts","label":"distance","kind":"file","path":"packages/element/src/distance.ts","weight":154,"shortDescription":"Computes Euclidean distance from a point to an element's outline.","longDescription":"Dispatches on element type to compute point-to-outline distance for rectanguloids, diamonds, ellipses, linear elements and freedraw, respecting rotation and roundness. Uses deconstructed segments and curves from utils plus ellipse math from @excalidraw/math. Consumed by collision hit-testing and bucket fill.","functions":["distanceToElement()"],"children":[],"edges":[]},{"id":"file:packages/element/src/visualdebug.ts","label":"visual debug","kind":"file","path":"packages/element/src/visualdebug.ts","weight":237,"shortDescription":"Records debug geometry on window for visual inspection of hit-testing.","longDescription":"Collects lines, curves, polygons, points and bounds into window.visualDebug frames so a renderer can overlay them for debugging. debugDrawHitVolume casts rays from an element's center and plots intersections to visualize its hit shape. Development-only tooling built on intersectElementWithLineSegment and getElementBounds.","functions":["debugDrawHitVolume()","debugDrawLine()","debugDrawPolygon()","debugDrawBounds()","debugCloseFrame()","debugClear()"],"children":[],"edges":[]}],"edges":[{"from":"file:packages/element/src/bounds.ts","to":"file:packages/element/src/utils.ts","weight":1},{"from":"file:packages/element/src/bounds.ts","to":"file:packages/element/src/collision.ts","weight":1},{"from":"file:packages/element/src/bucketFill.ts","to":"file:packages/element/src/bounds.ts","weight":1},{"from":"file:packages/element/src/bucketFill.ts","to":"file:packages/element/src/collision.ts","weight":1},{"from":"file:packages/element/src/bucketFill.ts","to":"file:packages/element/src/distance.ts","weight":1},{"from":"file:packages/element/src/bucketFill.ts","to":"file:packages/element/src/utils.ts","weight":1},{"from":"file:packages/element/src/collision.ts","to":"file:packages/element/src/utils.ts","weight":1},{"from":"file:packages/element/src/collision.ts","to":"file:packages/element/src/bounds.ts","weight":1},{"from":"file:packages/element/src/collision.ts","to":"file:packages/element/src/distance.ts","weight":1},{"from":"file:packages/element/src/distance.ts","to":"file:packages/element/src/utils.ts","weight":1},{"from":"file:packages/element/src/distance.ts","to":"file:packages/element/src/bounds.ts","weight":1},{"from":"file:packages/element/src/sizeHelpers.ts","to":"file:packages/element/src/bounds.ts","weight":1},{"from":"file:packages/element/src/utils.ts","to":"file:packages/element/src/bounds.ts","weight":1},{"from":"file:packages/element/src/utils.ts","to":"file:packages/element/src/collision.ts","weight":1}]},{"id":"mod:packages/element:arrows-binding","label":"Arrows And Binding","kind":"module","path":"packages/element/src","weight":9763,"shortDescription":"Arrow binding to shapes, elbow routing, linear editing and flowcharts.","longDescription":"binding.ts attaches and detaches arrow endpoints to bindable elements using gap and distance rules. elbowArrow routes orthogonal arrows with heading math from heading.ts. LinearElementEditor handles point editing of lines and arrows, and the arrows folder handles focus-point dragging. Flowchart helpers create and navigate connected node graphs, and arrowEndpointText binds text labels to arrow endpoints.","children":[{"id":"file:packages/element/src/binding.ts","label":"binding","kind":"file","path":"packages/element/src/binding.ts","weight":3201,"shortDescription":"Binds and unbinds arrow endpoints to bindable shapes and keeps bound points updated.","longDescription":"Decides binding strategy while dragging arrow endpoints, computes binding gaps and fixed points, and binds or unbinds elements via mutateElement. Uses collision helpers for hover and binding-area tests, and delegates elbow arrow re-routing to updateElbowArrowPoints. Also reanchors bindings to shape outlines and handles bound text resizing on bound elements.","functions":["bindOrUnbindBindingElements()","getBindingStrategyForDraggingBindingElementEndpoints()","bindBindingElement()","unbindBindingElement()","getBindingGap()","reanchorBindingsToOutline()"],"children":[],"edges":[]},{"id":"file:packages/element/src/linearElementEditor.ts","label":"LinearElementEditor","kind":"file","path":"packages/element/src/linearElementEditor.ts","weight":2607,"shortDescription":"Stateful editor for selecting, dragging, adding and removing points on linear elements.","longDescription":"LinearElementEditor class holds per-selection editing state such as hovered point, clicked point and dragged focus binding. Handles point dragging with grid snapping and discrete angles, midpoint insertion on straight and curved segments, and coordinate conversion. Calls binding helpers to update bound endpoints and recompute fixed points during edits, and uses ShapeCache and curve math for hit testing.","functions":["LinearElementEditor","handlePointDragging()","updateBoundPoint()","isBindingEnabled()","getBindingStrategyForDraggingBindingElementEndpoints()","calculateFixedPointForNonElbowArrowBinding()"],"children":[],"edges":[]},{"id":"file:packages/element/src/elbowArrow.ts","label":"elbowArrow","kind":"file","path":"packages/element/src/elbowArrow.ts","weight":2226,"shortDescription":"Routes orthogonal elbow arrows around bound shapes using grid-based A* search.","longDescription":"Builds a sparse grid from padded element bounds and start/end headings, then runs A* with a BinaryHeap to find orthogonal paths. Supports user-fixed segments, snapping endpoints to element outlines via binding helpers, and validation of elbow point sets. Produces ElementUpdate objects rather than mutating directly.","functions":["updateElbowArrowPoints()","updateElbowArrowRoute()","validateElbowPoints()","BASE_PADDING"],"children":[],"edges":[]},{"id":"file:packages/element/src/heading.ts","label":"heading","kind":"file","path":"packages/element/src/heading.ts","weight":264,"shortDescription":"Defines cardinal heading vectors and computes headings from points or elements.","longDescription":"Provides the four axis-aligned Heading constants and helpers to convert vectors to headings, compare and flip them, and test orientation. headingForPointFromElement picks the exit side of a bindable shape using triangle tests, with special handling for diamonds. Used heavily by elbow routing and binding.","functions":["vectorToHeading()","headingForPoint()","headingForPointFromElement()","headingIsHorizontal()","compareHeading()","flipHeading()"],"children":[],"edges":[]},{"id":"file:packages/element/src/arrows/focus.ts","label":"focus points","kind":"file","path":"packages/element/src/arrows/focus.ts","weight":533,"shortDescription":"Handles visibility and pointer interaction for arrow binding focus points.","longDescription":"Manages the draggable focus point indicator on two-point non-elbow arrows bound to shapes. Pointer handlers hover, drag and release focus points, rebinding or unbinding to hovered elements and recalculating fixed points via binding helpers. Moves arrows above their bindable in z-order when needed.","functions":["isFocusPointVisible()","handleFocusPointDrag()","handleFocusPointPointerDown()","handleFocusPointPointerUp()","handleFocusPointHover()"],"children":[],"edges":[]},{"id":"file:packages/element/src/flowchart.ts","label":"flowchart","kind":"file","path":"packages/element/src/flowchart.ts","weight":629,"shortDescription":"Creates and navigates flowchart nodes connected by elbow arrows.","longDescription":"FlowChartCreator generates new sibling nodes in a given direction, placing them in free intervals and connecting them with bound elbow arrows. FlowChartNavigator moves selection between linked nodes by direction. Relies on newElement factories, bindBindingElement, updateElbowArrowPoints and frame-bound checks.","functions":["FlowChartCreator","FlowChartNavigator","addNewNodes()","isNodeInFlowchart()"],"children":[],"edges":[]},{"id":"file:packages/element/src/arrowEndpointText.ts","label":"arrowEndpointText","kind":"file","path":"packages/element/src/arrowEndpointText.ts","weight":261,"shortDescription":"Anchors text labels to arrow endpoints without moving the arrow.","longDescription":"Finds unbound arrow endpoints under the cursor for the text tool and computes text bindings, alignment and anchors based on endpoint direction. App-side interaction lives in App.arrowText.ts, while generic binding bookkeeping stays in binding.ts. Uses headings to choose text alignment relative to the arrow tip.","functions":["getUnboundArrowEndpointAtPoint()","getTextBindingForArrowEndpoint()","isEndpointBoundText()","getEndpointBoundTextDragAnchor()"],"children":[],"edges":[]},{"id":"file:packages/element/src/arrows/helpers.ts","label":"arrow helpers","kind":"file","path":"packages/element/src/arrows/helpers.ts","weight":42,"shortDescription":"Dispatches in-progress arrow point or focus point drags on input events.","longDescription":"Single helper called from App on pointer or keyboard events so that modifier changes immediately refresh an ongoing drag. Routes to handleFocusPointDrag when a focus point is dragged, otherwise to LinearElementEditor.handlePointDragging for point drags. Returns whether the event was handled.","functions":["maybeHandleArrowPointlikeDrag()"],"children":[],"edges":[]}],"edges":[{"from":"file:packages/element/src/arrowEndpointText.ts","to":"file:packages/element/src/binding.ts","weight":1},{"from":"file:packages/element/src/arrowEndpointText.ts","to":"file:packages/element/src/heading.ts","weight":1},{"from":"file:packages/element/src/arrowEndpointText.ts","to":"file:packages/element/src/linearElementEditor.ts","weight":1},{"from":"file:packages/element/src/arrows/focus.ts","to":"file:packages/element/src/binding.ts","weight":1},{"from":"file:packages/element/src/arrows/focus.ts","to":"file:packages/element/src/linearElementEditor.ts","weight":1},{"from":"file:packages/element/src/arrows/helpers.ts","to":"file:packages/element/src/linearElementEditor.ts","weight":1},{"from":"file:packages/element/src/arrows/helpers.ts","to":"file:packages/element/src/arrows/focus.ts","weight":1},{"from":"file:packages/element/src/binding.ts","to":"file:packages/element/src/heading.ts","weight":1},{"from":"file:packages/element/src/binding.ts","to":"file:packages/element/src/linearElementEditor.ts","weight":1},{"from":"file:packages/element/src/binding.ts","to":"file:packages/element/src/elbowArrow.ts","weight":1},{"from":"file:packages/element/src/elbowArrow.ts","to":"file:packages/element/src/binding.ts","weight":1},{"from":"file:packages/element/src/elbowArrow.ts","to":"file:packages/element/src/heading.ts","weight":1},{"from":"file:packages/element/src/flowchart.ts","to":"file:packages/element/src/binding.ts","weight":1},{"from":"file:packages/element/src/flowchart.ts","to":"file:packages/element/src/elbowArrow.ts","weight":1},{"from":"file:packages/element/src/flowchart.ts","to":"file:packages/element/src/linearElementEditor.ts","weight":1},{"from":"file:packages/element/src/linearElementEditor.ts","to":"file:packages/element/src/binding.ts","weight":1},{"from":"file:packages/element/src/linearElementEditor.ts","to":"file:packages/element/src/heading.ts","weight":1}]},{"id":"mod:packages/element:text","label":"Text Layout","kind":"module","path":"packages/element/src","weight":1537,"shortDescription":"Text measurement, wrapping and positioning of text bound to containers.","longDescription":"Measures text with canvas metrics and line heights, wraps text with token parsing that handles CJK, and positions bound text inside its container. Caches original container heights so containers can grow and shrink back during editing. Text resizing is coordinated with resizeElements.","children":[{"id":"file:packages/element/src/textElement.ts","label":"textElement","kind":"file","path":"packages/element/src/textElement.ts","weight":570,"shortDescription":"Positions, resizes and binds text elements to their containers and arrows.","longDescription":"Recomputes bound text bounding boxes after edits, resizes containers to fit wrapped text, and calculates label positions inside shapes or along arrows. Delegates measurement to textMeasurements and wrapping to textWrapping, special-cases sticky notes via updateStickyNoteLayout, and uses containerCache to remember original container heights during resize. Also exposes lookup helpers for container/text relationships and alignment support checks.","functions":["redrawTextBoundingBox()","handleBindTextResize()","computeBoundTextPosition()","getBoundTextElement()","getContainerElement()","computeContainerDimensionForBoundText()"],"children":[],"edges":[]},{"id":"file:packages/element/src/textMeasurements.ts","label":"textMeasurements","kind":"file","path":"packages/element/src/textMeasurements.ts","weight":255,"shortDescription":"Measures text width, height and line metrics for given fonts.","longDescription":"Computes text dimensions from font strings and line heights, replacing empty lines with spaces so they count toward height. Width measurement goes through a pluggable TextMetricsProvider (set via setCustomTextMetricsProvider) and an optional RenderEnvironment, allowing non-canvas or test backends. Provides minimum width/height approximations for containers and character-width helpers used by textWrapping.","functions":["measureText()","getTextWidth()","getTextHeight()","getLineWidth()","getApproxMinLineWidth()","setCustomTextMetricsProvider()"],"children":[],"edges":[]},{"id":"file:packages/element/src/textWrapping.ts","label":"textWrapping","kind":"file","path":"packages/element/src/textWrapping.ts","weight":683,"shortDescription":"Soft-wraps text into lines approximating browser line-breaking behavior.","longDescription":"Splits hard lines into breakable tokens with a unicode-aware regex (falling back to a simpler regex when unsupported), handling CJK and emoji. Assembles tokens into width-constrained visual lines, breaks overlong words, and trims trailing whitespace like browsers do. getWrappedTextLines() additionally maps visual lines back to source offsets for caret placement. Regexes are lazily built and cached; widths come from textMeasurements.","functions":["wrapText()","getWrappedTextLines()","parseTokens()","containsCJK()"],"children":[],"edges":[]},{"id":"file:packages/element/src/containerCache.ts","label":"containerCache","kind":"file","path":"packages/element/src/containerCache.ts","weight":29,"shortDescription":"Module-level cache of text containers' original heights keyed by id.","longDescription":"Holds a plain mutable object mapping container ids to their pre-growth height, so containers can shrink back after bound text is reduced. Updated and reset by textElement during text binding and resize; read when restoring container dimensions. Kept as a separate module-level singleton rather than element state.","functions":["updateOriginalContainerCache()","resetOriginalContainerCache()","getOriginalContainerHeightFromCache()","originalContainerCache"],"children":[],"edges":[]}],"edges":[{"from":"file:packages/element/src/textElement.ts","to":"file:packages/element/src/containerCache.ts","weight":1},{"from":"file:packages/element/src/textElement.ts","to":"file:packages/element/src/textMeasurements.ts","weight":1},{"from":"file:packages/element/src/textElement.ts","to":"file:packages/element/src/textWrapping.ts","weight":1},{"from":"file:packages/element/src/textWrapping.ts","to":"file:packages/element/src/textMeasurements.ts","weight":1}]},{"id":"mod:packages/element:transforms","label":"Interactive Transforms","kind":"module","path":"packages/element/src","weight":3784,"shortDescription":"Dragging, resizing, rotating, cropping, aligning and distributing elements from user input.","longDescription":"Turns pointer input into element changes. That covers dragging new and selected elements, transform handles and resize hit-tests, multi-element resize and rotate, and image cropping. Align, distribute and grid layout reposition selections. convertToShape recognizes freehand strokes and replaces them with shapes. Arrow bindings are updated as elements move.","children":[{"id":"file:packages/element/src/resizeElements.ts","label":"resizeElements","kind":"file","path":"packages/element/src/resizeElements.ts","weight":1481,"shortDescription":"Applies resize and rotate transforms to single or multiple selected elements.","longDescription":"Entry point transformElements dispatches pointer-driven rotation and resizing for single elements, text, sticky notes and multi-selections. Handles aspect-ratio locking, resize-from-center, flipping, font scaling for text, and point rescaling for linear elements. Keeps bound text and arrow bindings in sync via binding and textElement helpers, and mutates elements through the Scene.","functions":["transformElements()","resizeSingleElement()","resizeMultipleElements()","resizeSingleTextElement()","getNextSingleWidthAndHeightFromPointer()","rescalePointsInElement()"],"children":[],"edges":[]},{"id":"file:packages/element/src/transformHandles.ts","label":"transformHandles","kind":"file","path":"packages/element/src/transformHandles.ts","weight":324,"shortDescription":"Computes positions of resize and rotation handles around elements or selections.","longDescription":"Defines handle direction types and generates rotated handle rectangles from element coordinates, zoom and pointer type (mouse, pen, touch sizes). Omit-side presets hide side handles for multi-selection, frames, and lines by slope. Decides per editor interface whether side resizing is allowed and whether an element shows a bounding box.","functions":["getTransformHandles()","getTransformHandlesFromCoords()","getOmitSidesForEditorInterface()","canResizeFromSides()","hasBoundingBox()"],"children":[],"edges":[]},{"id":"file:packages/element/src/convertToShape.ts","label":"convertToShape","kind":"file","path":"packages/element/src/convertToShape.ts","weight":739,"shortDescription":"Recognizes freehand strokes and converts them into rectangles, ellipses, diamonds, arrows or lines.","longDescription":"A moment-based recognizer computes convex hull, principal axes, elongation, skewness and kurtosis of drawn points to classify the stroke. Rectangle vs. diamond is deliberately not rotation invariant. The converter builds replacement elements with newElement/newLinearElement, respects frames and adaptive roundness, and offers a pointer-move handler for live conversion previews.","functions":["recognizeShape()","convertToShape()","convertToShapeHandlePointerMoveFromPointerDown()"],"children":[],"edges":[]},{"id":"file:packages/element/src/cropElement.ts","label":"cropElement","kind":"file","path":"packages/element/src/cropElement.ts","weight":319,"shortDescription":"Crops image elements by dragging transform handles, within the image's natural bounds.","longDescription":"Reuses resize math from getNextSingleWidthAndHeightFromPointer to compute the new size, then converts it into an ImageCrop rectangle in natural-image pixels, clamped to the image and a minimal crop size. Supports aspect-ratio locking, center anchoring and flipped images. Helpers restore uncropped dimensions and remove crop from given sides.","functions":["cropElement()","uncropElementSides()","getUncroppedImageElement()","getUncroppedWidthAndHeight()","getFlipAdjustedCropPosition()"],"children":[],"edges":[]},{"id":"file:packages/element/src/dragElements.ts","label":"dragElements","kind":"file","path":"packages/element/src/dragElements.ts","weight":390,"shortDescription":"Moves selected elements by drag offsets and sizes newly drawn elements.","longDescription":"dragSelectedElements translates the selection with grid and snap offsets, skipping bound elbow arrows, moving frame children and bound text, and updating or unbinding arrow bindings. dragNewElement and dragNewTextElement size elements being created, applying shift-constrained perfect sizes, center-out drawing and text autowrap thresholds.","functions":["dragSelectedElements()","getDragOffsetXY()","dragNewElement()","dragNewTextElement()"],"children":[],"edges":[]},{"id":"file:packages/element/src/resizeTest.ts","label":"resizeTest","kind":"file","path":"packages/element/src/resizeTest.ts","weight":265,"shortDescription":"Hit-tests pointer coordinates against transform handles and picks resize cursors.","longDescription":"Determines which transform handle, rotation handle or side edge lies under the pointer for a selected element or a multi-selection bounding box, using side resizing thresholds and editor interface rules. Maps handle types to CSS resize cursors adjusted for element rotation.","functions":["resizeTest()","getElementWithTransformHandleType()","getTransformHandleTypeFromCoords()","getCursorForResizingElement()"],"children":[],"edges":[]},{"id":"file:packages/element/src/distribute.ts","label":"distribute","kind":"file","path":"packages/element/src/distribute.ts","weight":96,"shortDescription":"Spaces selected element groups evenly along the x or y axis.","longDescription":"Groups the selection with getSelectedElementsByGroup, sorts groups by center, and distributes equal gaps across the common bounding box. When groups overlap so the gap is negative, falls back to distributing by centers between the extreme groups. Mutates via the Scene and updates bound arrows.","functions":["distributeElements()","Distribution"],"children":[],"edges":[]},{"id":"file:packages/element/src/positionElementsOnGrid.ts","label":"positionElementsOnGrid","kind":"file","path":"packages/element/src/positionElementsOnGrid.ts","weight":95,"shortDescription":"Lays out elements or element groups in a roughly square grid around a center.","longDescription":"Treats each element or provided group as an atomic unit, chooses a column count near the square root of the unit count, computes row widths and heights from common bounds, and centers the grid on the given point with padding. Returns new element copies via newElementWith; marked as a rewrite candidate.","functions":["positionElementsOnGrid()"],"children":[],"edges":[]},{"id":"file:packages/element/src/align.ts","label":"align","kind":"file","path":"packages/element/src/align.ts","weight":75,"shortDescription":"Aligns selected element groups to the start, center or end of the selection.","longDescription":"Groups selected elements, computes the selection's common bounding box, and translates each group along the chosen axis so its box aligns to start, center or end. Applies moves through scene.mutateElement and refreshes bound arrows with updateBoundElements.","functions":["alignElements()","Alignment"],"children":[],"edges":[]}],"edges":[{"from":"file:packages/element/src/cropElement.ts","to":"file:packages/element/src/resizeElements.ts","weight":1},{"from":"file:packages/element/src/cropElement.ts","to":"file:packages/element/src/transformHandles.ts","weight":1},{"from":"file:packages/element/src/resizeElements.ts","to":"file:packages/element/src/transformHandles.ts","weight":1},{"from":"file:packages/element/src/resizeTest.ts","to":"file:packages/element/src/transformHandles.ts","weight":1}]},{"id":"mod:packages/element:rendering","label":"Rendering","kind":"module","path":"packages/element/src","weight":2702,"shortDescription":"Generates and caches rough shapes and draws elements onto canvas.","longDescription":"ShapeCache stores roughjs drawables generated per element version, including freedraw polygons and rounded elbow arrows. renderElement resolves render state and offsets, keeps per-element offscreen canvases, and draws to canvas or SVG. renderEnvironment hides differences between browser and non-browser Path2D implementations.","children":[{"id":"file:packages/element/src/renderEnvironment.ts","label":"renderEnvironment","kind":"file","path":"packages/element/src/renderEnvironment.ts","weight":115,"shortDescription":"Defines the host environment abstraction for canvas, image, and path creation.","longDescription":"Declares the RenderEnvironment type with createCanvas, createImage, optional Path2D factory, and DOM document used for SVG export. Defaults to the browser, but renders and exports can pass an explicit environment to target popout windows, multi-tenant embeds, or Node hosts using node-canvas, @napi-rs/canvas, or linkedom. There is deliberately no process-wide override.","functions":["RenderEnvironment","getRenderEnvironment()","getCreatePath()"],"children":[],"edges":[]},{"id":"file:packages/element/src/shape.ts","label":"shape","kind":"file","path":"packages/element/src/shape.ts","weight":1296,"shortDescription":"Generates and caches roughjs drawables and geometric shapes for elements.","longDescription":"ShapeCache memoizes roughjs Drawables per element, built through RoughGenerator using options from generateRoughOptions, which covers roughness, fill, dark-mode colors, and corner radius. Also produces geometry for hit-testing (getElementShape, linear collision shapes) and elbow arrow paths with rounded corners. Freedraw outlines come from perfect-freehand, and line polygon toggling is handled here. Arrowhead points come from bounds.","functions":["ShapeCache","generateRoughOptions()","getElementShape()","generateElbowArrowShape()","generateLinearCollisionShape()","getFreedrawOutlinePoints()"],"children":[],"edges":[]},{"id":"file:packages/element/src/renderElement.ts","label":"renderElement","kind":"file","path":"packages/element/src/renderElement.ts","weight":1291,"shortDescription":"Draws individual elements onto canvas, using per-element offscreen canvas caching.","longDescription":"Renders each element type (shapes, text, images, freedraw, frames, sticky notes, bound text) onto a 2D context. Elements are pre-rendered to cached offscreen canvases keyed by zoom and theme, using elementWithCanvasCache. Handles opacity and erase states, dark-mode filters, image cropping, render offsets, and position overrides. Uses ShapeCache drawables via roughjs, and creates canvases through the RenderEnvironment.","functions":["renderElement()","elementWithCanvasCache","renderSelectionElement()","resolveElementRenderState()","getRenderElementWithPositionOverride()","withSavedContext()"],"children":[],"edges":[]}],"edges":[{"from":"file:packages/element/src/renderElement.ts","to":"file:packages/element/src/renderEnvironment.ts","weight":1},{"from":"file:packages/element/src/renderElement.ts","to":"file:packages/element/src/shape.ts","weight":1},{"from":"file:packages/element/src/shape.ts","to":"file:packages/element/src/renderElement.ts","weight":1}]}],"edges":[{"from":"mod:packages/element:scene-history","to":"mod:packages/element:element-model","weight":26},{"from":"mod:packages/element:arrows-binding","to":"mod:packages/element:element-model","weight":21},{"from":"mod:packages/element:transforms","to":"mod:packages/element:element-model","weight":20},{"from":"mod:packages/element:element-model","to":"mod:packages/element:scene-history","weight":18},{"from":"mod:packages/element:geometry","to":"mod:packages/element:element-model","weight":16},{"from":"mod:packages/element:element-model","to":"mod:packages/element:text","weight":15},{"from":"mod:packages/element:element-model","to":"mod:packages/element:arrows-binding","weight":13},{"from":"mod:packages/element:arrows-binding","to":"mod:packages/element:geometry","weight":12},{"from":"mod:packages/element:element-model","to":"mod:packages/element:rendering","weight":11},{"from":"mod:packages/element:transforms","to":"mod:packages/element:geometry","weight":10},{"from":"mod:packages/element:element-model","to":"mod:packages/element:transforms","weight":10},{"from":"mod:packages/element:element-model","to":"mod:packages/element:geometry","weight":9},{"from":"mod:packages/element:transforms","to":"mod:packages/element:scene-history","weight":8},{"from":"mod:packages/element:text","to":"mod:packages/element:element-model","weight":7},{"from":"mod:packages/element:transforms","to":"mod:packages/element:arrows-binding","weight":6},{"from":"mod:packages/element:arrows-binding","to":"mod:packages/element:scene-history","weight":6},{"from":"mod:packages/element:rendering","to":"mod:packages/element:element-model","weight":6},{"from":"mod:packages/element:scene-history","to":"mod:packages/element:text","weight":5},{"from":"mod:packages/element:transforms","to":"mod:packages/element:text","weight":5},{"from":"mod:packages/element:rendering","to":"mod:packages/element:geometry","weight":5},{"from":"mod:packages/element:transforms","to":"mod:packages/element:rendering","weight":4},{"from":"mod:packages/element:geometry","to":"mod:packages/element:rendering","weight":4},{"from":"mod:packages/element:geometry","to":"mod:packages/element:arrows-binding","weight":4},{"from":"mod:packages/element:arrows-binding","to":"mod:packages/element:rendering","weight":3},{"from":"mod:packages/element:scene-history","to":"mod:packages/element:arrows-binding","weight":3},{"from":"mod:packages/element:scene-history","to":"mod:packages/element:geometry","weight":3},{"from":"mod:packages/element:rendering","to":"mod:packages/element:text","weight":3},{"from":"mod:packages/element:text","to":"mod:packages/element:rendering","weight":3},{"from":"mod:packages/element:arrows-binding","to":"mod:packages/element:text","weight":2},{"from":"mod:packages/element:geometry","to":"mod:packages/element:text","weight":2},{"from":"mod:packages/element:rendering","to":"mod:packages/element:arrows-binding","weight":2},{"from":"mod:packages/element:geometry","to":"mod:packages/element:scene-history","weight":1},{"from":"mod:packages/element:scene-history","to":"mod:packages/element:rendering","weight":1},{"from":"mod:packages/element:rendering","to":"mod:packages/element:transforms","weight":1},{"from":"mod:packages/element:rendering","to":"mod:packages/element:scene-history","weight":1},{"from":"mod:packages/element:text","to":"mod:packages/element:arrows-binding","weight":1},{"from":"mod:packages/element:text","to":"mod:packages/element:geometry","weight":1},{"from":"mod:packages/element:text","to":"mod:packages/element:scene-history","weight":1},{"from":"mod:packages/element:text","to":"mod:packages/element:transforms","weight":1}]},{"id":"pkg:packages/excalidraw","label":"Excalidraw Editor","kind":"package","path":"packages/excalidraw","packageName":"@excalidraw/excalidraw","weight":87079,"shortDescription":"Embeddable React whiteboard editor with drawing, rendering, export and collaboration hooks.","longDescription":"Exposes the Excalidraw React component and imperative API that host apps embed. Combines an App class split into feature mixins, an action system, canvas and SVG renderers, scene serialization and restore, a font subsetting pipeline, and AI/Mermaid diagram generation. State flows through appState plus Jotai atoms. Heavy work such as fonts and the minimap is offloaded to web workers.","children":[{"id":"mod:packages/excalidraw:editor-core","label":"Editor Core","kind":"module","path":"packages/excalidraw","weight":22809,"shortDescription":"Main App component, app state, history, public entry points and shared hooks.","longDescription":"App.tsx is the central class component. Feature-specific helper classes (App.selection, App.text, App.pan, App.viewport and others) carve out pointer, text, selection and viewport logic. Also holds the default appState, undo/redo history, global types, i18n, the Jotai store, React contexts and tunnels, reusable hooks, and the package entry points index.tsx and index-node.ts.","children":[{"id":"file:packages/excalidraw/types.ts","label":"types","kind":"file","path":"packages/excalidraw/types.ts","weight":1611,"shortDescription":"Central TypeScript type definitions for app state, props, tools, files and the imperative API.","longDescription":"Declares AppState and its canvas-specific projections (StaticCanvasAppState, InteractiveCanvasAppState), ExcalidrawProps, ExcalidrawImperativeAPI, collaborator, binary file and tool types. Pulls element types from @excalidraw/element and utility types from @excalidraw/common, and references App, Library, actions and clipboard types, making it the shared contract between the editor core and its consumers.","functions":["AppState","ExcalidrawProps","ExcalidrawImperativeAPI","ActiveTool","BinaryFiles","Collaborator"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/components/App.tsx","label":"App","kind":"file","path":"packages/excalidraw/components/App.tsx","weight":10489,"shortDescription":"Main editor class component handling input, rendering, state and the imperative API.","longDescription":"A ~10k-line React class component that owns scene, appState, history, action manager and event handling for pointer, keyboard, clipboard, drag-and-drop and text editing. Coordinates canvases, renderers, snapping and element mutations from @excalidraw/element. Exposes React contexts and hooks (useApp, useExcalidrawAppState, useExcalidrawActionManager, useExcalidrawAPI) consumed by UI subcomponents.","functions":["App","useApp()","useExcalidrawAppState()","useExcalidrawSetAppState()","useExcalidrawActionManager()","useExcalidrawAPI()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/i18n.ts","label":"i18n","kind":"file","path":"packages/excalidraw/i18n.ts","weight":153,"shortDescription":"Language list, locale loading and translation lookup with a React hook.","longDescription":"Defines supported languages filtered by translation completion percentage, lazily loads locale JSON and falls back to English data. Stores the current language in a jotai atom on editorJotaiStore so useI18n re-renders components on language change. t() resolves nested translation keys with placeholder replacement.","functions":["t()","setLanguage()","getLanguage()","useI18n()","languages","defaultLang"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/editor-jotai.ts","label":"editor-jotai","kind":"file","path":"packages/excalidraw/editor-jotai.ts","weight":15,"shortDescription":"Isolated jotai store and hooks scoped to the editor instance.","longDescription":"Wraps jotai with jotai-scope's createIsolation so editor atoms do not leak into a host app's jotai provider. Re-exports atom helpers and scoped useAtom/useSetAtom/useAtomValue hooks, plus a provider and a shared editorJotaiStore created via createStore. Other modules must import jotai through here, enforced by a lint rule.","functions":["EditorJotaiProvider","editorJotaiStore","useAtom()","useSetAtom()","useAtomValue()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/appState.ts","label":"appState","kind":"file","path":"packages/excalidraw/appState.ts","weight":351,"shortDescription":"Default app state and helpers to filter state for storage, export and database.","longDescription":"getDefaultAppState builds the initial editor state from @excalidraw/common defaults, resolving export scale lazily so the module stays importable outside browsers. A per-key config drives cleaning functions that strip transient fields for localStorage, export files or database persistence. Also provides small tool-state predicates and input device resolution.","functions":["getDefaultAppState()","clearAppStateForLocalStorage()","cleanAppStateForExport()","clearAppStateForDatabase()","isEraserActive()","isHandToolActive()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/context/ui-appState.ts","label":"ui-appState","kind":"file","path":"packages/excalidraw/context/ui-appState.ts","weight":4,"shortDescription":"React context and hook exposing UI-relevant app state to components.","longDescription":"Creates UIAppStateContext holding the UIAppState subset provided by App, and useUIAppState to read it. Lets UI components subscribe to state without depending on the full App instance.","functions":["UIAppStateContext","useUIAppState()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/analytics.ts","label":"analytics","kind":"file","path":"packages/excalidraw/analytics.ts","weight":43,"shortDescription":"Guarded event tracking forwarded to the Simple Analytics global.","longDescription":"trackEvent sends events to window.sa_event only when tracking is enabled via env flags, not in workers or dev, and the category is in a small allowlist (command_palette, export, ai). Errors are caught and logged so analytics never breaks the editor.","functions":["trackEvent()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/index.tsx","label":"index","kind":"file","path":"packages/excalidraw/index.tsx","weight":513,"shortDescription":"Public package entry exporting the Excalidraw component, provider, hooks and utilities.","longDescription":"Wraps App in ExcalidrawBase, merging default UI options and props, initializing i18n via InitializeApp and the scoped jotai provider, and applying the polyfill and global styles. A memo comparator avoids re-rendering on unchanged props. ExcalidrawAPIProvider lets useExcalidrawAPI and state hooks work outside the editor tree; also re-exports MainMenu, WelcomeScreen, Footer and other public APIs.","functions":["Excalidraw","ExcalidrawAPIProvider","useExcalidrawStateValue()","useAppStateValue()","useOnAppStateChange()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/components/App.selection.ts","label":"App.selection","kind":"file","path":"packages/excalidraw/components/App.selection.ts","weight":702,"shortDescription":"Selection state computation for elements and groups, extracted from App.","longDescription":"Provides memoized selectGroupsForSelectedElements, which derives selectedGroupIds and editingGroupId from selected elements, plus helpers to build selection state when setting, adding or removing elements. The AppSelection class encapsulates App-bound selection operations using bounds, group and linear-editor utilities from @excalidraw/element.","functions":["selectGroupsForSelectedElements()","getSelectionStateForElements()","getSelectionStateAddingElements()","getSelectionStateRemovingElements()","AppSelection"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/shortcut.ts","label":"shortcut","kind":"file","path":"packages/excalidraw/shortcut.ts","weight":17,"shortDescription":"Formats shortcut strings into localized, platform-specific key labels.","longDescription":"getShortcutKey rewrites tokens like Ctrl/Cmd, Alt/Option, Shift, Enter, Escape, Space and Delete via regex into translated labels from i18n, choosing macOS or other variants based on isDarwin.","functions":["getShortcutKey()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/errors.ts","label":"errors","kind":"file","path":"packages/excalidraw/errors.ts","weight":81,"shortDescription":"Custom error classes for canvas, abort, image scene data, worker and requests.","longDescription":"Defines typed Error subclasses with names and codes so callers can discriminate failures: CanvasError for export issues, AbortError as a DOMException, ImageSceneDataError for embedded scene decoding, worker setup errors, a generic ExcalidrawError for handled cases, and RequestError carrying HTTP status and data.","functions":["CanvasError","AbortError","ImageSceneDataError","ExcalidrawError","RequestError","WorkerUrlNotDefinedError"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/context/tunnels.ts","label":"tunnels","kind":"file","path":"packages/excalidraw/context/tunnels.ts","weight":39,"shortDescription":"tunnel-rat portals letting user-supplied children render into editor UI slots.","longDescription":"Defines TunnelsContext with named tunnels for main menu, welcome screen hints, footer, sidebar triggers, overwrite dialog and TTD dialog. useInitializeTunnels memoizes one set per editor instance, and includes a separate jotai isolation for tunnel state, noted as a workaround until per-editor jotai stores exist.","functions":["useInitializeTunnels()","useTunnels()","TunnelsContext","Tunnel"],"children":[],"edges":[]},{"id":"more:packages/excalidraw:editor-core","label":"+37 more files","kind":"file","path":"packages/excalidraw/components","weight":1758,"shortDescription":"37 smaller files in this module.","longDescription":"App.selectionTool.ts, App.text.ts, reactUtils.ts, App.viewport.ts, useLibraryItemSvg.ts, App.clipboard.ts, history.ts, App.duplicate.ts, useAppStateValue.ts, App.textTool.ts, App.wrap.ts, useTextEditorFocus.ts, App.bucketFill.ts, App.pan.ts, App.toolDrag.ts, App.drawshape.ts, useOutsideClick.ts, App.cursor.ts, App.host.ts, App.arrowText.ts, AppStateObserver.ts, polyfill.ts, App.flowchart.ts, App.wheel.ts, deburr.ts, useStable.ts, workers.ts, useCopiedIndicator.ts, useCreatePortalContainer.ts, App.modifiers.ts, useCallbackRefState.ts, index-node.ts, useScrollPosition.ts, useEmitter.ts, useStableCallback.ts, useTransition.ts, env.cjs","functions":[],"children":[],"edges":[]}],"edges":[{"from":"file:packages/excalidraw/components/App.tsx","to":"more:packages/excalidraw:editor-core","weight":20},{"from":"more:packages/excalidraw:editor-core","to":"file:packages/excalidraw/components/App.tsx","weight":18},{"from":"more:packages/excalidraw:editor-core","to":"file:packages/excalidraw/types.ts","weight":17},{"from":"more:packages/excalidraw:editor-core","to":"file:packages/excalidraw/editor-jotai.ts","weight":4},{"from":"more:packages/excalidraw:editor-core","to":"file:packages/excalidraw/appState.ts","weight":4},{"from":"more:packages/excalidraw:editor-core","to":"file:packages/excalidraw/i18n.ts","weight":3},{"from":"more:packages/excalidraw:editor-core","to":"file:packages/excalidraw/components/App.selection.ts","weight":3},{"from":"file:packages/excalidraw/index.tsx","to":"more:packages/excalidraw:editor-core","weight":2},{"from":"file:packages/excalidraw/appState.ts","to":"file:packages/excalidraw/types.ts","weight":1},{"from":"more:packages/excalidraw:editor-core","to":"file:packages/excalidraw/shortcut.ts","weight":1},{"from":"file:packages/excalidraw/components/App.selection.ts","to":"file:packages/excalidraw/types.ts","weight":1},{"from":"file:packages/excalidraw/components/App.selection.ts","to":"file:packages/excalidraw/components/App.tsx","weight":1},{"from":"more:packages/excalidraw:editor-core","to":"file:packages/excalidraw/analytics.ts","weight":1},{"from":"file:packages/excalidraw/components/App.tsx","to":"file:packages/excalidraw/analytics.ts","weight":1},{"from":"file:packages/excalidraw/components/App.tsx","to":"file:packages/excalidraw/appState.ts","weight":1},{"from":"file:packages/excalidraw/components/App.tsx","to":"file:packages/excalidraw/i18n.ts","weight":1},{"from":"file:packages/excalidraw/components/App.tsx","to":"file:packages/excalidraw/editor-jotai.ts","weight":1},{"from":"file:packages/excalidraw/components/App.tsx","to":"file:packages/excalidraw/errors.ts","weight":1},{"from":"file:packages/excalidraw/components/App.tsx","to":"file:packages/excalidraw/shortcut.ts","weight":1},{"from":"file:packages/excalidraw/components/App.tsx","to":"file:packages/excalidraw/components/App.selection.ts","weight":1},{"from":"file:packages/excalidraw/components/App.tsx","to":"file:packages/excalidraw/types.ts","weight":1},{"from":"file:packages/excalidraw/context/ui-appState.ts","to":"file:packages/excalidraw/types.ts","weight":1},{"from":"more:packages/excalidraw:editor-core","to":"file:packages/excalidraw/context/ui-appState.ts","weight":1},{"from":"file:packages/excalidraw/i18n.ts","to":"file:packages/excalidraw/editor-jotai.ts","weight":1},{"from":"file:packages/excalidraw/index.tsx","to":"file:packages/excalidraw/components/App.tsx","weight":1},{"from":"file:packages/excalidraw/index.tsx","to":"file:packages/excalidraw/i18n.ts","weight":1},{"from":"file:packages/excalidraw/index.tsx","to":"file:packages/excalidraw/editor-jotai.ts","weight":1},{"from":"file:packages/excalidraw/index.tsx","to":"file:packages/excalidraw/types.ts","weight":1},{"from":"file:packages/excalidraw/shortcut.ts","to":"file:packages/excalidraw/i18n.ts","weight":1},{"from":"file:packages/excalidraw/types.ts","to":"file:packages/excalidraw/components/App.tsx","weight":1},{"from":"file:packages/excalidraw/types.ts","to":"file:packages/excalidraw/i18n.ts","weight":1},{"from":"more:packages/excalidraw:editor-core","to":"file:packages/excalidraw/errors.ts","weight":1}]},{"id":"mod:packages/excalidraw:actions","label":"Actions","kind":"module","path":"packages/excalidraw/actions","weight":8600,"shortDescription":"Registered editor commands for editing, styling, arranging, exporting and toggling modes.","longDescription":"Each action declares a perform function that returns element and appState updates, plus optional keyboard predicates and PanelComponents. ActionManager registers actions, dispatches them from keyboard, UI and the API, and renders their panels. Covers alignment, grouping, z-index, clipboard, properties, frames, history, export and view toggles. Shortcut names map actions to their key bindings.","children":[{"id":"file:packages/excalidraw/actions/register.ts","label":"register","kind":"file","path":"packages/excalidraw/actions/register.ts","weight":13,"shortDescription":"Global registry that collects every action definition as it is declared.","longDescription":"Holds a module-level readonly `actions` array that each action file appends to by calling `register()` at import time. `register()` returns the action unchanged but narrows its `keyTest` type so callers can tell whether a keyboard handler exists. The ActionManager and command palette read the accumulated list.","functions":["register()","actions"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/actions/actionProperties.tsx","label":"actionProperties","kind":"file","path":"packages/excalidraw/actions/actionProperties.tsx","weight":2174,"shortDescription":"Style-changing actions for colors, stroke, fill, opacity, fonts, alignment and arrows.","longDescription":"Defines the property panel actions: stroke and background color, bucket fill, fill style, stroke width and style, sloppiness, opacity, font size and family, text alignment, and arrowheads and arrow types. Shared helpers `changeProperty()` and `getFormValue()` apply an update to the selected elements or read their common value. Text and arrow changes recompute bound text boxes, elbow arrow routes and bindings through @excalidraw/element.","functions":["changeProperty()","getFormValue()","actionChangeStrokeColor","actionChangeBackgroundColor","actionChangeFontFamily","actionChangeFontSize"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/actions/index.ts","label":"actions index","kind":"file","path":"packages/excalidraw/actions/index.ts","weight":82,"shortDescription":"Barrel file re-exporting the public action objects from the individual action modules.","longDescription":"Re-exports the actions for deletion, z-index, selection, duplication, properties, canvas, export, styles, grouping, navigation, library, alignment, distribution and flipping. Consumers import the actions from one place. Importing it also runs each module's `register()` side effect, which fills the global action list.","functions":["actionDeleteSelected","actionChangeStrokeColor","actionClearCanvas","actionGroup","actionAlignTop","actionFlipHorizontal"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/actions/types.ts","label":"action types","kind":"file","path":"packages/excalidraw/actions/types.ts","weight":216,"shortDescription":"Type contracts for actions, their results, sources, names and panel components.","longDescription":"Declares the `Action` interface, which has a name, label, `perform`, an optional `keyTest`, a predicate, `PanelComponent` and trackEvent. It also declares `ActionResult`, which holds optional elements, appState and files plus a required `captureUpdate` mode, or `false` to cancel. The `ActionName` string union lists every known command, and `ActionSource` records where an invocation came from (ui, keyboard, contextMenu, api, commandPalette).","functions":["Action","ActionResult","ActionName","ActionSource","PanelComponentProps","UpdaterFn"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/actions/manager.tsx","label":"ActionManager","kind":"file","path":"packages/excalidraw/actions/manager.tsx","weight":211,"shortDescription":"Executes registered actions from keyboard, UI and API, and renders their panels.","longDescription":"`ActionManager` keeps actions keyed by name. It matches keydown events through each action's `keyTest` and predicate, and runs `perform` with the current elements, appState and app. It passes results, including Promise results, to the App's updater. `renderAction` mounts an action's `PanelComponent` with an `updateData` callback. `trackAction` sends analytics tagged with the source and the device form factor.","functions":["ActionManager","handleKeyDown()","executeAction()","renderAction()","registerAll()","trackAction()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/actions/shortcuts.ts","label":"shortcuts","kind":"file","path":"packages/excalidraw/actions/shortcuts.ts","weight":122,"shortDescription":"Maps action and UI shortcut names to platform-specific keyboard shortcut labels.","longDescription":"Defines `ShortcutName` as a subset of `ActionName` plus a few extra UI commands such as saveScene, imageExport and commandPalette. `shortcutMap` builds display strings with `getShortcutKey`, and some entries have alternatives that differ on Darwin. `getShortcutFromShortcutName()` returns the primary shortcut string for tooltips, menus and the help dialog.","functions":["getShortcutFromShortcutName()","ShortcutName"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/actions/actionExport.tsx","label":"actionExport","kind":"file","path":"packages/excalidraw/actions/actionExport.tsx","weight":424,"shortDescription":"Actions for project name, export options, saving to file and loading scenes.","longDescription":"Registers actions for project naming, export scale, background, embed-scene and dark-mode export toggles, each with its own panel UI such as ProjectName, CheckboxItem or DarkModeToggle. `actionSaveToActiveFile` and `actionSaveFileToDisk` call `saveAsJSON`, or `resaveAsImageWithScene` when the file handle is an image. `actionLoadScene` uses `loadFromJSON`. Export-option changes are captured with EVENTUALLY so they do not create undo steps.","functions":["actionChangeProjectName","actionChangeExportBackground","actionSaveToActiveFile","actionSaveFileToDisk","actionLoadScene","actionExportWithDarkMode"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/actions/actionCanvas.tsx","label":"actionCanvas","kind":"file","path":"packages/excalidraw/actions/actionCanvas.tsx","weight":461,"shortDescription":"Canvas-level actions: background color, clear canvas, zoom controls and theme toggle.","longDescription":"Defines the view background color picker, clearing the canvas back to the default app state, and zoom in, zoom out, reset and fit actions. The zoom actions use `getNormalizedZoom` and the viewport helpers, which respect scroll constraints. `zoomToFitBounds` handles fitting all elements or only the selection. `actionToggleTheme` switches between light and dark. Predicates honor the `UIOptions.canvasActions` setting and view mode.","functions":["actionChangeViewBackgroundColor","actionClearCanvas","actionZoomIn","actionZoomToFit","actionZoomToFitSelection","actionToggleTheme"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/actions/actionBoundText.tsx","label":"actionBoundText","kind":"file","path":"packages/excalidraw/actions/actionBoundText.tsx","weight":401,"shortDescription":"Binds, unbinds and wraps text inside shape containers, including sticky notes.","longDescription":"Implements the bind-text and unbind-text actions. Unbinding keeps the text wrapped as it was rendered and restores the container's original height from cache. `actionWrapTextInContainer` creates a new container around selected text. Z-order helpers keep the text above its container and fix indices with `syncMovedIndices`. Sticky-note layout and font normalization come from @excalidraw/element.","functions":["actionBindText","actionUnbindText","actionWrapTextInContainer","bindTextToContainer()","unbindTextFromContainer()","wrapTextsInContainers()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/actions/actionFrame.ts","label":"actionFrame","kind":"file","path":"packages/excalidraw/actions/actionFrame.ts","weight":329,"shortDescription":"Frame actions: select or remove children, toggle rendering, wrap and unwrap selections.","longDescription":"Provides actions that select all elements inside a frame, detach all of a frame's children, and toggle frame rendering. `actionWrapSelectionInFrame` uses `wrapInFrame()` to create a frame sized to the selection's common bounds. `unwrapFrame()` and `getFrameToUnwrap()` dissolve a frame while keeping its children and fixing bindings. Grouping and z-order index sync are handled through @excalidraw/element helpers.","functions":["actionSelectAllElementsInFrame","actionRemoveAllElementsFromFrame","actionWrapSelectionInFrame","wrapInFrame()","unwrapFrame()","getFrameToUnwrap()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/actions/colorTargets.ts","label":"colorTargets","kind":"file","path":"packages/excalidraw/actions/colorTargets.ts","weight":174,"shortDescription":"Resolves which color domain, palette and defaults a stroke or background pick targets.","longDescription":"Sticky notes have their own color domain, with separate defaults and top picks and no transparent option. `resolveColorTarget()` inspects the selection, the editing text and the active tool. It classifies the pick as regular, sticky or mixed, and returns the palette, top picks, current value and the appState keys to write. `getColorTargetAppStateUpdates()` writes the normalized current-item defaults for each affected domain.","functions":["resolveColorTarget()","getColorTargetAppStateUpdates()","ColorTarget","ColorTargetKind"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/actions/actionClipboard.tsx","label":"actionClipboard","kind":"file","path":"packages/excalidraw/actions/actionClipboard.tsx","weight":268,"shortDescription":"Clipboard actions for copy, cut, paste, copy as PNG or SVG, and copy text.","longDescription":"`actionCopy` serializes the selected elements, including bound text and frame children, through `copyToClipboard`. `actionCut` copies and then calls `actionDeleteSelected`. `actionPaste` reads the system clipboard and dispatches a synthetic paste event. The PNG and SVG copy actions go through `exportCanvas` and depend on browser clipboard support checks. Copy and paste leave `keyTest` undefined because App handles the native clipboard events directly.","functions":["actionCopy","actionCut","actionPaste","actionCopyAsPng","actionCopyAsSvg","copyText"],"children":[],"edges":[]},{"id":"more:packages/excalidraw:actions","label":"+33 more files","kind":"file","path":"packages/excalidraw/actions","weight":745,"shortDesc down menus, dialogs, popovers and buttons. Composable slots like MainMenu and WelcomeScreen are exposed to host apps.","children":[{"id":"file:packages/excalidraw/components/icons.tsx","label":"icons","kind":"file","path":"packages/excalidraw/components/icons.tsx","weight":2377,"shortDescription":"Central library of SVG icon components used throughout the editor UI.","longDescription":"Defines hundreds of icons as React SVG elements built through createIcon(), with shared prop presets for Tabler-style and arrowhead-preview icons. Icons use currentColor and CSS variables for theming, and support an rtl-mirror class for right-to-left layouts. Also includes welcome-screen arrow illustrations and lock/library/plus glyphs.","functions":["createIcon()","iconFillColor()","LibraryIcon","LockedIcon","PlusIcon","WelcomeScreenMenuArrow"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/components/IconButton.tsx","label":"IconButton","kind":"file","path":"packages/excalidraw/components/IconButton.tsx","weight":183,"shortDescription":"Generic icon button supporting plain, icon and toggle variants with loading state.","longDescription":"Renders tool-style buttons from a discriminated union of props: regular buttons, icon-only buttons, and stateful toggle buttons. Toggle variants capture pointerType on pointer-down to report reliable activation data via onSelect. Handles promise-returning click handlers by showing a Spinner and ignoring AbortError, and shares styling with ToolIcon.scss.","functions":["IconButton()","IconButtonSize"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/components/Stats/DragInput.tsx","label":"Stats DragInput","kind":"file","path":"packages/excalidraw/components/Stats/DragInput.tsx","weight":364,"shortDescription":"Numeric stats input that edits element properties by typing or dragging.","longDescription":"Provides the draggable number field used in the Stats panel for x, y, width, height, angle, font size and grid step. Pointer drags accumulate deltas and invoke a property-specific dragInputCallback with original element snapshots, scene, app and setAppState; a finish callback commits history via CaptureUpdateAction. Supports step-size snapping, aspect-ratio locking and Mixed values.","functions":["DragInputCallbackType","DragFinishedCallbackType","StatsDragInput()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/components/Stats/utils.ts","label":"Stats utils","kind":"file","path":"packages/excalidraw/components/Stats/utils.ts","weight":247,"shortDescription":"Helpers for Stats panel edits: step sizing, atomic units and element moves.","longDescription":"Defines editable stats properties and step constants, plus utilities that group selected elements into atomic units (groups or single elements) for consistent transforms. moveElement() repositions elements while updating bound text, bindings and frame children, reattaching or removing arrows as needed. Relies heavily on @excalidraw/element group, frame and binding helpers.","functions":["getAtomicUnits()","moveElement()","getStepSizedValue()","isPropertyEditable()","getElementsInAtomicUnit()","newOrigin()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/components/Tooltip.tsx","label":"Tooltip","kind":"file","path":"packages/excalidraw/components/Tooltip.tsx","weight":218,"shortDescription":"Shared document-level tooltip element with positioning and show/hide helpers.","longDescription":"Maintains a single tooltip div per owner document, created lazily and toggled via a visibility class. updateTooltipPosition() places it above or below a target rect while clamping to the owner window viewport, supporting detached or iframe documents. The Tooltip component wraps children and shows the label on hover after TOOLTIP_DELAY.","functions":["Tooltip()","showTooltip()","hideTooltip()","updateTooltipPosition()","getTooltipDiv()","hideDocumentTooltip()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/components/Tools.tsx","label":"Tools","kind":"file","path":"packages/excalidraw/components/Tools.tsx","weight":442,"shortDescription":"Tool definitions, shortcuts and per-tool toolbar button components.","longDescription":"TOOLS is the single source of truth for tool icons, letter/numeric shortcuts, fillability and toggle behavior, consumed by toolbars, keyboard handling and the command palette. Exposes lookup helpers like findShapeByKey() and getToolShortcut(), plus individual *ToolButton components built on IconButton and ToolPopover. Toolbar placement is left to composing toolbars; usage is tracked via analytics.","functions":["TOOLS","findShapeByKey()","getToolShortcut()","getToolLetter()","isToolButtonDisabled()","RectangleToolButton()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/components/Dialog.tsx","label":"Dialog","kind":"file","path":"packages/excalidraw/components/Dialog.tsx","weight":118,"shortDescription":"Modal dialog wrapper with sizing, focus management and close handling.","longDescription":"Renders content inside a Modal and Island with a title and close button, mapping named sizes to pixel widths. On mount it focuses the first meaningful focusable element, traps Tab focus, and restores the previously active element on close. Goes fullscreen on phone form factors and closes the library menu via a jotai atom when opened.","functions":["Dialog()","DialogProps","DialogSize"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/components/ColorPicker/colorPickerUtils.ts","label":"colorPickerUtils","kind":"file","path":"packages/excalidraw/components/ColorPicker/colorPickerUtils.ts","weight":93,"shortDescription":"Color picker helpers for palette lookup, hotkeys and custom color detection.","longDescription":"Resolves a color to its palette name and shade, defines the QWERTY grid hotkey bindings for swatches, and detects colors outside the palette. getMostUsedCustomColors() scans canvas elements' stroke or background colors, ignoring transparent ones, to aw/components/Minimap/minimap-shared.chunk.ts","label":"Minimap shared","kind":"file","path":"packages/excalidraw/components/Minimap/minimap-shared.chunk.ts","weight":526,"shortDescription":"Dependency-free minimap renderer and message protocol shared by worker and main thread.","longDescription":"Encodes elements as flat Float32Array records (BOX, FRAME, PATH) so the main thread copies few numbers while bounds, transforms and drawing run off-thread. Defines transform, viewport, color and config types plus in/out message shapes. createMinimapEndpoint() and MinimapScheduler drive rendering in a worker or fallback; the module deliberately imports nothing to keep the worker chunk small.","functions":["createMinimapEndpoint()","MinimapScheduler","getMinimapViewportRect()","MinimapRecord","MinimapInMessage","MinimapOutMessage"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/components/CommandPalette/CommandPalette.tsx","label":"CommandPalette","kind":"file","path":"packages/excalidraw/components/CommandPalette/CommandPalette.tsx","weight":958,"shortDescription":"Searchable command palette dialog for actions, tools and editor commands.","longDescription":"Builds a categorized command list from actions, TOOLS, library, export, color and custom app-provided commands, filtered with fuzzy matching over deburred labels. Runs inside Dialog with a TextField, keyboard navigation and recent-command tracking via jotai atoms. Uses the ActionManager to execute commands, checks predicates like canChangeStrokeColor, and logs usage through analytics.","functions":["CommandPalette()","DEFAULT_CATEGORIES"],"children":[],"edges":[]},{"id":"more:packages/excalidraw:ui-components","label":"+150 more files","kind":"file","path":"packages/excalidraw/components","weight":3881,"shortDescription":"150 smaller files in this module.","longDescription":"Island.tsx, Spinner.tsx, ConvertElementTypePopup.tsx, FilledButton.tsx, DefaultItems.tsx, Trans.tsx, EyeDropper.tsx, Hyperlink.tsx, Searc n":"Computes cartesian and radar chart dimensions and layout from spreadsheet data. Picks series colors from the palette using a color seed, and builds axis labels, rotated x-labels, legends and base elements such as the title and axes. Uses newElement, newTextElement, measureText and wrapText from @excalidraw/element, takes sizing constants from charts.constants, and checks whether a spreadsheet fits a given chart type.","functions":["isSpreadsheetValidForChartType()","getCartesianChartLayout()","getSeriesColors()","createSeriesLegend()","chartXLabels()","chartBaseElements()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/components/TTDDialog/utils/mermaidError.ts","label":"Mermaid errors","kind":"file","path":"packages/excalidraw/components/TTDDialog/utils/mermaidError.ts","weight":288,"shortDescription":"Classifies Mermaid/Pele parse errors and extracts line numbers and guidance.","longDescription":"Regex-based detection of parse/lexical errors, unknown diagram types, inactive-participant errors and failed lazy chunk loads across browsers. Detects the diagram type from the header line, maps the reported error line back to the source, and builds user-facing guidance and formatted error messages. These utilities feed mermaidAutoFix to decide which errors it can repair.","functions":["isMermaidAutoFixableError()","getMermaidDiagramType()","getMermaidErrorLineNumber()","getMermaidSyntaxErrorGuidance()","formatMermaidParseErrorMessage()","isModuleLoadError()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/charts/charts.constants.ts","label":"chart constants","kind":"file","path":"packages/excalidraw/charts/charts.constants.ts","weight":56,"shortDescription":"Sizing, spacing and styling constants for bar, line and radar charts.","longDescription":"Holds numeric layout constants: cartesian slot widths, gaps, heights and label rotation, plus radar grid levels, padding and legend metrics. Defines commonProps, the shared element styling applied to every chart element so the properties panel shows stable values when a chart group is selected. Consumed by charts.helpers and the individual chart renderers.","functions":["commonProps","CARTESIAN_BASE_SLOT_WIDTH","CARTESIAN_LABEL_ROTATION","BAR_GAP","BAR_HEIGHT","RADAR_GRID_LEVELS"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/components/TTDDialog/utils/mermaidAutoFix.ts","label":"Mermaid auto-fix","kind":"file","path":"packages/excalidraw/components/TTDDialog/utils/mermaidAutoFix.ts","weight":569,"shortDescription":"Generates candidate fixes for Mermaid definitions that failed to parse.","longDescription":"Uses error classification from mermaidError to apply targeted line-level repairs to LLM-generated Mermaid. Repairs include stripping trailing tokens after node shapes, removing extra arrowheads after edge labels, dropping redundant deactivate statements, and fixing end-block or header problems. Each transformation returns a new source string, or null when nothing changed, and these become retry candidates for the converter.","functions":["getMermaidAutoFixCandidates()"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/charts/charts.types.ts","label":"chart types","kind":"file","path":"packages/excalidraw/charts/charts.types.ts","weight":14,"shortDescription":"Types for parsed spreadsheet data and generated chart elements.","longDescription":"Defines Spreadsheet, which holds a title, optional labels and a list of numeric series, along with SpreadsheetSeries. Declares ChartElements as a readonly element array and ParseSpreadsheetResult as an ok/error discriminated union. These types are shared by the parser, the chart renderers and the charts index.","functions":["Spreadsheet","SpreadsheetSeries","ChartElements","ParseSpreadsheetResult"],"children":[],"edges":[]},{"id":"file:packages/excalidraw/components/TTDDialog/TTDDialogPanel.tsx","label":"TTD panel","kind":"file","path":"packages/excalidraw/components/TTDDialog/TTDDialogPanel.tsx","weigh
