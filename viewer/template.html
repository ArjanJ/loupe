<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<title>Loupe</title>
<script>
// Appearance: System / Light / Dark, remembered per browser. Runs before first paint so nothing flashes.
(function () {
  var pref = 'system';
  try { var v = localStorage.getItem('loupe.appearance'); if (v === 'light' || v === 'dark') pref = v; } catch (e) {}
  var dark = pref === 'dark' || (pref === 'system' && !!window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  var el = document.documentElement;
  el.setAttribute('data-theme', dark ? 'dark' : 'light'); el.setAttribute('data-pref', pref); el.style.colorScheme = dark ? 'dark' : 'light';
})();
</script>
<style>
  /*__FONTS__*/
  :root {
    --bg: #f5f5f7;
    /* label-3 is 4.5:1 on the page, cards, inspector, open groups and quiet wells; same ink as label-2, the lightest AA color on those surfaces */
    --label: #1d1d1f; --label-2: rgba(60,60,67,.76); --label-3: rgba(60,60,67,.76);
    --glass: rgba(255,255,255,.72); --glass-solid: rgba(250,250,252,.96); --glass-edge: rgba(0,0,0,.08); --glass-hi: rgba(255,255,255,.9);
    --glass-shadow: 0 0 0 .5px rgba(0,0,0,.06), 0 2px 6px rgba(0,0,0,.05), 0 12px 32px rgba(0,0,0,.10);
    --seg-bg: rgba(118,118,128,.12); --seg-on: #fff; --seg-on-shadow: 0 1px 2px rgba(0,0,0,.10), 0 0 0 .5px rgba(0,0,0,.04);
    --press: rgba(118,118,128,.14); --focus: #007aff; --flow: #007aff; --link: #0066cc;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", system-ui, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, "JetBrains Mono", Consolas, monospace;
  }
  /* macOS-style dark: elevated greys, never pure black; label alphas raised so every text style clears WCAG AA (4.5:1) */
  :root[data-theme="dark"] {
    --bg: #161618;
    --label: #f5f5f7; --label-2: rgba(235,235,245,.72); --label-3: rgba(235,235,245,.56);
    --glass: rgba(40,40,42,.76); --glass-solid: rgba(38,38,40,.97); --glass-edge: rgba(255,255,255,.10); --glass-hi: rgba(255,255,255,.06);
    --glass-shadow: 0 0 0 .5px rgba(255,255,255,.10), inset 0 .5px 0 rgba(255,255,255,.06), 0 2px 6px rgba(0,0,0,.32), 0 12px 32px rgba(0,0,0,.5);
    --seg-bg: rgba(118,118,128,.24); --seg-on: #636366; --seg-on-shadow: 0 1px 2px rgba(0,0,0,.35), inset 0 .5px 0 rgba(255,255,255,.08);
    --press: rgba(118,118,128,.28); --focus: #0a84ff; --flow: #0a84ff; --link: #409cff;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--label);
    font: 13px/1.38 var(--sans); letter-spacing: -0.006em; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  .grid { position: fixed; inset: 0; pointer-events: none; background-repeat: repeat; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; cursor: default; outline: none; }
  canvas.dragging { cursor: grabbing; }
  canvas:focus-visible { box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--focus) 55%, transparent); }
  button { -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 3px solid color-mix(in srgb, var(--focus) 55%, transparent); outline-offset: 1px; }

  /* floating glass capsule */
  #hud { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); height: 48px; box-sizing: border-box;
    max-width: calc(100vw - 48px); display: flex; align-items: center; gap: 8px; padding: 0 6px 0 16px;
    background: var(--glass); border-radius: 24px; box-shadow: var(--glass-shadow);
    -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); user-select: none; }
  #crumbs { display: flex; align-items: center; min-width: 0; overflow: hidden; white-space: nowrap; font-size: 13px; }
  #crumbs button { font: inherit; letter-spacing: inherit; color: var(--label-2); background: none; border: 0; padding: 4px 6px; border-radius: 8px;
    cursor: pointer; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: background-color .15s, color .15s; }
  #crumbs button:hover { color: var(--label); background: var(--press); }
  #crumbs button[aria-current="location"] { color: var(--label); font-weight: 600; }
  #crumbs .sep { width: 12px; height: 12px; flex: none; color: var(--label-3); }
  .divider { width: 1px; height: 20px; background: var(--glass-edge); margin: 0 4px; flex: none; }
  #seg { position: relative; display: flex; padding: 2px; border-radius: 9px; background: var(--seg-bg); flex: none; }
  #seg .thumb { position: absolute; top: 2px; bottom: 2px; left: 2px; border-radius: 7px; background: var(--seg-on); box-shadow: var(--seg-on-shadow);
    transition: transform .38s cubic-bezier(.32,.72,0,1), width .38s cubic-bezier(.32,.72,0,1); }
  #seg button { position: relative; font: 500 12px var(--sans); letter-spacing: -0.01em; color: var(--label-2); background: none; border: 0;
    padding: 0 12px; height: 28px; border-radius: 7px; cursor: pointer; transition: color .2s; }
  #seg button[aria-pressed="true"] { color: var(--label); font-weight: 600; }
  .icon { width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 16px;
    background: none; color: var(--label); opacity: .78; cursor: pointer; flex: none; transition: background-color .15s, opacity .15s; }
  .icon:hover { background: var(--press); opacity: 1; }
  .icon:active { transform: scale(.94); }

  #toast { position: fixed; left: 50%; bottom: 84px; transform: translate(-50%, 6px); padding: 6px 12px; border-radius: 14px; font: 500 12px var(--sans);
    color: var(--label); background: var(--glass); box-shadow: var(--glass-shadow); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .3s cubic-bezier(.32,.72,0,1); white-space: nowrap; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #themeBtn svg { transition: transform .35s cubic-bezier(.32,.72,0,1), opacity .2s; }
  #themeBtn:active svg { transform: rotate(-30deg) scale(.92); }
  #hint { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); font-size: 12px; color: var(--label-3);
    pointer-events: none; transition: opacity .6s ease; white-space: nowrap; letter-spacing: -0.003em; }
  #hint.gone { opacity: 0; }

  #tip { position: fixed; pointer-events: none; max-width: 300px; padding: 10px 12px; display: block; opacity: 0; box-sizing: border-box;
    background: var(--glass); border-radius: 12px; box-shadow: var(--glass-shadow); transition: opacity .18s ease;
    -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); }
  #tip.on { opacity: 1; }
  #tipLabel { font-size: 13px; font-weight: 600; color: var(--label); letter-spacing: -0.01em; }
  #tipDesc { font-size: 12px; color: var(--label-2); margin-top: 2px; }
  #tipPath { font: 11px var(--mono); color: var(--label-3); margin-top: 6px; word-break: break-all; }
  .pill { height: 32px; padding: 0 12px; border: 0; border-radius: 16px; background: none; color: var(--label); font: 500 13px var(--sans);
    letter-spacing: -0.01em; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; flex: none; max-width: 220px; transition: background-color .15s; }
  .pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill:hover, .pill[aria-expanded="true"], .icon[aria-expanded="true"] { background: var(--press); opacity: 1; }
  .pill .dot { width: 7px; height: 7px; border-radius: 4px; background: var(--flow); display: none; flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--flow) 22%, transparent); }
  .pill.active .dot { display: block; }
  .glass { background: var(--glass); box-shadow: var(--glass-shadow); }
  /* blur only while shown: a hidden backdrop-filter layer still costs a full composite every frame */
  .glass.on { -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); transition: opacity .2s ease, transform .3s cubic-bezier(.32,.72,0,1), background-color .2s; }
  /* while the camera moves the side panels drop the live blur for a near-opaque fill (same look, no per-frame re-blur) */
  body.moving .glass.on { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--glass-solid); }
  #pop:not(.on), #insp:not(.on) { visibility: hidden; transition: opacity .18s ease, transform .26s cubic-bezier(.32,.72,0,1), visibility 0s linear .26s; }
  #pop { position: fixed; bottom: 82px; left: 0; width: 344px; max-height: min(62vh, 540px); overflow: auto; border-radius: 18px; padding: 6px; box-sizing: border-box;
    opacity: 0; transform: translateY(8px) scale(.98); transform-origin: 50% 100%; pointer-events: none; overscroll-behavior: contain;
    transition: opacity .18s ease, transform .26s cubic-bezier(.32,.72,0,1); }
  #pop.on, #insp.on { opacity: 1; transform: none; pointer-events: auto; }
  .pop-h { display: flex; align-items: center; gap: 6px; font: 600 15px var(--sans); letter-spacing: -0.015em; color: var(--label); padding: 10px 10px 2px; }
  .pop-h .back { width: 26px; height: 26px; margin-left: -4px; }
  .pop-sub { font-size: 12px; color: var(--label-2); padding: 2px 10px 8px; }
  .pop-foot { font-size: 11.5px; color: var(--label-3); padding: 8px 10px 4px; border-top: .5px solid var(--glass-edge); margin-top: 6px; }
  .row { display: flex; gap: 10px; align-items: flex-start; width: 100%; box-sizing: border-box; text-align: left; border: 0; background: none; padding: 8px 10px;
    border-radius: 11px; color: var(--label); font: inherit; letter-spacing: inherit; cursor: pointer; transition: background-color .15s; }
  .row:hover { background: var(--press); }
  .rb { min-width: 0; flex: 1; }
  .rt { display: flex; align-items: baseline; gap: 8px; }
  .row .t, .legend-row .t { font: 600 13px var(--sans); letter-spacing: -0.01em; color: var(--label); }
  .row .d, .legend-row .d { font-size: 12px; color: var(--label-2); margin-top: 1px; }
  .cnt { margin-left: auto; font: 500 11px var(--sans); color: var(--label-3); flex: none; font-variant-numeric: tabular-nums; }
  .num { flex: none; width: 20px; height: 20px; border-radius: 10px; box-sizing: border-box; border: 1.5px solid var(--flow); color: var(--link);
    font: 600 11px/17px var(--sans); text-align: center; transition: background-color .2s, color .2s; }
  .row.cur { background: color-mix(in srgb, var(--flow) 10%, transparent); }
  .row.cur .num { background: var(--flow); color: #fff; }
  .insp-status { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; padding: 0 16px 8px; }
  .stag { font: 600 10.5px/16px var(--sans); padding: 0 7px; border-radius: 8px; background: var(--seg-bg); color: var(--label-2); white-space: nowrap; }
  .stag.dash { background: transparent; box-shadow: inset 0 0 0 1px var(--label-3); }
  .insp-note { flex-basis: 100%; font-size: 12px; line-height: 1.4; color: var(--label-2); margin-top: 3px; }
  .tag { font: 500 10px var(--sans); color: var(--label-3); border: .5px solid var(--label-3); border-radius: 5px; padding: 0 4px; margin-left: 6px; vertical-align: 1px; }
  .legend-row { display: flex; align-items: center; gap: 12px; padding: 7px 10px; }
  .legend-row { align-items: center; padding: 6px 10px; }
  .legend-row .ck { width: 16px; height: 16px; flex: none; color: var(--link); }
  .legend-row .ck svg { width: 16px; height: 16px; }
  .legend-row[aria-checked="false"] .ck { visibility: hidden; }
  .legend-row[aria-checked="false"] canvas, .legend-row[aria-checked="false"] .lt { opacity: .4; }
  #pop canvas, #insp canvas { position: static; inset: auto; display: block; flex: none; }
  .lt { min-width: 0; }
  .toggle { align-items: center; margin-top: 2px; }
  .toggle .t { font-weight: 500; flex: 1; }
  .toggle .sw { flex: none; width: 38px; height: 23px; border-radius: 12px; background: var(--seg-bg); position: relative; transition: background-color .2s; }
  .toggle .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 19px; height: 19px; border-radius: 10px; background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .25s cubic-bezier(.32,.72,0,1); }
  .toggle[aria-checked="true"] .sw { background: var(--focus); }
  .toggle[aria-checked="true"] .sw::after { transform: translateX(15px); }
  #insp { position: fixed; top: 16px; right: 16px; width: 344px; max-height: calc(100vh - 112px); overflow: hidden; border-radius: 18px; padding: 4px 6px 8px;
    box-sizing: border-box; opacity: 0; transform: translateX(10px); pointer-events: none; overscroll-behavior: contain;
    transition: opacity .2s ease, transform .3s cubic-bezier(.32,.72,0,1); }
  .insp-head { display: flex; gap: 8px; align-items: flex-start; padding: 10px 4px 4px 10px; }
  .insp-ttl { min-width: 0; flex: 1; }
  .transport { display: flex; align-items: center; gap: 2px; margin: 0 6px 6px; padding: 3px; border-radius: 12px; background: var(--seg-bg); }
  .transport .icon { width: 30px; height: 30px; opacity: .85; }
  .transport .pos { margin-left: auto; padding-right: 10px; font: 500 12px var(--sans); color: var(--label-2); font-variant-numeric: tabular-nums; }
  .insp-kicker { font: 600 11px var(--sans); color: var(--link); letter-spacing: .02em; text-transform: uppercase; margin-bottom: 1px; }
  .insp-title { font: 600 17px var(--sans); letter-spacing: -0.02em; color: var(--label); }
  .insp-path { font: 11px var(--mono); color: var(--label-3); margin-top: 2px; word-break: break-all; }
  .close { width: 26px; height: 26px; background: var(--seg-bg); opacity: .7; }
  .iseg { display: flex; margin: 6px 10px 4px; padding: 2px; border-radius: 9px; background: var(--seg-bg); }
  .iseg button { flex: 1; height: 28px; border: 0; border-radius: 7px; background: none; color: var(--label-2); font: 500 12px var(--sans); letter-spacing: -0.01em;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background-color .2s, color .2s; }
  .iseg button[aria-selected="true"] { background: var(--seg-on); box-shadow: var(--seg-on-shadow); color: var(--label); font-weight: 600; }
  .iseg .sn { font-weight: 500; color: var(--label-3); font-variant-numeric: tabular-nums; }
  .insp-body { overflow: auto; max-height: calc(100vh - 240px); padding-bottom: 20px; overscroll-behavior: contain;
    -webkit-mask-image: linear-gradient(#000 calc(100% - 24px), transparent); mask-image: linear-gradient(#000 calc(100% - 24px), transparent); }
  .irow { padding: 0 0 4px; }
  .irow .row { padding: 8px 10px 2px; }
  .cap { margin-left: auto; flex: none; font: 600 11px/18px var(--sans); color: var(--label-2); background: var(--seg-bg); border-radius: 9px; padding: 0 7px; font-variant-numeric: tabular-nums; }
  .disc { display: inline-flex; align-items: center; gap: 2px; margin: 0 0 2px 6px; padding: 2px 6px 2px 2px; border: 0; background: none; border-radius: 6px;
    font: 500 11px var(--sans); color: var(--link); cursor: pointer; }
  .disc:hover { background: var(--press); }
  .disc svg { width: 12px; height: 12px; transition: transform .2s; }
  .disc[aria-expanded="true"] svg { transform: rotate(90deg); }
  .sec { display: flex; align-items: baseline; gap: 6px; font: 600 13px var(--sans); color: var(--label-2); padding: 14px 10px 2px; }
  .sec-n { font-weight: 500; color: var(--label-3); }
  .kindh { display: flex; align-items: center; gap: 8px; padding: 8px 10px 0; font: 600 11px var(--sans); color: var(--label-2); letter-spacing: .01em; }
  .kindh .kd { font-weight: 400; color: var(--label-3); }
  .irow { padding: 6px 10px; }
  .ev { display: flex; gap: 8px; font: 11.5px/1.55 var(--mono); color: var(--label-2); white-space: nowrap; overflow: hidden; padding: 0 10px 0 26px; }
  .evf { color: var(--label-2); flex: none; }
  .evs { overflow: hidden; text-overflow: ellipsis; }
  .empty-note { font-size: 12px; color: var(--label-3); padding: 12px 10px; }
  #empty { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
    color: var(--label-2); padding: 24px; }
  #empty code { color: var(--label); font-family: var(--mono); }
</style>
</head>
<body>
<div id="grid0" class="grid" aria-hidden="true"></div><div id="grid1" class="grid" aria-hidden="true"></div>
<canvas id="c" tabindex="0" aria-label="Architecture map. Scroll or pinch to zoom, drag or arrow keys to pan, Escape to zoom out one level."></canvas>
<div id="hud" role="toolbar" aria-label="Map controls">
  <nav id="crumbs" aria-label="Breadcrumb"></nav>
  <span class="divider" aria-hidden="true"></span>
  <div id="seg" role="group" aria-label="Detail level"><span class="thumb" aria-hidden="true"></span></div>
  <span class="divider" aria-hidden="true"></span>
  <button class="pill" id="flowsBtn" type="button" aria-haspopup="dialog" aria-expanded="false" title="End-to-end flows"><i class="dot" aria-hidden="true"></i><span id="flowsLabel">Flows</span></button>
  <button class="icon" id="themeBtn" type="button" title="Appearance" aria-label="Appearance"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg></button>
  <button class="icon" id="legendBtn" type="button" title="Legend" aria-label="Legend" aria-haspopup="dialog" aria-expanded="false">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 5h12"/><path d="M3 9h12" stroke-dasharray="3 2.6"/><path d="M3 13h12" stroke-dasharray="0.01 3.2" stroke-width="2.2"/></svg>
  </button>
  <span class="divider" aria-hidden="true"></span>
  <button class="icon" id="zoomOut" type="button" title="Zoom out (−)" aria-label="Zoom out">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3.5 8h9"/></svg>
  </button>
  <button class="icon" id="zoomIn" type="button" title="Zoom in (+)" aria-label="Zoom in">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3.5 8h9M8 3.5v9"/></svg>
  </button>
  <button class="icon" id="fit" type="button" title="Show everything (0)" aria-label="Show everything">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 2.5h4v4M6.5 13.5h-4v-4M13.5 2.5 9.2 6.8M2.5 13.5l4.3-4.3"/></svg>
  </button>
</div>
<div id="pop" class="glass" role="dialog" aria-hidden="true"></div>
<aside id="insp" class="glass" aria-label="Relationships" aria-hidden="true"></aside>
<div id="toast" role="status" aria-live="polite"></div>
<div id="hint">Scroll or pinch to zoom in · Drag to pan</div>
<div id="tip" aria-hidden="true"><div id="tipLabel"></div><div id="tipDesc"></div><div id="tipPath"></div></div>
<div id="empty"><div>No tree is inlined in this file.<br>Build it with <code>loupe render &lt;tree.json&gt; [out.html]</code>.</div></div>
<script>
'use strict';
const DATA = /*__ZOOM_TREE__*/null;

(() => {
  // ---------------------------------------------------------------- tuning
  const WORLD_W = 1600, WORLD_H = 1000;
  const OPEN_START = 0.5, OPEN_END = 0.8;   // a card opens as max(screenW / viewportW, screenH / viewportH) goes START -> END
  const FOCUS_FILL = 0.6;                   // focused group = deepest open box filling at least this much of the viewport
  const CARD_FADE_END = 0.4, CHILD_FADE_START = 0.3, CHILD_FADE_END = 0.75; // card content fades out first, then children fade in
  const ASPECT = WORLD_W / WORLD_H;         // children are laid out roughly screen-shaped
  const HOME_ZOOM = 0.42;                   // first screen: one closed root card (relative to fit-root)
  const PAD = 16, GAP = 16, HEADER = 44;    // group padding / gap between cards / group title band, screen px (8pt grid)
  const MIN_DRAW_PX = 2;
  const MIN_TEXT_PX = 11;                   // never render text smaller than this
  const MIN_ZOOM = 0.3;                     // relative to fit-root scale; the max is computed (see maxScale)
  const WHEEL_K = 0.0015, PINCH_K = 0.01;
  const SMOOTH_RATE = 16;                   // 1/s, exponential approach of camera to wheel target
  const FLY_MS = 720;                       // spring camera moves (double-click, Fit, breadcrumb)
  const HOVER_MS = 160;
  const MIN_WEIGHT_FRAC = 0.04;
  const MAX_TEXT_W = 520;                   // measure (line length) cap for card text, content px

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const $ = (id) => document.getElementById(id);
  const hasLetterSpacing = 'letterSpacing' in ctx;

  // ---------------------------------------------------------------- themes (light is the hero)
  const THEMES = {
    light: {
      bg: '#f5f5f7', dot: 'rgba(0,0,0,0.075)',
      card: '#ffffff', cardHair: 'rgba(0,0,0,0.06)',
      shadowNear: 'rgba(0,0,0,0.06)', shadowFar: 'rgba(0,0,0,0.075)',
      group: '#ebebee', groupHair: 'rgba(0,0,0,0.035)', // solid group-over-bg; nested opens must not stack darker
      quiet: 'rgba(118,118,128,0.08)',
      label: '#1d1d1f', label2: 'rgba(60,60,67,0.76)', label3: 'rgba(60,60,67,0.76)',

    if (flowFreeze) { flowT0 = now - (flowFreeze.i + flowFreeze.u) * STEP_MS; flowFreeze = null; }
    else { const c = flowClock(now); flowFreeze = { i: Math.min(c.i, activeFlow.steps.length - 1), u: c.i >= activeFlow.steps.length ? 0.62 : c.u }; }

  }
  function flyToNodes(list, margin = 0.86, ms = FLY_MS) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;

    const w = x1 - x0, h = y1 - y0, right = insp.classList.contains('on') || activeFlow ? 360 : 0;
    const want = Math.min(((W - right) * margin) / w, ((H - 120) * margin) / h), floor = overviewView().scale;
    let sc = clampScale(Math.max(floor, want)); // never so far out that the map closes
    // never park the camera mid-crossfade: a box holding only some of the nodes is either open or closed

  }
  function flowBounds(f) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const s of f.steps) for (const n of [s.a, s.b]) { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x + n.w); y1 = Math.max(y1, n.y + n.h); }

  }
  function startFlow(f) {
    activeFlow = f; flowT0 = performance.now(); flowFreeze = null; selected = null; flowTour = true; flowStepShown = -1;
    flowsBtn.classList.add('active'); $('flowsLabel').textContent = f.title;
    // show the smallest open box that holds every step, so steps read at module level
    openPop(null); inspMode = 'node'; requestRender();
  }
  function stopFlow() {
    activeFlow = null; flowFreeze = null; flowsBtn.classList.remove('active'); $('flowsLabel').textContent = 'Flows'; requestRender();
    if (popKind === 'flows') openPop('flows');
    updateInspector();
  }
  flowsBtn.addEventListener('click', () => { dismissHint(); openPop(popKind === 'flows' ? null : 'flows'); });
  legendBtn.addEventListener('click', () => { dismissHint(); openPop(popKind === 'legend' ? null : 'legend'); });
  if (!FLOWS.length) flowsBtn.style.display = 'none';
  if (!RELS.length) { legendBtn.style.display = 'none'; }

  // ---------------------------------------------------------------- picking + tooltip (only when the card hides its text)
  function pick(sx, sy) {
    for (let i = visible.length - 1; i >= 0; i--) {
      const v = visible[i];
      if (v.alpha < 0.5) continue;
      if (sx >= v.sx && sx <= v.sx + v.sw && sy >= v.sy && sy <= v.sy + v.sh) return v;
    }
    return null;
  }
  const tip = $('tip');
  let tipNode = null, tipTimer = 0;
  let tipEdge = null;
  function onHover(sx, sy) {
    const e = edgeAt(sx, sy);
    const ek = e ? e.key : null;
    if (ek !== hoverEdge) { hoverEdge = ek; requestRender(); }
    if (e) {
      setHover(null); canvas.style.cursor = 'default';
      if (tipEdge !== e.key) {
        hideTip(); tipEdge = e.key;
        const g = e.g, ru = rollup(g.A, g.B);
        $('tipLabel').textContent = `${g.A.label ?? g.A.id} → ${g.B.label ?? g.B.id}`;
        $('tipDesc').textContent = ru && ru.summary ? String(ru.summary) : groupLabel(g);
        $('tipPath').textContent = kindsSummary(g.kinds); $('tipPath').style.display = '';
        tipTimer = setTimeout(() => tip.classList.add('on'), 250);
      }
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      tip.style.left = Math.max(8, Math.min(W - tw - 8, sx + 16)) + 'px';
      tip.style.top = Math.max(8, sy + 20 + th > H ? sy - th - 12 : sy + 20) + 'px';
      return;
    }
    if (tipEdge) { hideTip(); }
    const v = pick(sx, sy);
    const card = v && v.t < 0.5 ? v.n : null; // open groups don't light up
    setHover(card);
    canvas.style.cursor = card ? 'pointer' : 'default';
    if (!card || v.showsDesc || (!card.shortDescription && !card.path)) { hideTip(); return; }
    if (card !== tipNode) {
      hideTip(); tipNode = card;
      $('tipLabel').textContent = String(card.label ?? card.id);
      $('tipDesc').textContent = card.shortDescription || '';
      $('tipPath').textContent = card.path || '';
      $('tipPath').style.display = card.path ? '' : 'none';
      tipTimer = setTimeout(() => tip.classList.add('on'), 450);
    }
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(W - tw - 8, sx + 16)) + 'px';
    tip.style.top = Math.max(8, sy + 20 + th > H ? sy - th - 12 : sy + 20) + 'px';
  }
  function hideTip() { clearTimeout(tipTimer); tip.classList.remove('on'); tipNode = null; tipEdge = null; }

  // ---------------------------------------------------------------- input
  const hint = $('hint');
  let hintGone = false;
  function dismissHint() { if (!hintGone) { hintGone = true; hint.classList.add('gone'); } }
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    dismissHint(); hideTip(); flowTour = false;
    let dy = e.deltaY;
    if (e.deltaMode === 1) dy *= 16; else if (e.deltaMode === 2) dy *= H;
    const k = e.ctrlKey ? PINCH_K : WHEEL_K;
    zoomAt(e.clientX, e.clientY, Math.exp(-clamp(dy, -300, 300) * k));
  }, { passive: false });

  const pointers = new Map();
  let pinch = null, drag = null, press = null;
  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    fly = null; wheelAnim = null; hideTip(); dismissHint(); flowTour = false;
    if (pointers.size === 1) { drag = { x: e.clientX, y: e.clientY }; press = { x: e.clientX, y: e.clientY, moved: false }; }

  });
  function pinchState() {
    const [a, b] = [...pointers.values()];
    return { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
  }
  canvas.addEventListener('pointermove', (e) => {
    const p = pointers.get(e.pointerId);
    if (!p) { onHover(e.clientX, e.clientY); return; }
    p.x = e.clientX; p.y = e.clientY;
    if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 4) press.moved = true;
    if (pinch && pointers.size >= 2) {
      const s = pinchState();
      const wx = toWX(pinch.mx), wy = toWY(pinch.my);
      const ns = clampScale(cam.scale * (s.d / pinch.d));

      pinch = s;
    } else if (drag) {
      if (!canvas.classList.contains('dragging')) canvas.classList.add('dragging');
      setCam(cam.x - (e.clientX - drag.x) / cam.scale, cam.y - (e.clientY - drag.y) / cam.scale, cam.scale);
      drag.x = e.clientX; drag.y = e.clientY;
    }
  });
  const endPointer = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 1) { const [p] = pointers.values(); drag = { x: p.x, y: p.y }; }
    if (pointers.size === 0) { drag = null; canvas.classList.remove('dragging'); }
  };
  function clickAt(sx, sy) {
    if (popKind) openPop(null);
    if (activeFlow) return;
    const v = pick(sx, sy);
    const card = v && v.t < 0.5 && v.n.parent && !v.n.quiet ? v.n : null;
    selected = card; inspHover = null;
    requestRender();
  }
  canvas.addEventListener('pointerup', (e) => {
    const wasClick = press && !press.moved && pointers.size === 1;

  canvas.addEventListener('dblclick', (e) => {
    e.preventDefault();
    const v = pick(e.clientX, e.clientY);
    if (!v) return;

  });
  const goHome = () => { flyTo(homeView()); };
  $('fit').addEventListener('click', () => { dismissHint(); goHome(); });
  $('zoomIn').addEventListener('click', () => { dismissHint(); zoomAt(W / 2, H / 2, 1.6); });
  $('zoomOut').addEventListener('click', () => { dismissHint(); zoomAt(W / 2, H / 2, 1 / 1.6); });
  window.addEventListener('keydown', (e) => {
    if (e.target instanceof HTMLInputElement || e.ctrlKey || e.metaKey || e.altKey) return;

      else goToLevel(currentLevel() - 1);

    else if (activeFlow && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) stepFlow(e.key === 'ArrowLeft' ? -1 : 1);

    else if (e.key === 'ArrowRight') flyTo({ x: cam.x + pan, y: cam.y, scale: cam.scale }, 260);
    else if (e.key === 'ArrowUp') flyTo({ x: cam.x, y: cam.y - pan, scale: cam.scale }, 260);

  });
  window.addEventListener('resize', () => { resize(); placeThumb(); if (popKind) placePop(popKind === 'legend' ? legendBtn : flowsBtn); });
  // ---------------------------------------------------------------- appearance: System -> Light -> Dark

  const THEME_ICONS = { // SF-Symbols-like: circle.lefthalf.filled, sun.max, moon
    system: ['M9 2.75a6.25 6.25 0 1 0 0 12.5a6.25 6.25 0 1 0 0-12.5z', 'M9 2.75v12.5a6.25 6.25 0 0 1 0-12.5z|fill'],
    light: ['M9 6.1a2.9 2.9 0 1 0 0 5.8a2.9 2.9 0 1 0 0-5.8z', 'M9 1.8v1.6M9 14.6v1.6M1.8 9h1.6M14.6 9h1.6M3.9 3.9l1.15 1.15M12.95 12.95l1.15 1.15M3.9 14.1l1.15-1.15M12.95 5.05l1.15-1.15'],
    dark: ['M14.6 11.2A6.3 6.3 0 0 1 6.8 3.4a6.3 6.3 0 1 0 7.8 7.8z'],

  const THEME_NAMES = { system: 'System', light: 'Light', dark: 'Dark' }, NEXT = { system: 'light', light: 'dark', dark: 'system' };
  function drawThemeIcon() {
    const svg = themeBtn.querySelector('svg');
    svg.replaceChildren();
    for (const d of THEME_ICONS[themePref]) {
      const [path, mode] = d.split('|');
      const el2 = document.createElementNS('http://www.w3.org/2000/svg', 'path'); el2.setAttribute('d', path);
      if (mode === 'fill') { el2.setAttribute('fill', 'currentColor'); el2.setAttribute('stroke', 'none'); }
      svg.appendChild(el2);
    }
    const label = `Appearance: ${THEME_NAMES[themePref]}${themePref === 'system' ? (darkQuery && darkQuery.matches ? ' (dark)' : ' (light)') : ''}. Click for ${THEME_NAMES[NEXT[themePref]]}.`;
    themeBtn.title = label; themeBtn.setAttribute('aria-label', label);
  }
  function applyTheme() {
    const dark = themePref === 'dark' || (themePref === 'system' && !!darkQuery && darkQuery.matches);
    const root = document.documentElement;
    root.setAttribute('data-theme', dark ? 'dark' : 'light'); root.setAttribute('data-pref', themePref); root.style.colorScheme = dark ? 'dark' : 'light';

  resize();
  { const h = homeView(); cam.x = h.x; cam.y = h.y; cam.scale = h.scale; }
  render();
  if (document.fonts) {
    document.fonts.load(`600 16px ${FONT}`).catch(() => {});
    document.fonts.ready.then(() => { wrapCache.clear(); requestRender(); placeThumb(); });
  }

  window.__sz = {
    setCamera(x, y, scale) { fly = null; wheelAnim = null; setCam(+x, +y, +scale); render(); },
    fitNode(id, animate = true) {
      const n = byId.get(id);
      if (!n) return false;
      const t = fitFocus(n);
      if (animate) flyTo(t); else this.setCamera(t.x, t.y, t.scale);
      return true;
    },
    home(animate = false) { const h = homeView(); if (animate) flyTo(h); else this.setCamera(h.x, h.y, h.scale); },
    get camera() { return { x: cam.x, y: cam.y, scale: cam.scale, fitScale, maxScale }; },
    nodes,
    rect(id) { const n = byId.get(id); if (!n) return null; rectCache = new Map(); return srect(n); },
    visible() { return visible.map((v) => ({ id: v.n.id, depth: v.n.depth, alpha: v.alpha, openness: v.t, sx: v.sx, sy: v.sy, sw: v.sw, sh: v.sh })); },
    focused() { return focused ? focused.id : null; },
    hud() { return { crumbs: [...crumbsEl.querySelectorAll('button')].map((b) => b.textContent).join(' › '), level: LEVEL_NAMES[levelKey - 1] || String(levelKey) }; },
    select(id) { selected = byId.get(id) || null; inspKey = '\u0001'; render(); return !!selected; },
    hover(id) { const n = byId.get(id) || null; setHover(n); hoverK = n ? 1 : 0; hoverDir = 0; if (!n) hoverNode = null; render(); },
    edges() { return drawnEdges.map((e) => ({ from: e.g.A.id, to: e.g.B.id, kind: e.g.primary, label: groupLabel(e.g), count: e.g.count, alpha: +e.a.toFixed(3), points: e.pts.length })); },
    inspector() { return { open: insp.classList.contains('on'), text: insp.textContent, rows: insp.querySelectorAll('.irow').length }; },
    popover(kind) { if (kind !== undefined) openPop(kind || null); return { kind: popKind, text: pop.textContent }; },
    flows() { return FLOWS.map((f) => ({ id: f.id, title: f.title, steps: f.steps.length })); },
    playFlow(id, step, u) { const f = FLOWS.find((x) => x.id === id); if (!f) { stopFlow(); return false; } if (activeFlow !== f) startFlow(f); flowFreeze = step == null ? null : { i: +step, u: +u || 0 }; requestRender(); return true; },
    stopFlow() { stopFlow(); openPop(null); },
    relations: RELS.length,
    degree(id) { const n = byId.get(id); return n ? RELS.filter((r) => within(n, r.a) !== within(n, r.b)).length : 0; },
    theme() { return { pref: themePref, resolved: T === THEMES.dark ? 'dark' : 'light', attr: document.documentElement.getAttribute('data-theme') }; },
    setTheme(p) { themePref = p === 'light' || p === 'dark' ? p : 'system'; applyTheme(); },
    checkText() { textCheck.on = true; textCheck.violations = []; textCheck.drawn = 0; render(); textCheck.on = false; return { drawn: textCheck.drawn, violations: textCheck.violations.slice() }; },
    get animating() { return !!(fly || wheelAnim || fading); },
    get edgeAnimating() { return relAnimating; },
  };
})();
